<script>

const $ =
id =>
document.getElementById(id);


/* =========================
   初始化選單
========================= */

for(
  let cm=1;
  cm<=20;
  cm++
){

  const option =
  document.createElement(
    "option"
  );


  option.value =
  String(cm);


  option.textContent =
  `${cm} cm`;


  if(cm === 2){

    option.selected =
    true;

  }


  $("barcodeHeight")
  .appendChild(
    option
  );

}


for(
  let mm=1;
  mm<=20;
  mm++
){

  const option =
  document.createElement(
    "option"
  );


  option.value =
  String(mm);


  option.textContent =
  `${mm} mm`;


  if(mm === 2){

    option.selected =
    true;

  }


  $("itemGap")
  .appendChild(
    option
  );

}


/* =========================
   BLE UUID
========================= */

const SERVICE =
"49535343-fe7d-4ae5-8fa9-9fafd205e455";

const WRITE_UUID =
"49535343-8841-43f4-a8d4-ecbe34729bb3";

const NOTIFY_UUID =
"49535343-1e4d-4bd9-ba61-23c647249616";


const state = {

  items:[],

  device:null,

  server:null,

  write:null,

  notify:null,

  rx:[],

  printing:false,

  forceStop:false

};


/* =========================
   工具
========================= */

function delay(ms){

  return new Promise(
    resolve =>
    setTimeout(resolve,ms)
  );

}


function mmToPx(mm){

  return Math.round(
    mm * 203 / 25.4
  );

}


function cmToPx(cm){

  return mmToPx(
    cm * 10
  );

}


function paperDots(mm){

  return Math.max(
    8,
    Math.floor(
      mmToPx(mm) / 8
    ) * 8
  );

}


function u16(value){

  return [
    (value >> 8) & 255,
    value & 255
  ];

}


function hex(bytes){

  return Array
  .from(bytes)
  .map(
    value =>
    value
    .toString(16)
    .padStart(2,"0")
    .toUpperCase()
  )
  .join(" ");

}


function log(text){

  const box =
  $("log");


  box.value +=
  `[${new Date().toLocaleTimeString()}] ${text}\n`;


  box.scrollTop =
  box.scrollHeight;

}


function escapeHtml(text){

  return String(text ?? "")
  .replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char])
  );

}


/* =========================
   NIIMBOT Frame
========================= */

function frame(
  command,
  data=[1],
  prefix=false
){

  const payload =
  Array.from(data);


  let checksum =
  command ^
  payload.length;


  for(const value of payload){

    checksum ^=
    value;

  }


  const packet = [

    0x55,
    0x55,

    command,

    payload.length,

    ...payload,

    checksum & 255,

    0xAA,
    0xAA

  ];


  if(prefix){

    packet.unshift(0x03);

  }


  return new Uint8Array(
    packet
  );

}


/* =========================
   控制封包
========================= */

const CONTROL = {

  connect:
  () =>
  frame(
    0xC1,
    [1],
    true
  ),


  density:
  value =>
  frame(
    0x21,
    [value]
  ),


  labelType:
  value =>
  frame(
    0x23,
    [value]
  ),


  printStart:
  () =>
  frame(
    0x01,
    [1]
  ),


  pageStart:
  () =>
  frame(
    0x03,
    [1]
  ),


  pageSize:
  (height,width) =>
  frame(
    0x13,
    [
      ...u16(height),
      ...u16(width)
    ]
  ),


  pageEnd:
  () =>
  frame(
    0xE3,
    [1]
  ),


  printEnd:
  () =>
  frame(
    0xF3,
    [1]
  )

};


/* =========================
   RX
========================= */

function parsePackets(text){

  const bytes =
  String(text || "")
  .trim()
  .split(/\s+/)
  .filter(Boolean)
  .map(
    value =>
    parseInt(value,16)
  );


  const output = [];

  let position = 0;


  while(position < bytes.length){

    if(
      bytes[position] !== 0x55
      ||
      bytes[position+1] !== 0x55
    ){

      position++;

      continue;

    }


    const command =
    bytes[position+2];


    const length =
    bytes[position+3];


    const checksumIndex =
    position +
    4 +
    length;


    const tail =
    checksumIndex +
    1;


    if(
      tail + 1 >=
      bytes.length
    ){

      break;

    }


    if(
      bytes[tail] !== 0xAA
      ||
      bytes[tail+1] !== 0xAA
    ){

      position++;

      continue;

    }


    const payload =
    bytes.slice(
      position+4,
      position+4+length
    );


    let checksum =
    command ^
    length;


    for(const value of payload){

      checksum ^=
      value;

    }


    output.push({

      command,

      payload,

      checksumOk:
      (checksum & 255)
      ===
      bytes[checksumIndex]

    });


    position =
    tail + 2;

  }


  return output;

}


/* =========================
   BLE Write
========================= */

async function writeRaw(bytes){

  if(!state.write){

    throw new Error(
      "B3S 尚未連線"
    );

  }


  const chunkSize =
  20;


  for(
    let index=0;
    index<bytes.length;
    index+=chunkSize
  ){

    if(state.forceStop){

      throw new Error(
        "FORCE_STOP"
      );

    }


    const part =
    bytes.slice(
      index,
      index+chunkSize
    );


    if(
      state.write.properties.writeWithoutResponse
      &&
      state.write.writeValueWithoutResponse
    ){

      await state.write
      .writeValueWithoutResponse(part);

    }

    else if(
      state.write.writeValueWithResponse
    ){

      await state.write
      .writeValueWithResponse(part);

    }

    else{

      await state.write
      .writeValue(part);

    }


    if(bytes.length > chunkSize){

      await delay(5);

    }

  }

}


async function writeControl(bytes){

  if(!state.write){

    throw new Error(
      "B3S 尚未連線"
    );

  }


  if(
    state.write.properties.writeWithoutResponse
    &&
    state.write.writeValueWithoutResponse
  ){

    await state.write
    .writeValueWithoutResponse(bytes);

  }

  else if(
    state.write.writeValueWithResponse
  ){

    await state.write
    .writeValueWithResponse(bytes);

  }

  else{

    await state.write
    .writeValue(bytes);

  }

}


/* =========================
   ACK
========================= */

async function sendWait(
  packet,
  expected,
  timeout=3500
){

  const startIndex =
  state.rx.length;


  log(
    "TX：" +
    hex(packet)
  );


  await writeControl(
    packet
  );


  const start =
  Date.now();


  while(
    Date.now() - start <
    timeout
  ){

    const incoming =
    state.rx.slice(
      startIndex
    );


    for(const raw of incoming){

      for(
        const parsed
        of parsePackets(raw)
      ){

        if(!parsed.checksumOk){

          continue;

        }


        if(parsed.command === 0x00){

          return {
            ok:false,
            unsupported:true,
            packet:parsed
          };

        }


        if(parsed.command === expected){

          return {
            ok:true,
            packet:parsed
          };

        }

      }

    }


    await delay(35);

  }


  return {
    ok:false,
    timeout:true
  };

}


async function ackStep(
  label,
  packet,
  expected,
  timeout=3500
){

  if(state.forceStop){

    throw new Error(
      "FORCE_STOP"
    );

  }


  $("printStatus")
  .className =
  "status warn";


  $("printStatus")
  .textContent =
  label;


  const result =
  await sendWait(
    packet,
    expected,
    timeout
  );


  if(result.ok){

    return result;

  }


  if(result.unsupported){

    throw new Error(
      `${label}：B3S 不支援此設定`
    );

  }


  throw new Error(
    `${label}：等待回應逾時`
  );

}


/* =========================
   條碼
========================= */

function detectFormat(code){

  if(/^\d{13}$/.test(code))
  return "EAN13";

  if(/^\d{8}$/.test(code))
  return "EAN8";

  if(/^\d{12}$/.test(code))
  return "UPC";

  return "CODE128";

}


function makeBarcode(
  code,
  maxWidth,
  height,
  displayValue
){

  const canvas =
  document.createElement(
    "canvas"
  );


  const options = {

    format:
    detectFormat(code),

    displayValue,

    height,

    margin:0,

    width:2,

    fontSize:20,

    textMargin:4

  };


  try{

    JsBarcode(
      canvas,
      code,
      options
    );

  }

  catch{

    JsBarcode(
      canvas,
      code,
      {
        ...options,
        format:"CODE128"
      }
    );

  }


  if(canvas.width <= maxWidth){

    return canvas;

  }


  const scaled =
  document.createElement(
    "canvas"
  );


  scaled.width =
  maxWidth;


  scaled.height =
  Math.round(
    canvas.height *
    maxWidth /
    canvas.width
  );


  const ctx =
  scaled.getContext(
    "2d"
  );


  ctx.imageSmoothingEnabled =
  false;


  ctx.drawImage(
    canvas,
    0,
    0,
    scaled.width,
    scaled.height
  );


  return scaled;

}

/* =========================
   批次
========================= */

function parseBulk(){

  const text =
  $("bulkInput")
  .value
  .trim();


  if(!text){

    return {
      added:0,
      skipped:0
    };

  }


  let added = 0;

  let skipped = 0;


  for(
    const raw
    of text.split(/\r?\n/)
  ){

    const line =
    raw.trim();


    if(!line)
    continue;


    let name = "";

    let code = "";


    if(line.includes("\t")){

      const parts =
      line.split("\t");


      name =
      (
        parts[0] || ""
      ).trim();


      code =
      (
        parts[1] || ""
      ).trim();

    }

    else if(line.includes(",")){

      const parts =
      line.split(",");


      code =
      (
        parts.pop() || ""
      ).trim();


      name =
      parts
      .join(",")
      .trim();

    }

    else{

      const match =
      line.match(
        /^(.*?)[\s]+(\d{6,})$/
      );


      if(match){

        name =
        match[1]
        .trim();


        code =
        match[2]
        .trim();

      }

      else{

        name =
        line;

      }

    }


    if(
      !name &&
      !code
    ){

      skipped++;

      continue;

    }


    state.items.push({

      name,

      code,

      qty:1,

      selected:true

    });


    added++;

  }


  return {
    added,
    skipped
  };

}

function expandedItems(
  mode="selected"
){

  const source =
  mode === "all"
  ?
  state.items
  :
  state.items.filter(
    item =>
    item.selected
  );


  const output = [];


  for(const item of source){

    const qty =
    Math.max(
      1,
      Number(item.qty) || 1
    );


    for(
      let index=0;
      index<qty;
      index++
    ){

      output.push(item);

    }

  }


  return output;

}


/* =========================
   多行文字
========================= */

function drawMultilineText(
  ctx,
  text,
  x,
  y,
  maxWidth,
  lineHeight,
  font
){

  const lines =
  String(text || "")
  .split(/\r?\n/);


  ctx.font =
  font;


  ctx.fillStyle =
  "#000";


  ctx.textAlign =
  "center";


  ctx.textBaseline =
  "top";


  let currentY =
  y;


  for(const line of lines){

    ctx.fillText(
      line,
      x,
      currentY,
      maxWidth
    );


    currentY +=
    lineHeight;

  }


  return currentY;

}


/* =========================
   Canvas
========================= */

function buildCanvas(
  printItems
){

  const width =
  paperDots(
    Number(
      $("paperWidth").value
    )
  );


  const margin =
  mmToPx(2);


  const contentWidth =
  width -
  margin * 2;


  const barcodeHeight =
  cmToPx(
    Number(
      $("barcodeHeight").value
    )
  );


  const gap =
  mmToPx(
    Number(
      $("itemGap").value
    )
  );


  const mode =
  $("printMode")
  .value;


  const customText =
  $("customText")
  .value
  .trim();


  const footer =
  $("footerText")
  .value
  .trim();


  const blocks = [];


  for(const item of printItems){

    let barcode =
    null;


    let displayValue =
    false;


    if(
      mode ===
      "name_barcode_number"
      ||
      mode ===
      "barcode_number"
    ){

      displayValue =
      true;

    }


    if(
      mode ===
      "name_barcode_number"
      ||
      mode ===
      "name_barcode"
      ||
      mode ===
      "barcode_number"
      ||
      mode ===
      "barcode"
    ){

      if(item.code){

        barcode =
        makeBarcode(
          item.code,
          contentWidth,
          barcodeHeight,
          displayValue
        );

      }

    }


    let estimated =
    gap;


    if(
      mode ===
      "name_barcode_number"
      ||
      mode ===
      "name_barcode"
      ||
      mode ===
      "name"
      ||
      mode ===
      "name_custom"
    ){

      estimated +=
      34;

    }


    if(barcode){

      estimated +=
      barcode.height;

    }


    if(
      mode ===
      "name_custom"
      &&
      customText
    ){

      estimated +=
      (
        customText
        .split(/\r?\n/)
        .length
        *
        26
      );

    }


    blocks.push({

      item,

      barcode,

      height:
      estimated

    });

  }


  let height =
  mmToPx(1);


  if(mode === "custom"){

    const lines =
    customText
    ?
    customText
    .split(/\r?\n/)
    .length
    :
    1;


    height +=
    lines *
    30;

  }

  else{

    for(const block of blocks){

      height +=
      block.height;

    }

  }


  if(footer){

    height +=
    (
      footer
      .split(/\r?\n/)
      .length
      *
      27
    );

  }


  height +=
  mmToPx(1);


  if(height > 65535){

    throw new Error(
      "內容太長，請縮短條碼高度或分批列印"
    );

  }


  const canvas =
  document.createElement(
    "canvas"
  );


  canvas.width =
  width;


  canvas.height =
  Math.max(
    20,
    height
  );


  const ctx =
  canvas.getContext(
    "2d"
  );


  ctx.fillStyle =
  "#fff";


  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.fillStyle =
  "#000";


  ctx.textAlign =
  "center";


  ctx.textBaseline =
  "top";


  let y =
  mmToPx(1);


  if(mode === "custom"){

    y =
    drawMultilineText(
      ctx,
      customText ||
      " ",
      width/2,
      y,
      contentWidth,
      30,
      '700 22px "PingFang TC","Microsoft JhengHei",sans-serif'
    );

  }

  else{

    for(const block of blocks){

      const item =
      block.item;


      if(
        mode ===
        "name_barcode_number"
        ||
        mode ===
        "name_barcode"
        ||
        mode ===
        "name"
        ||
        mode ===
        "name_custom"
      ){

        ctx.font =
        '700 21px "PingFang TC","Microsoft JhengHei",sans-serif';


        ctx.fillText(
          item.name || "",
          width/2,
          y,
          contentWidth
        );


        y +=
        34;

      }


      if(block.barcode){

        ctx.imageSmoothingEnabled =
        false;


        ctx.drawImage(
          block.barcode,
          (
            width -
            block.barcode.width
          ) / 2,
          y
        );


        y +=
        block.barcode.height;

      }


      if(
        mode ===
        "name_custom"
        &&
        customText
      ){

        y =
        drawMultilineText(
          ctx,
          customText,
          width/2,
          y,
          contentWidth,
          26,
          '600 18px "PingFang TC","Microsoft JhengHei",sans-serif'
        );

      }


      y +=
      gap;

    }

  }


  if(footer){

    y =
    drawMultilineText(
      ctx,
      footer,
      width/2,
      y,
      contentWidth,
      27,
      '700 18px "PingFang TC","Microsoft JhengHei",sans-serif'
    );

  }


  return canvas;

}


/* =========================
   裁白邊
========================= */

function cropBottom(
  source
){

  const ctx =
  source.getContext(
    "2d"
  );


  const pixels =
  ctx.getImageData(
    0,
    0,
    source.width,
    source.height
  ).data;


  let lastRow =
  -1;


  for(
    let y=
    source.height - 1;
    y>=0;
    y--
  ){

    let found =
    false;


    for(
      let x=0;
      x<source.width;
      x++
    ){

      const index =
      (
        y *
        source.width +
        x
      ) *
      4;


      const gray =
      (
        pixels[index] * 299
        +
        pixels[index+1] * 587
        +
        pixels[index+2] * 114
      )
      /
      1000;


      if(gray < 220){

        found = true;

        break;

      }

    }


    if(found){

      lastRow = y;

      break;

    }

  }


  if(lastRow < 0){

    lastRow = 7;

  }


  const height =
  Math.min(
    65535,
    Math.max(
      8,
      lastRow +
      1 +
      mmToPx(1)
    )
  );


  const output =
  document.createElement(
    "canvas"
  );


  output.width =
  source.width;


  output.height =
  height;


  const outputCtx =
  output.getContext(
    "2d"
  );


  outputCtx.fillStyle =
  "#fff";


  outputCtx.fillRect(
    0,
    0,
    output.width,
    output.height
  );


  outputCtx.drawImage(
    source,
    0,
    0
  );


  return output;

}

/* =========================
   Bitmap
========================= */

function sameRow(a,b){

  if(a.length !== b.length){

    return false;

  }


  for(
    let i=0;
    i<a.length;
    i++
  ){

    if(a[i] !== b[i]){

      return false;

    }

  }


  return true;

}


function canvasToRuns(canvas){

  const ctx =
  canvas.getContext(
    "2d"
  );


  const pixels =
  ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  ).data;


  const width =
  canvas.width;


  const height =
  canvas.height;


  const bytesPerRow =
  width / 8;


  const rows = [];


  for(
    let y=0;
    y<height;
    y++
  ){

    const row =
    new Uint8Array(
      bytesPerRow
    );


    let black = 0;


    for(
      let x=0;
      x<width;
      x++
    ){

      const index =
      (
        y *
        width +
        x
      ) *
      4;


      const gray =
      (
        pixels[index] * 299
        +
        pixels[index+1] * 587
        +
        pixels[index+2] * 114
      )
      /
      1000;


      if(gray < 170){

        row[x >> 3] |=
        0x80 >>
        (x & 7);


        black++;

      }

    }


    rows.push({
      data:row,
      black
    });

  }


  const runs = [];

  let y = 0;


  while(y < rows.length){

    const first =
    rows[y];


    let repeat =
    1;


    while(
      y + repeat <
      rows.length
      &&
      repeat <
      255
      &&
      sameRow(
        first.data,
        rows[y+repeat].data
      )
    ){

      repeat++;

    }


    runs.push({

      row:y,

      repeat,

      data:first.data,

      black:first.black

    });


    y +=
    repeat;

  }


  return runs;

}


function rowPacket(run){

  const count = [

    0x00,

    run.black &
    0xFF,

    (
      run.black >>
      8
    ) &
    0xFF

  ];


  return frame(
    0x85,
    [

      ...u16(
        run.row
      ),

      ...count,

      run.repeat,

      ...run.data

    ]
  );

}

/* =========================
   Bluetooth Connect
========================= */

$("connectBtn").onclick =
async () => {

  try{

    $("bleStatus")
    .className =
    "status warn";


    $("bleStatus")
    .textContent =
    "正在連接 B3S…";


    const device =
    await navigator.bluetooth
    .requestDevice({

      acceptAllDevices:true,

      optionalServices:[
        SERVICE
      ]

    });


    state.device =
    device;


    $("deviceName")
    .textContent =
    device.name ||
    "—";


    state.server =
    await device.gatt
    .connect();


    const service =
    await state.server
    .getPrimaryService(
      SERVICE
    );


    state.write =
    await service
    .getCharacteristic(
      WRITE_UUID
    );


    state.notify =
    await service
    .getCharacteristic(
      NOTIFY_UUID
    );


    state.rx = [];

    state.forceStop =
    false;


    state.notify
    .addEventListener(
      "characteristicvaluechanged",

      event => {

        const value =
        event.target.value;


        const bytes =
        new Uint8Array(
          value.buffer,
          value.byteOffset,
          value.byteLength
        );


        const data =
        hex(bytes);


        state.rx.push(data);


        if(state.rx.length > 1000){

          state.rx.shift();

        }


        log(
          "RX：" +
          data
        );

      }
    );


    await state.notify
    .startNotifications();


    device.addEventListener(
      "gattserverdisconnected",

      () => {

        state.server = null;

        state.write = null;

        state.notify = null;

        state.printing = false;

        state.forceStop = false;


        $("bleStatus")
        .className =
        "status warn";


        $("bleStatus")
        .textContent =
        "已中斷";


        updateButtons();

      }
    );


    $("bleStatus")
    .className =
    "status ok";


    $("bleStatus")
    .textContent =
    "✅ B3S 已連線";


    log(
      "V17 B3S READY"
    );


    updateButtons();

  }

  catch(error){

    $("bleStatus")
    .className =
    "status err";


    $("bleStatus")
    .textContent =
    "連線失敗：" +
    error.message;


    updateButtons();

  }

};

    ?.disconnect();

  }catch{}

};

/* =========================

========================= */

async function forceStopPrinter(){

  if(!connected()){

    return;

  }


  $("printStatus")
  .className =
  "status warn";


  $("printStatus")
  .textContent =
  "⏹ 正在停止送紙…";


  log(
    "USER FORCE STOP"
  );


  state.forceStop =
  false;


  try{

    await writeControl(
      CONTROL.pageEnd()
    );

  }catch{}


  await delay(60);


  try{

    await writeControl(
      CONTROL.printEnd()
    );

  }catch{}


  await delay(150);


  try{

    state.device
    ?.gatt
    ?.disconnect();

  }catch{}


  $("printStatus")
  .className =
  "status warn";


  $("printStatus")
  .textContent =
  "⏹ 已停止並中斷 B3S";


  state.printing =
  false;


  state.forceStop =
  false;


  updateButtons();

}


$("stopPrintBtn").onclick =
forceStopPrinter;


/* =========================
   正式列印
========================= */

async function printItems(
  printList,
  sourceItems=[]
){

  const mode =
  $("printMode")
  .value;


  if(
    mode !== "custom"
    &&
    !printList.length
  ){

    alert(
      "沒有可列印內容"
    );

    return;

  }


  if(
    mode === "custom"
    &&
    !$("customText").value.trim()
  ){

    alert(
      "請輸入自訂文字"
    );

    return;

  }


  if(!connected()){

    alert(
      "請先連接 B3S"
    );

    return;

  }


  state.printing =
  true;


  state.forceStop =
  false;


  updateButtons();


  progress(
    0,
    "建立列印資料…"
  );


  try{

    const original =
    buildCanvas(
      printList
    );


    const canvas =
    cropBottom(
      original
    );


    const runs =
    canvasToRuns(
      canvas
    );


    $("printMeta")
    .textContent =
    `${canvas.width} × ${canvas.height} dots｜${paperModeName($("paperMode").value)}`;


    await ackStep(
      "CONNECT",
      CONTROL.connect(),
      0xC2
    );


    progress(5);


    await ackStep(
      "SET DENSITY",
      CONTROL.density(
        Number(
          $("density").value
        )
      ),
      0x31
    );


    progress(10);


    await ackStep(
      "SET PAPER MODE",
      CONTROL.labelType(
        Number(
          $("paperMode").value
        )
      ),
      0x33
    );


    progress(15);


    await ackStep(
      "PRINT START",
      CONTROL.printStart(),
      0x02
    );


    progress(20);


    await ackStep(
      "PAGE START",
      CONTROL.pageStart(),
      0x04
    );


    progress(25);


    await ackStep(
      "SET PAGE SIZE",
      CONTROL.pageSize(
        canvas.height,
        canvas.width
      ),
      0x14,
      5000
    );


    progress(
      30,
      `傳送點陣 0/${runs.length}`
    );


    for(
      let index=0;
      index<runs.length;
      index++
    ){

      if(state.forceStop){

        throw new Error(
          "FORCE_STOP"
        );

      }


      await writeRaw(
        rowPacket(
          runs[index]
        )
      );


      if(
        index % 4 === 0
        ||
        index === runs.length - 1
      ){

        progress(
          30
          +
          Math.round(
            (
              index + 1
            )
            /
            runs.length
            *
            55
          ),

          `傳送點陣 ${index+1}/${runs.length}`
        );


        await delay(5);

      }

    }


    progress(
      88,
      "內容完成，正在結束列印…"
    );


    const page =
    await sendWait(
      CONTROL.pageEnd(),
      0xE4,
      7000
    );


    if(!page.ok){

      throw new Error(
        "PAGE END 沒有收到 E4"
      );

    }


    progress(94);


    await delay(40);


    const end =
    await sendWait(
      CONTROL.printEnd(),
      0xF4,
      7000
    );


    if(!end.ok){

      throw new Error(
        "PRINT END 沒有收到 F4"
      );

    }


    progress(
      100,
      "列印完成"
    );


    $("printStatus")
    .className =
    "status ok";


    $("printStatus")
    .textContent =
    "✅ B3S 列印完成";


    if(
      $("autoClear").checked
      &&
      mode !== "custom"
    ){

      state.items =
      state.items.filter(
        item =>
        !sourceItems.includes(item)
      );


      renderItems();

      drawPreview();

    }

  }

  catch(error){

    if(
      error.message ===
      "FORCE_STOP"
    ){

      $("printStatus")
      .className =
      "status warn";


      $("printStatus")
      .textContent =
      "⏹ 列印已停止";

    }

    else{

      $("printStatus")
      .className =
      "status err";


      $("printStatus")
      .textContent =
      "❌ " +
      error.message;


      log(
        "PRINT ERROR：" +
        error.message
      );

    }

  }

  finally{

    state.printing =
    false;


    state.forceStop =
    false;


    updateButtons();

  }

}

/* =========================
   相機
========================= */

let scanner =
null;


let scanning =
false;


let scannerMode =
"single";


let bulkScanCount =
0;


let lastScanCode =
"";


let lastScanTime =
0;


async function openScanner(mode){

  scannerMode =
  mode;


  bulkScanCount =
  0;


  lastScanCode =
  "";


  lastScanTime =
  0;


  $("scannerModal")
  .style.display =
  "block";


  if(mode === "bulk"){

    $("scannerTitle")
    .textContent =
    "批次連續掃描";


    $("bulkScanNameArea")
    .style.display =
    "block";


    $("bulkScanCounter")
    .textContent =
    "已掃描 0 筆";


    $("bulkScanName").value =
    "";

  }

  else{

    $("scannerTitle")
    .textContent =
    "掃描商品條碼";


    $("bulkScanNameArea")
    .style.display =
    "none";


    $("bulkScanCounter")
    .textContent =
    "";

  }


  $("scannerStatus")
  .className =
  "status";


  $("scannerStatus")
  .textContent =
  "正在啟動相機…";


  try{

    scanner =
    new Html5Qrcode(
      "qrReader"
    );


    await scanner.start(

      {
        facingMode:
        "environment"
      },

      {
        fps:12,

        qrbox:
        (width,height) => ({

          width:
          Math.floor(
            width * 0.88
          ),

          height:
          Math.min(
            150,
            Math.floor(
              height * 0.3
            )
          )

        })
      },

      decoded => {

        handleScan(
          decoded
        );

      },

      () => {}

    );


    scanning =
    true;


    $("scannerStatus")
    .className =
    "status ok";


    $("scannerStatus")
    .textContent =
    mode === "bulk"
    ?
    "請連續掃描商品條碼"
    :
    "請對準商品條碼";

  }

  catch(error){

    $("scannerStatus")
    .className =
    "status err";


    $("scannerStatus")
    .textContent =
    "相機啟動失敗：" +
    error.message;

  }

}


function handleScan(decoded){

  const now =
  Date.now();


  if(
    decoded === lastScanCode
    &&
    now - lastScanTime <
    1500
  ){

    return;

  }


  lastScanCode =
  decoded;


  lastScanTime =
  now;


  if(scannerMode === "single"){

    $("code").value =
    decoded;


    $("scannerStatus")
    .className =
    "status ok";


    $("scannerStatus")
    .textContent =
    "掃描成功：" +
    decoded;


    setTimeout(
      closeScanner,
      350
    );


    return;

  }


  const name =
  $("bulkScanName")
  .value
  .trim();


  const line =
  `${name},${decoded}`;


  const current =
  $("bulkInput")
  .value
  .trim();


  $("bulkInput")
  .value =
  current
  ?
  current +
  "\n" +
  line
  :
  line;


  bulkScanCount++;


  $("bulkScanCounter")
  .textContent =
  `已掃描 ${bulkScanCount} 筆`;


  $("scannerStatus")
  .className =
  "status ok";


  $("scannerStatus")
  .textContent =
  `已加入：${decoded}`;


  $("bulkScanName").value =
  "";


  $("bulkScanName")
  .focus();


  $("bulkStatus")
  .textContent =
  `已掃描 ${bulkScanCount} 筆，完成後按「加入全部」。`;

}


async function closeScanner(){

  try{

    if(
      scanner &&
      scanning
    ){

      await scanner.stop();

    }

  }catch{}


  try{

    if(scanner){

      await scanner.clear();

    }

  }catch{}


  scanner =
  null;


  scanning =
  false;


  $("scannerModal")
  .style.display =
  "none";

}


$("scanBtn").onclick =
() => {

  openScanner(
    "single"
  );

};


$("bulkScanBtn").onclick =
() => {

  openScanner(
    "bulk"
  );

};


$("closeScannerBtn").onclick =
closeScanner;
