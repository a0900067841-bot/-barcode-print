<body>

固定：8｜72mm寬｜黑標2｜濃度1<br>

清除
</button>

<script>

const $=
id=>document.getElementById(id);


/* =========================================================
UTIL
========================================================= */

function delay(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

function errorText(error){
  return error?.message||String(error||"未知錯誤");
}

function mmToDots(mm){
  return Math.round(Number(mm)*203/25.4);
}

function paperDots(mm){
  return Math.floor(mmToDots(mm)/8)*8;
}

function u16(value){
  return[
    (value>>8)&255,
    value&255
  ];
}

function hex(bytes){

  return Array.from(bytes)
  .map(
    value=>
    value
    .toString(16)
    .padStart(2,"0")
    .toUpperCase()
  )
  .join(" ");
}

function log(text){

  const box=$("log");

  box.value+=
  `[${new Date().toLocaleTimeString()}] ${text}\n`;

  box.scrollTop=
  box.scrollHeight;
}


/* =========================================================
BLE
========================================================= */

const SERVICE=
"49535343-fe7d-4ae5-8fa9-9fafd205e455";

const WRITE_UUID=
"49535343-8841-43f4-a8d4-ecbe34729bb3";

const NOTIFY_UUID=
"49535343-1e4d-4bd9-ba61-23c647249616";


const state={

  device:null,
  server:null,
  write:null,
  notify:null,

  rx:[],

  parsedRx:[],

  running:false

};


function connected(){

  return !!(
    state.server?.connected &&
    state.write &&
    state.notify
  );
}


function updateButtons(){

  const ready=
  connected()&&!state.running;

  $("disconnectBtn").disabled=
  !connected();

  $("test148").disabled=
  !ready;

  $("test140").disabled=
  !ready;

  $("test130").disabled=
  !ready;

  $("gattState").textContent=
  String(!!state.server?.connected);
}


/* =========================================================
PACKET
========================================================= */

function frame(
  command,
  data=[1],
  prefix=false
){

  const payload=
  Array.from(data);

  let checksum=
  command^payload.length;

  for(const value of payload){
    checksum^=value;
  }

  const packet=[
    0x55,
    0x55,
    command,
    payload.length,
    ...payload,
    checksum&255,
    0xAA,
    0xAA
  ];

  if(prefix){
    packet.unshift(0x03);
  }

  return new Uint8Array(packet);
}


const CMD={

  connect:
  ()=>frame(
    0xC1,
    [1],
    true
  ),

  density:
  value=>frame(
    0x21,
    [value]
  ),

  labelType:
  value=>frame(
    0x23,
    [value]
  ),

  printStart:
  ()=>frame(
    0x01,
    [1]
  ),

  pageStart:
  ()=>frame(
    0x03,
    [1]
  ),

  pageSize:
  (height,width)=>frame(
    0x13,
    [
      ...u16(height),
      ...u16(width)
    ]
  ),

  pageEnd:
  ()=>frame(
    0xE3,
    [1]
  ),

  printEnd:
  ()=>frame(
    0xF3,
    [1]
  )

};


/* =========================================================
RX PARSER
========================================================= */

function parsePackets(text){

  const bytes=
  String(text||"")
  .trim()
  .split(/\s+/)
  .filter(Boolean)
  .map(value=>parseInt(value,16));

  const result=[];

  let pos=0;


  while(pos<bytes.length){

    if(
      bytes[pos]!==0x55 ||
      bytes[pos+1]!==0x55
    ){

      pos++;

      continue;
    }


    const command=
    bytes[pos+2];

    const length=
    bytes[pos+3];

    const checksumIndex=
    pos+4+length;

    const tail=
    checksumIndex+1;


    if(tail+1>=bytes.length){
      break;
    }


    if(
      bytes[tail]!==0xAA ||
      bytes[tail+1]!==0xAA
    ){

      pos++;

      continue;
    }


    let checksum=
    command^length;


    for(
      let i=0;
      i<length;
      i++
    ){

      checksum^=
      bytes[pos+4+i];
    }


    if(
      (checksum&255)!==
      bytes[checksumIndex]
    ){

      pos++;

      continue;
    }


    result.push({

      command,

      payload:
      bytes.slice(
        pos+4,
        pos+4+length
      )

    });


    pos=
    tail+2;
  }


  return result;
}


/* =========================================================
WRITE
========================================================= */

async function rawGattWrite(bytes){

  if(
    state.write.properties.writeWithoutResponse &&
    state.write.writeValueWithoutResponse
  ){

    await state.write
    .writeValueWithoutResponse(bytes);
  }

  else if(
    state.write.writeValueWithResponse
  ){

    await state.write
    .writeValueWithResponse(bytes);
  }

  else{

    await state.write
    .writeValue(bytes);
  }
}


/*
V19.9：

仍保持快速傳輸，
但由 2ms 微調至 3ms。

不是 V19.5 那種極慢模式。
*/

async function writeRaw(bytes){

  for(
    let i=0;
    i<bytes.length;
    i+=20
  ){

    await rawGattWrite(
      bytes.slice(
        i,
        i+20
      )
    );

    await delay(3);
  }
}


/* =========================================================
WAIT ACK
========================================================= */

async function sendWait(
  name,
  packet,
  expected,
  timeout=5000
){

  const startIndex=
  state.parsedRx.length;

  log(
    `${name} → ${hex(packet)}`
  );

  await rawGattWrite(packet);

  const start=
  Date.now();


  while(
    Date.now()-start<
    timeout
  ){

    const incoming=
    state.parsedRx.slice(
      startIndex
    );


    for(const parsed of incoming){

      if(
        parsed.command===
        expected
      ){

        log(
          `${name} ACK ✅ 0x${expected.toString(16).toUpperCase()}`
        );

        return true;
      }
    }


    await delay(25);
  }


  log(
    `${name} ACK ❌ TIMEOUT`
  );

  return false;
}


/* =========================================================
D3 WAIT
========================================================= */

/*
我們目前不定義 D3 的實際意義。

只是根據實測：
成功列印常常會看到
D3 payload 第一個 byte 往後到 03。

V19.9 在 Bitmap 送完後，
若尚未看到 D3 ... 03，
最多等幾秒再送 PAGE END。
*/

function hasLateD3(startIndex){

  const incoming=
  state.parsedRx.slice(
    startIndex
  );


  for(const packet of incoming){

    if(
      packet.command===
      0xD3 &&
      packet.payload?.length>=1 &&
      packet.payload[0]>=3
    ){

      return true;
    }
  }


  return false;
}


async function settleBeforePageEnd(
  startIndex,
  status
){

  status.textContent=
  "Bitmap 已送完｜等待印表機處理…";

  log(
    "BITMAP 傳送完成，進入 V19.9 settle"
  );


  /*
  先固定休息 700ms。
  */

  await delay(700);


  if(
    hasLateD3(startIndex)
  ){

    log(
      "SETTLE：已看到後段 D3，繼續"
    );

    await delay(300);

    return;
  }


  log(
    "SETTLE：尚未看到後段 D3，開始等待"
  );


  const start=
  Date.now();

  const maxWait=
  5000;


  while(
    Date.now()-start<
    maxWait
  ){

    if(
      hasLateD3(startIndex)
    ){

      log(
        `SETTLE：等待 ${Date.now()-start}ms 後看到後段 D3`
      );

      await delay(400);

      return;
    }


    await delay(100);
  }


  /*
  沒看到也不直接判定錯誤，
  再額外給印表機一點時間。
  */

  log(
    "SETTLE：5秒內未看到後段 D3，額外等待 1200ms"
  );

  await delay(1200);
}


/* =========================================================
CANVAS
========================================================= */

function buildCanvas(heightMm){

  const width=
  paperDots(72);

  const height=
  mmToDots(heightMm);


  const canvas=
  document.createElement(
    "canvas"
  );

  canvas.width=
  width;

  canvas.height=
  height;


  const ctx=
  canvas.getContext("2d");


  ctx.fillStyle=
  "#fff";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  ctx.fillStyle=
  "#000";


  const margin=
  mmToDots(7);


  let low=20;
  let high=1000;
  let best=20;


  while(low<=high){

    const mid=
    Math.floor(
      (low+high)/2
    );


    ctx.font=
    `700 ${mid}px Arial,"PingFang TC",sans-serif`;


    const metrics=
    ctx.measureText("8");


    const textHeight=
    (
      metrics.actualBoundingBoxAscent||
      mid*.8
    )+
    (
      metrics.actualBoundingBoxDescent||
      mid*.2
    );


    if(
      metrics.width<=
      width-margin*2 &&
      textHeight<=
      height-margin*2
    ){

      best=
      mid;

      low=
      mid+1;
    }

    else{

      high=
      mid-1;
    }
  }


  ctx.font=
  `700 ${best}px Arial,"PingFang TC",sans-serif`;

  ctx.textAlign=
  "center";

  ctx.textBaseline=
  "middle";


  ctx.fillText(
    "8",
    width/2,
    height/2
  );


  return canvas;
}


/* =========================================================
RASTER
========================================================= */

function canvasRows(canvas){

  const ctx=
  canvas.getContext("2d");


  const data=
  ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  ).data;


  const rows=[];


  for(
    let y=0;
    y<canvas.height;
    y++
  ){

    const row=
    new Uint8Array(
      canvas.width/8
    );


    let black=
    0;


    for(
      let x=0;
      x<canvas.width;
      x++
    ){

      const i=
      (
        y*
        canvas.width+
        x
      )*4;


      const gray=
      (
        data[i]*299+
        data[i+1]*587+
        data[i+2]*114
      )/1000;


      if(gray<170){

        row[x>>3]|=
        0x80>>
        (x&7);

        black++;
      }
    }


    rows.push({

      row:y,

      data:row,

      black

    });
  }


  return rows;
}


function sameRow(a,b){

  if(a.length!==b.length){

    return false;
  }


  for(
    let i=0;
    i<a.length;
    i++
  ){

    if(a[i]!==b[i]){

      return false;
    }
  }


  return true;
}


/*
保持 V19.2 / V19.4 壓縮策略：

空白最多 repeat 40
黑色相同列最多 repeat 2
*/

function toRuns(canvas){

  const rows=
  canvasRows(canvas);

  const runs=[];

  let y=0;


  while(
    y<
    rows.length
  ){

    const current=
    rows[y];


    if(
      current.black===
      0
    ){

      let repeat=
      1;


      while(
        y+repeat<
        rows.length &&
        repeat<
        40 &&
        rows[
          y+
          repeat
        ].black===
        0
      ){

        repeat++;
      }


      runs.push({

        row:y,

        repeat,

        data:
        current.data,

        black:
        0

      });


      y+=
      repeat;


      continue;
    }


    let repeat=
    1;


    while(
      y+repeat<
      rows.length &&
      repeat<
      2 &&
      rows[
        y+
        repeat
      ].black>
      0 &&
      sameRow(
        current.data,
        rows[
          y+
          repeat
        ].data
      )
    ){

      repeat++;
    }


    runs.push({

      row:y,

      repeat,

      data:
      current.data,

      black:
      current.black

    });


    y+=
    repeat;
  }


  return runs;
}


/* =========================================================
ROW PACKET
========================================================= */

function rowPacket(run){

  return frame(
    0x85,
    [

      ...u16(
        run.row
      ),

      0,

      run.black&
      255,

      (
        run.black>>
        8
      )&
      255,

      run.repeat,

      ...run.data

    ]
  );
}


/* =========================================================
PREPARE PRINT
========================================================= */

async function preparePrint(){

  if(
    !await sendWait(
      "CONNECT",
      CMD.connect(),
      0xC2,
      5000
    )
  ){

    throw new Error(
      "CONNECT 失敗"
    );
  }


  if(
    !await sendWait(
      "DENSITY 1",
      CMD.density(1),
      0x31,
      5000
    )
  ){

    throw new Error(
      "DENSITY 失敗"
    );
  }


  if(
    !await sendWait(
      "LABEL TYPE 2",
      CMD.labelType(2),
      0x33,
      5000
    )
  ){

    throw new Error(
      "LABEL TYPE 失敗"
    );
  }


  if(
    !await sendWait(
      "PRINT START",
      CMD.printStart(),
      0x02,
      5000
    )
  ){

    throw new Error(
      "PRINT START 失敗"
    );
  }


  if(
    !await sendWait(
      "PAGE START",
      CMD.pageStart(),
      0x04,
      5000
    )
  ){

    throw new Error(
      "PAGE START 失敗"
    );
  }
}


/* =========================================================
SEND BITMAP V19.9
========================================================= */

async function sendBitmap(
  canvas,
  status
){

  if(
    !await sendWait(
      "PAGE SIZE",
      CMD.pageSize(
        canvas.height,
        canvas.width
      ),
      0x14,
      5000
    )
  ){

    throw new Error(
      "PAGE SIZE 失敗"
    );
  }


  const runs=
  toRuns(canvas);


  log(
    `CANVAS ${canvas.width}×${canvas.height}`
  );

  log(
    `RUNS ${runs.length}`
  );


  const d3StartIndex=
  state.parsedRx.length;


  for(
    let i=0;
    i<runs.length;
    i++
  ){

    await writeRaw(
      rowPacket(
        runs[i]
      )
    );


    /*
    比 V19.8 稍微穩一點，
    但沒有像 V19.5 那樣大幅拖慢。
    */

    if(
      runs[i].black>
      0
    ){

      await delay(5);
    }


    if(
      (
        i+
        1
      )%
      24===
      0
    ){

      await delay(18);
    }


    if(
      (
        i+
        1
      )%
      20===
      0 ||
      i===
      runs.length-
      1
    ){

      status.textContent=
      `Bitmap ${i+1}/${runs.length}`;
    }
  }


  log(
    "BITMAP DATA ✅"
  );


  await settleBeforePageEnd(
    d3StartIndex,
    status
  );
}


/* =========================================================
HEIGHT TEST
========================================================= */

async function runHeightTest(
  heightMm
){

  if(!connected()){
    return;
  }


  state.running=
  true;

  updateButtons();


  const status=
  $("testStatus");


  status.className=
  "status warn";

  status.textContent=
  `正在測試 ${heightMm}mm…`;


  try{

    const canvas=
    buildCanvas(
      heightMm
    );


    log("");

    log(
      `========== V19.9 HEIGHT ${heightMm}mm START ==========`
    );


    await preparePrint();


    await sendBitmap(
      canvas,
      status
    );


    status.textContent=
    "準備 PAGE END…";


    const pageEndOk=
    await sendWait(
      "PAGE END",
      CMD.pageEnd(),
      0xE4,
      20000
    );


    if(
      !pageEndOk
    ){

      throw new Error(
        "PAGE END 沒有收到 E4"
      );
    }


    /*
    V19.9：
    結束流程仍然固定500ms，
    避免同時改太多變因。
    */

    await delay(
      500
    );


    const printEndOk=
    await sendWait(
      "PRINT END",
      CMD.printEnd(),
      0xF4,
      12000
    );


    if(
      !printEndOk
    ){

      throw new Error(
        "PRINT END 沒有收到 F4"
      );
    }


    status.className=
    "status ok";


    status.textContent=
    `✅ ${heightMm}mm 完成｜PAGE END E4 正常｜請記錄出幾張`;


    log(
      `========== V19.9 HEIGHT ${heightMm}mm COMPLETE ==========`
    );
  }

  catch(error){

    const message=
    errorText(
      error
    );


    status.className=
    "status err";


    status.textContent=
    "❌ "+
    message;


    log(
      `HEIGHT ${heightMm} ERROR：${message}`
    );
  }

  finally{

    state.running=
    false;

    updateButtons();
  }
}


/* =========================================================
BUTTONS
========================================================= */

$("test148").onclick=
()=>runHeightTest(148);

$("test140").onclick=
()=>runHeightTest(140);

$("test130").onclick=
()=>runHeightTest(130);


/* =========================================================
CONNECT
========================================================= */

$("connectBtn").onclick=
async()=>{

  try{

    $("bleStatus").className=
    "status warn";

    $("bleStatus").textContent=
    "正在連線…";


    const device=
    await navigator.bluetooth
    .requestDevice({

      acceptAllDevices:
      true,

      optionalServices:[
        SERVICE
      ]

    });


    state.device=
    device;


    $("deviceName").textContent=
    device.name||
    "—";


    state.server=
    await device.gatt
    .connect();


    const service=
    await state.server
    .getPrimaryService(
      SERVICE
    );


    state.write=
    await service
    .getCharacteristic(
      WRITE_UUID
    );


    state.notify=
    await service
    .getCharacteristic(
      NOTIFY_UUID
    );


    state.rx=
    [];

    state.parsedRx=
    [];


    state.notify
    .addEventListener(
      "characteristicvaluechanged",
      event=>{

        const value=
        event.target.value;


        const bytes=
        new Uint8Array(
          value.buffer,
          value.byteOffset,
          value.byteLength
        );


        const text=
        hex(bytes);


        state.rx.push(
          text
        );


        const packets=
        parsePackets(
          text
        );


        for(
          const packet
          of packets
        ){

          state.parsedRx.push(
            packet
          );
        }


        log(
          "RX："+
          text
        );
      }
    );


    await state.notify
    .startNotifications();


    state.device
    .addEventListener(
      "gattserverdisconnected",
      ()=>{

        state.server=
        null;

        state.write=
        null;

        state.notify=
        null;


        $("bleStatus").className=
        "status warn";


        $("bleStatus").textContent=
        "B3S 已中斷";


        updateButtons();
      }
    );


    $("bleStatus").className=
    "status ok";


    $("bleStatus").textContent=
    "✅ B3S 已連線";


    updateButtons();
  }

  catch(error){

    const message=
    errorText(
      error
    );


    $("bleStatus").className=
    "status err";


    $("bleStatus").textContent=
    "❌ "+
    message;


    log(
      "CONNECT ERROR："+
      message
    );


    updateButtons();
  }
};


/* =========================================================
DISCONNECT
========================================================= */

$("disconnectBtn").onclick=
()=>{

  try{

    state.device
    ?.gatt
    ?.disconnect();

  }

  catch{}


  state.server=
  null;

  state.write=
  null;

  state.notify=
  null;


  $("bleStatus").className=
  "status";


  $("bleStatus").textContent=
  "已中斷";


  updateButtons();
};


/* =========================================================
LOG
========================================================= */

$("clearLogBtn").onclick=
()=>{

  $("log").value=
  "";
};


$("copyLogBtn").onclick=
async()=>{

  try{

    await navigator.clipboard
    .writeText(
      $("log").value
    );


    alert(
      "已複製"
    );
  }

  catch{

    $("log").select();
  }
};


/* =========================================================
PREVIEW
========================================================= */

function renderPreview(){

  const box=
  $("preview");


  box.innerHTML=
  "";


  const holder=
  document.createElement(
    "div"
  );


  holder.className=
  "page";


  holder.appendChild(
    buildCanvas(148)
  );


  box.appendChild(
    holder
  );
}


renderPreview();

updateButtons();

</script>
