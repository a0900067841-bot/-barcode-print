/* =========================
   BLE
========================= */

const SERVICE =
"49535343-fe7d-4ae5-8fa9-9fafd205e455";

const WRITE_UUID =
"49535343-8841-43f4-a8d4-ecbe34729bb3";

const NOTIFY_UUID =
"49535343-1e4d-4bd9-ba61-23c647249616";


const state = {

  items:[],

  device:null,

  server:null,

  write:null,

  notify:null,

  rx:[],

  printing:false,

  forceStop:false

};


/* =========================
   UTILS
========================= */

function delay(ms){

  return new Promise(
    resolve =>
    setTimeout(resolve,ms)
  );

}


function mmToPx(mm){

  return Math.round(
    mm *
    203 /
    25.4
  );

}


function cmToPx(cm){

  return mmToPx(
    cm * 10
  );

}


function paperDots(mm){

  return Math.max(

    8,

    Math.floor(
      mmToPx(mm) /
      8
    ) *
    8

  );

}


function u16(value){

  return [

    (value >> 8)
    & 255,

    value
    & 255

  ];

}


function hex(bytes){

  return Array
  .from(bytes)

  .map(
    value =>
    value
    .toString(16)
    .padStart(2,"0")
    .toUpperCase()
  )

  .join(" ");

}


function log(text){

  const box =
  $("log");


  box.value +=
  `[${new Date().toLocaleTimeString()}] ${text}\n`;


  box.scrollTop =
  box.scrollHeight;

}


function escapeHtml(text){

  return String(text ?? "")
  .replace(

    /[&<>"']/g,

    char => ({

      "&":"&amp;",

      "<":"&lt;",

      ">":"&gt;",

      '"':"&quot;",

      "'":"&#039;"

    }[char])

  );

}


/* =========================
   PACKETS
========================= */

function frame(
  command,
  data=[1],
  prefix=false
){

  const payload =
  Array.from(data);


  let checksum =
  command ^
  payload.length;


  for(
    const value
    of payload
  ){

    checksum ^=
    value;

  }


  const packet = [

    0x55,
    0x55,

    command,

    payload.length,

    ...payload,

    checksum & 255,

    0xAA,
    0xAA

  ];


  if(prefix){

    packet.unshift(
      0x03
    );

  }


  return new Uint8Array(
    packet
  );

}


const CONTROL = {

  connect:
  () =>
  frame(
    0xC1,
    [1],
    true
  ),


  density:
  value =>
  frame(
    0x21,
    [value]
  ),


  labelType:
  value =>
  frame(
    0x23,
    [value]
  ),


  printStart:
  () =>
  frame(
    0x01,
    [1]
  ),


  pageStart:
  () =>
  frame(
    0x03,
    [1]
  ),


  pageSize:
  (height,width) =>
  frame(
    0x13,
    [
      ...u16(height),
      ...u16(width)
    ]
  ),


  pageEnd:
  () =>
  frame(
    0xE3,
    [1]
  ),


  printEnd:
  () =>
  frame(
    0xF3,
    [1]
  )

};


/* =========================
   RX
========================= */

function parsePackets(text){

  const bytes =
  String(text || "")
  .trim()
  .split(/\s+/)
  .filter(Boolean)
  .map(
    v =>
    parseInt(v,16)
  );


  const result = [];

  let pos =
  0;


  while(
    pos <
    bytes.length
  ){

    if(
      bytes[pos] !== 0x55
      ||
      bytes[pos+1] !== 0x55
    ){

      pos++;

      continue;

    }


    const cmd =
    bytes[pos+2];


    const len =
    bytes[pos+3];


    const checksumIndex =
    pos +
    4 +
    len;


    const tail =
    checksumIndex +
    1;


    if(
      tail+1 >=
      bytes.length
    ){

      break;

    }


    if(
      bytes[tail] !== 0xAA
      ||
      bytes[tail+1] !== 0xAA
    ){

      pos++;

      continue;

    }


    const payload =
    bytes.slice(
      pos+4,
      pos+4+len
    );


    let checksum =
    cmd ^
    len;


    for(
      const v
      of payload
    ){

      checksum ^=
      v;

    }


    result.push({

      command:cmd,

      payload,

      checksumOk:
      (checksum & 255)
      ===
      bytes[checksumIndex]

    });


    pos =
    tail +
    2;

  }


  return result;

}


/* =========================
   BLE WRITE
========================= */

async function writeRaw(bytes){

  if(!state.write){

    throw new Error(
      "B3S 尚未連線"
    );

  }


  const chunkSize =
  20;


  for(
    let i=0;
    i<bytes.length;
    i+=chunkSize
  ){

    if(
      state.forceStop
    ){

      throw new Error(
        "FORCE_STOP"
      );

    }


    const part =
    bytes.slice(
      i,
      i+chunkSize
    );


    if(
      state.write
      .properties
      .writeWithoutResponse

      &&

      state.write
      .writeValueWithoutResponse
    ){

      await state.write
      .writeValueWithoutResponse(
        part
      );

    }

    else if(
      state.write
      .writeValueWithResponse
    ){

      await state.write
      .writeValueWithResponse(
        part
      );

    }

    else{

      await state.write
      .writeValue(
        part
      );

    }


    if(
      bytes.length >
      chunkSize
    ){

      await delay(5);

    }

  }

}


async function writeControl(bytes){

  if(!state.write){

    throw new Error(
      "B3S 尚未連線"
    );

  }


  if(
    state.write
    .properties
    .writeWithoutResponse

    &&

    state.write
    .writeValueWithoutResponse
  ){

    await state.write
    .writeValueWithoutResponse(
      bytes
    );

  }

  else if(
    state.write
    .writeValueWithResponse
  ){

    await state.write
    .writeValueWithResponse(
      bytes
    );

  }

  else{

    await state.write
    .writeValue(
      bytes
    );

  }

}


/* =========================
   ACK
========================= */

async function sendWait(
  packet,
  expected,
  timeout=3500
){

  const startIndex =
  state.rx.length;


  log(
    "TX：" +
    hex(packet)
  );


  await writeControl(
    packet
  );


  const start =
  Date.now();


  while(
    Date.now() -
    start <
    timeout
  ){

    const incoming =
    state.rx.slice(
      startIndex
    );


    for(
      const raw
      of incoming
    ){

      for(
        const p
        of parsePackets(raw)
      ){

        if(
          !p.checksumOk
        ){

          continue;

        }


        if(
          p.command ===
          0x00
        ){

          return {

            ok:false,

            unsupported:true

          };

        }


        if(
          p.command ===
          expected
        ){

          return {

            ok:true,

            packet:p

          };

        }

      }

    }


    await delay(35);

  }


  return {

    ok:false,

    timeout:true

  };

}


async function ackStep(
  label,
  packet,
  expected,
  timeout=3500
){

  if(
    state.forceStop
  ){

    throw new Error(
      "FORCE_STOP"
    );

  }


  $("printStatus")
  .className =
  "status warn";


  $("printStatus")
  .textContent =
  label;


  const result =
  await sendWait(
    packet,
    expected,
    timeout
  );


  if(
    result.ok
  ){

    return;

  }


  if(
    result.unsupported
  ){

    throw new Error(
      `${label}：B3S 不支援`
    );

  }


  throw new Error(
    `${label}：等待回應逾時`
  );

}


/* =========================
   BARCODE
========================= */

function detectFormat(code){

  if(
    /^\d{13}$/.test(code)
  ){

    return "EAN13";

  }


  if(
    /^\d{8}$/.test(code)
  ){

    return "EAN8";

  }


  if(
    /^\d{12}$/.test(code)
  ){

    return "UPC";

  }


  return "CODE128";

}


function makeBarcode(
  code,
  maxWidth,
  height,
  displayValue
){

  const canvas =
  document.createElement(
    "canvas"
  );


  const options = {

    format:
    detectFormat(code),

    displayValue,

    height,

    margin:0,

    width:2,

    fontSize:20,

    textMargin:4

  };


  try{

    JsBarcode(
      canvas,
      code,
      options
    );

  }

  catch{

    JsBarcode(
      canvas,
      code,
      {
        ...options,
        format:"CODE128"
      }
    );

  }


  if(
    canvas.width <=
    maxWidth
  ){

    return canvas;

  }


  const scaled =
  document.createElement(
    "canvas"
  );


  scaled.width =
  maxWidth;


  scaled.height =
  Math.round(

    canvas.height *
    maxWidth /
    canvas.width

  );


  const ctx =
  scaled.getContext(
    "2d"
  );


  ctx.imageSmoothingEnabled =
  false;


  ctx.drawImage(

    canvas,

    0,
    0,

    scaled.width,
    scaled.height

  );


  return scaled;

}


/* =========================
   QR CODE
========================= */

function makeQrCanvas(
  text,
  requestedSize,
  maxWidth
){

  if(
    !text
  ){

    return null;

  }


  const size =
  Math.min(
    requestedSize,
    maxWidth
  );


  const holder =
  $("qrGenerator");


  holder.innerHTML =
  "";


  new QRCode(
    holder,
    {

      text,

      width:size,

      height:size,

      colorDark:"#000000",

      colorLight:"#ffffff",

      correctLevel:
      QRCode.CorrectLevel.M

    }
  );


  const generated =
  holder.querySelector(
    "canvas"
  );


  if(
    !generated
  ){

    return null;

  }


  const output =
  document.createElement(
    "canvas"
  );


  output.width =
  size;


  output.height =
  size;


  const ctx =
  output.getContext(
    "2d"
  );


  ctx.fillStyle =
  "#fff";


  ctx.fillRect(
    0,
    0,
    size,
    size
  );


  ctx.drawImage(
    generated,
    0,
    0,
    size,
    size
  );


  return output;

}

function expandedItems(
  mode="selected"
){

  const source =
  mode === "all"

  ?

  state.items

  :

  state.items.filter(
    item =>
    item.selected
  );


  const output =
  [];


  for(
    const item
    of source
  ){

    const qty =
    Math.max(
      1,
      Number(
        item.qty
      ) ||
      1
    );


    for(
      let i=0;
      i<qty;
      i++
    ){

      output.push(
        item
      );

    }

  return output;

/* =========================
   TEXT
========================= */

function drawMultilineText(
  ctx,
  text,
  x,
  y,
  maxWidth,
  lineHeight,
  font
){

  const lines =
  String(
    text ||
    ""
  )
  .split(
    /\r?\n/
  );


  ctx.font =
  font;


  ctx.fillStyle =
  "#000";


  ctx.textAlign =
  "center";


  ctx.textBaseline =
  "top";


  let currentY =
  y;


  for(
    const line
    of lines
  ){

    ctx.fillText(

      line,

      x,

      currentY,

      maxWidth

    );


    currentY +=
    lineHeight;

  }


  return currentY;

}


/* =========================
   CANVAS
========================= */

function buildCanvas(
  printItems
){

  const width =
  paperDots(
    Number(
      $("paperWidth").value
    )
  );


  const margin =
  mmToPx(2);


  const contentWidth =
  width -
  margin * 2;


  const barcodeHeight =
  cmToPx(
    Number(
      $("barcodeHeight").value
    )
  );


  const qrSize =
  cmToPx(
    Number(
      $("qrSize").value
    )
  );


  const gap =
  mmToPx(
    Number(
      $("itemGap").value
    )
  );


  const mode =
  $("printMode")
  .value;


  const footer =
  $("footerText")
  .value
  .trim();


  const customText =
  $("customText")
  .value
  .trim();


  const blocks =
  [];


  for(
    const item
    of printItems
  ){

    const usesBarcode = [

      "name_barcode_number",

      "name_barcode",

      "barcode_number",

      "barcode",

      "name_barcode_qr",

      "name_barcode_number_qr"

    ]
    .includes(mode);


    const showsBarcodeNumber = [

      "name_barcode_number",

      "barcode_number",

      "name_barcode_number_qr"

    ]
    .includes(mode);


    const usesQr = [

      "name_qr",

      "qr",

      "qr_text",

      "name_qr_text",

      "name_barcode_qr",

      "name_barcode_number_qr"

    ]
    .includes(mode);


    let barcode =
    null;


    let qr =
    null;


    if(
      usesBarcode
      &&
      item.code
    ){

      barcode =
      makeBarcode(

        item.code,

        contentWidth,

        barcodeHeight,

        showsBarcodeNumber

      );

    }


    if(
      usesQr
      &&
      item.qr
    ){

      qr =
      makeQrCanvas(

        item.qr,

        qrSize,

        contentWidth

      );

    }


    blocks.push({

      item,

      barcode,

      qr

    });

  }


  let height =
  mmToPx(1);


  if(
    mode ===
    "custom"
  ){

    height +=

    Math.max(
      1,
      customText
      .split(
        /\r?\n/
      )
      .length
    )

    *

    30;

  }

  else{

    for(
      const block
      of blocks
    ){

      const item =
      block.item;


      if(
        mode.startsWith(
          "name_"
        )
        ||
        mode === "name"
      ){

        height +=
        34;

      }


      if(
        block.barcode
      ){

        height +=
        block.barcode.height;

      }


      if(
        block.qr
      ){

        height +=
        block.qr.height +
        mmToPx(1);

      }


      if(
        [
          "qr_text",
          "name_qr_text"
        ]
        .includes(mode)
        &&
        item.qr
      ){

        height +=
        Math.max(
          1,
          item.qr
          .split(
            /\r?\n/
          )
          .length
        )
        *
        25;

      }


      if(
        mode ===
        "name_custom"
        &&
        customText
      ){

        height +=
        customText
        .split(
          /\r?\n/
        )
        .length
        *
        26;

      }


      height +=
      gap;

    }

  }


  if(
    footer
  ){

    height +=

    footer
    .split(
      /\r?\n/
    )
    .length

    *

    27;

  }


  height +=
  mmToPx(1);


  if(
    height >
    65535
  ){

    throw new Error(
      "內容太長，請分批列印或縮小 QR／條碼"
    );

  }


  const canvas =
  document.createElement(
    "canvas"
  );


  canvas.width =
  width;


  canvas.height =
  Math.max(
    20,
    height
  );


  const ctx =
  canvas.getContext(
    "2d"
  );


  ctx.fillStyle =
  "#fff";


  ctx.fillRect(

    0,
    0,

    canvas.width,
    canvas.height

  );


  ctx.fillStyle =
  "#000";


  ctx.textAlign =
  "center";


  ctx.textBaseline =
  "top";


  let y =
  mmToPx(1);


  if(
    mode ===
    "custom"
  ){

    y =
    drawMultilineText(

      ctx,

      customText ||
      " ",

      width/2,

      y,

      contentWidth,

      30,

      '700 22px "PingFang TC","Microsoft JhengHei",sans-serif'

    );

  }

  else{

    for(
      const block
      of blocks
    ){

      const item =
      block.item;


      const showName = [

        "name_barcode_number",

        "name_barcode",

        "name",

        "name_qr",

        "name_qr_text",

        "name_barcode_qr",

        "name_barcode_number_qr",

        "name_custom"

      ]
      .includes(mode);


      if(
        showName
      ){

        ctx.font =
        '700 21px "PingFang TC","Microsoft JhengHei",sans-serif';


        ctx.fillText(

          item.name ||
          "",

          width/2,

          y,

          contentWidth

        );


        y +=
        34;

      }


      if(
        block.barcode
      ){

        ctx.imageSmoothingEnabled =
        false;


        ctx.drawImage(

          block.barcode,

          (
            width -
            block.barcode.width
          )
          /
          2,

          y

        );


        y +=
        block.barcode.height;

      }


      if(
        block.qr
      ){

        y +=
        mmToPx(1);


        ctx.imageSmoothingEnabled =
        false;


        ctx.drawImage(

          block.qr,

          (
            width -
            block.qr.width
          )
          /
          2,

          y

        );


        y +=
        block.qr.height;

      }


      if(
        [
          "qr_text",
          "name_qr_text"
        ]
        .includes(mode)
        &&
        item.qr
      ){

        y +=
        5;


        y =
        drawMultilineText(

          ctx,

          item.qr,

          width/2,

          y,

          contentWidth,

          25,

          '600 16px "PingFang TC","Microsoft JhengHei",sans-serif'

        );

      }


      if(
        mode ===
        "name_custom"
        &&
        customText
      ){

        y =
        drawMultilineText(

          ctx,

          customText,

          width/2,

          y,

          contentWidth,

          26,

          '600 18px "PingFang TC","Microsoft JhengHei",sans-serif'

        );

      }


      y +=
      gap;

    }

  }


  if(
    footer
  ){

    y =
    drawMultilineText(

      ctx,

      footer,

      width/2,

      y,

      contentWidth,

      27,

      '700 18px "PingFang TC","Microsoft JhengHei",sans-serif'

    );

  }


  return canvas;

}


/* =========================
   CROP
========================= */

function cropBottom(
  source
){

  const ctx =
  source.getContext(
    "2d"
  );


  const pixels =
  ctx.getImageData(

    0,
    0,

    source.width,
    source.height

  )
  .data;


  let lastRow =
  -1;


  for(
    let y=
    source.height - 1;
    y>=0;
    y--
  ){

    let found =
    false;


    for(
      let x=0;
      x<source.width;
      x++
    ){

      const index =
      (
        y *
        source.width +
        x
      )
      *
      4;


      const gray =

      (
        pixels[index]
        *
        299

        +

        pixels[index+1]
        *
        587

        +

        pixels[index+2]
        *
        114
      )

      /

      1000;


      if(
        gray <
        220
      ){

        found =
        true;

        break;

      }

    }


    if(
      found
    ){

      lastRow =
      y;

      break;

    }

  }


  if(
    lastRow <
    0
  ){

    lastRow =
    7;

  }


  const height =
  Math.min(

    65535,

    Math.max(

      8,

      lastRow
      +
      1
      +
      mmToPx(1)

    )

  );


  const output =
  document.createElement(
    "canvas"
  );


  output.width =
  source.width;


  output.height =
  height;


  const out =
  output.getContext(
    "2d"
  );


  out.fillStyle =
  "#fff";


  out.fillRect(

    0,
    0,

    output.width,
    output.height

  );


  out.drawImage(

    source,

    0,
    0

  );


  return output;

}

/* =========================
   BITMAP
========================= */

function sameRow(a,b){

  if(
    a.length !==
    b.length
  ){

    return false;

  }


  for(
    let i=0;
    i<a.length;
    i++
  ){

    if(
      a[i] !==
      b[i]
    ){

      return false;

    }

  }


  return true;

}


function canvasToRuns(canvas){

  const ctx =
  canvas.getContext(
    "2d"
  );


  const pixels =
  ctx.getImageData(

    0,
    0,

    canvas.width,
    canvas.height

  )
  .data;


  const width =
  canvas.width;


  const rows =
  [];


  for(
    let y=0;
    y<canvas.height;
    y++
  ){

    const row =
    new Uint8Array(
      width / 8
    );


    let black =
    0;


    for(
      let x=0;
      x<width;
      x++
    ){

      const index =
      (
        y *
        width +
        x
      )
      *
      4;


      const gray =

      (
        pixels[index]
        *
        299

        +

        pixels[index+1]
        *
        587

        +

        pixels[index+2]
        *
        114
      )

      /

      1000;


      if(
        gray <
        170
      ){

        row[x >> 3] |=

        0x80 >>
        (x & 7);


        black++;

      }

    }


    rows.push({

      data:row,

      black

    });

  }


  const runs =
  [];


  let y =
  0;


  while(
    y <
    rows.length
  ){

    const first =
    rows[y];


    let repeat =
    1;


    while(

      y + repeat <
      rows.length

      &&

      repeat <
      255

      &&

      sameRow(

        first.data,

        rows[y+repeat].data

      )

    ){

      repeat++;

    }


    runs.push({

      row:y,

      repeat,

      data:first.data,

      black:first.black

    });


    y +=
    repeat;

  }


  return runs;

}


function rowPacket(run){

  return frame(

    0x85,

    [

      ...u16(
        run.row
      ),

      0x00,

      run.black &
      0xFF,

      (
        run.black >>
        8
      )
      &
      0xFF,

      run.repeat,

      ...run.data

    ]

  );

}


/* =========================
   UI
========================= */

function connected(){

  return !!(

    state.server?.connected

    &&

    state.write

    &&

    state.notify

  );

}


function updateButtons(){

  const c =
  connected();


  const selected =
  state.items.some(
    item =>
    item.selected
  );


  const mode =
  $("printMode")
  .value;


  $("disconnectBtn")
  .disabled =
  !c;


  $("printSelectedBtn")
  .disabled =

  !(
    c

    &&

    selected

    &&

    mode !==
    "custom"

    &&

    !state.printing
  );


  $("printAllBtn")
  .disabled =

  !(
    c

    &&

    state.items.length

    &&

    mode !==
    "custom"

    &&

    !state.printing
  );


  $("printCustomBtn")
  .disabled =

  !(
    c

    &&

    mode ===
    "custom"

    &&

    $("customText")
    .value
    .trim()

    &&

    !state.printing
  );


  $("stopPrintBtn")
  .disabled =
  !c;


  $("gattState")
  .textContent =
  String(
    !!state.server?.connected
  );


  $("channelState")
  .textContent =
  c
  ?
  "已就緒"
  :
  "未就緒";

}


function paperModeName(value){

  const names = {

    "1":"間隙紙",

    "2":"黑標紙",

    "3":"連續紙",

    "4":"打孔紙",

    "5":"透明紙"

  };


  return names[value]
  ||
  "未知";

}


$("paperMode")
.onchange =
() => {

  $("paperModeDisplay")
  .textContent =
  paperModeName(
    $("paperMode").value
  );

};


/* =========================
   CONNECT
========================= */

$("connectBtn")
.onclick =
async () => {

  try{

    $("bleStatus")
    .className =
    "status warn";


    $("bleStatus")
    .textContent =
    "正在連接 B3S…";


    const device =
    await navigator.bluetooth
    .requestDevice({

      acceptAllDevices:true,

      optionalServices:[
        SERVICE
      ]

    });


    state.device =
    device;


    $("deviceName")
    .textContent =
    device.name ||
    "—";


    state.server =
    await device.gatt
    .connect();


    const service =
    await state.server
    .getPrimaryService(
      SERVICE
    );


    state.write =
    await service
    .getCharacteristic(
      WRITE_UUID
    );


    state.notify =
    await service
    .getCharacteristic(
      NOTIFY_UUID
    );


    state.rx =
    [];


    state.notify
    .addEventListener(

      "characteristicvaluechanged",

      event => {

        const value =
        event.target.value;


        const bytes =
        new Uint8Array(

          value.buffer,

          value.byteOffset,

          value.byteLength

        );


        const data =
        hex(bytes);


        state.rx.push(
          data
        );


        if(
          state.rx.length >
          1000
        ){

          state.rx.shift();

        }


        log(
          "RX：" +
          data
        );

      }

    );


    await state.notify
    .startNotifications();


    device
    .addEventListener(

      "gattserverdisconnected",

      () => {

        state.server =
        null;


        state.write =
        null;


        state.notify =
        null;


        state.printing =
        false;


        $("bleStatus")
        .className =
        "status warn";


        $("bleStatus")
        .textContent =
        "已中斷";


        updateButtons();

      }

    );


    $("bleStatus")
    .className =
    "status ok";


    $("bleStatus")
    .textContent =
    "✅ B3S 已連線";


    updateButtons();

  }

  catch(error){

    $("bleStatus")
    .className =
    "status err";


    $("bleStatus")
    .textContent =
    "連線失敗：" +
    error.message;

  }

};


$("disconnectBtn")
.onclick =
() => {

  try{

    state.device
    ?.gatt
    ?.disconnect();

  }
  catch{}

};


/* =========================
   PROGRESS
========================= */

function progress(
  percent,
  text=""
){

  $("progressBar")
  .style
  .width =

  Math.max(
    0,
    Math.min(
      100,
      percent
    )
  )
  +
  "%";


  if(text){

    $("printMeta")
    .textContent =
    text;

  }

}


/* =========================
   STOP
========================= */

$("stopPrintBtn")
.onclick =
async () => {

  if(
    !connected()
  ){

    return;

  }


  $("printStatus")
  .className =
  "status warn";


  $("printStatus")
  .textContent =
  "⏹ 正在停止…";


  state.forceStop =
  false;


  try{

    await writeControl(
      CONTROL.pageEnd()
    );

  }
  catch{}


  await delay(60);


  try{

    await writeControl(
      CONTROL.printEnd()
    );

  }
  catch{}


  await delay(150);


  try{

    state.device
    ?.gatt
    ?.disconnect();

  }
  catch{}


  state.printing =
  false;


  $("printStatus")
  .textContent =
  "⏹ 已停止並中斷 B3S";


  updateButtons();

};


/* =========================
   PRINT
========================= */

async function printItems(
  list,
  sourceItems=[]
){

  const mode =
  $("printMode")
  .value;


  if(
    mode !== "custom"
    &&
    !list.length
  ){

    alert(
      "沒有可列印內容"
    );

    return;

  }


  if(
    !connected()
  ){

    alert(
      "請先連接 B3S"
    );

    return;

  }


  state.printing =
  true;


  state.forceStop =
  false;


  updateButtons();


  try{

    const original =
    buildCanvas(
      list
    );


    const canvas =
    cropBottom(
      original
    );


    const runs =
    canvasToRuns(
      canvas
    );


    await ackStep(
      "CONNECT",
      CONTROL.connect(),
      0xC2
    );


    await ackStep(

      "SET DENSITY",

      CONTROL.density(
        Number(
          $("density").value
        )
      ),

      0x31

    );


    await ackStep(

      "SET PAPER MODE",

      CONTROL.labelType(
        Number(
          $("paperMode").value
        )
      ),

      0x33

    );


    await ackStep(
      "PRINT START",
      CONTROL.printStart(),
      0x02
    );


    await ackStep(
      "PAGE START",
      CONTROL.pageStart(),
      0x04
    );


    await ackStep(

      "SET PAGE SIZE",

      CONTROL.pageSize(

        canvas.height,

        canvas.width

      ),

      0x14,

      5000

    );


    for(
      let i=0;
      i<runs.length;
      i++
    ){

      await writeRaw(
        rowPacket(
          runs[i]
        )
      );


      if(
        i % 4 === 0
      ){

        progress(

          30
          +
          Math.round(
            (
              i /
              runs.length
            )
            *
            55
          ),

          `傳送點陣 ${i+1}/${runs.length}`

        );


        await delay(5);

      }

    }


    const page =
    await sendWait(

      CONTROL.pageEnd(),

      0xE4,

      7000

    );


    if(
      !page.ok
    ){

      throw new Error(
        "PAGE END 失敗"
      );

    }


    await delay(40);


    const end =
    await sendWait(

      CONTROL.printEnd(),

      0xF4,

      7000

    );


    if(
      !end.ok
    ){

      throw new Error(
        "PRINT END 失敗"
      );

    }


    progress(
      100,
      "列印完成"
    );


    $("printStatus")
    .className =
    "status ok";


    $("printStatus")
    .textContent =
    "✅ B3S 列印完成";


    if(
      $("autoClear")
      .checked
      &&
      mode !==
      "custom"
    ){

      state.items =
      state.items.filter(
        item =>
        !sourceItems.includes(
          item
        )
      );


      renderItems();

      drawPreview();

    }

  }

  catch(error){

    $("printStatus")
    .className =
    "status err";


    $("printStatus")
    .textContent =
    "❌ " +
    error.message;

  }

  finally{

    state.printing =
    false;


    state.forceStop =
    false;


    updateButtons();

  }

}


/* =========================
   PRINT BUTTONS
========================= */

$("printSelectedBtn")
.onclick =
async () => {

  const source =
  state.items.filter(
    item =>
    item.selected
  );


  const expanded =
  [];


  for(
    const item
    of source
  ){

    for(
      let i=0;
      i<item.qty;
      i++
    ){

      expanded.push(
        item
      );

    }

  }


  await printItems(
    expanded,
    source
  );

};


$("printAllBtn")
.onclick =
async () => {

  const source =
  [...state.items];


  const expanded =
  [];


  for(
    const item
    of source
  ){

    for(
      let i=0;
      i<item.qty;
      i++
    ){

      expanded.push(
        item
      );

    }

  }


  await printItems(
    expanded,
    source
  );

};


$("printCustomBtn")
.onclick =
async () => {

  await printItems(
    [],
    []
  );

};

  .classList
  .toggle(

    )

.onchange =
updateMode;


$("customText")

() => {

  updateButtons();

  drawPreview();

};


/* =========================
   SCANNER
========================= */

let scanner =
null;

let scanning =
false;

let scannerMode =
"single";

let bulkScanCount =
0;

let lastCode =
"";

let lastTime =
0;


async function openScanner(mode){

  scannerMode =
  mode;


  bulkScanCount =
  0;


  $("scannerModal")
  .style
  .display =
  "block";


  if(
    mode ===
    "bulk"
  ){

    $("scannerTitle")
    .textContent =
    "批次連續掃描";


    $("bulkScanNameArea")
    .style
    .display =
    "block";

  }

  else{

    $("scannerTitle")
    .textContent =
    "掃描商品條碼";


    $("bulkScanNameArea")
    .style
    .display =
    "none";

  }


  try{

    scanner =
    new Html5Qrcode(
      "qrReader"
    );


    await scanner.start(

      {
        facingMode:
        "environment"
      },

      {
        fps:12,

        qrbox:{
          width:280,
          height:130
        }
      },

      decoded => {

        const now =
        Date.now();


        if(
          decoded ===
          lastCode

          &&

          now -
          lastTime <
          1500
        ){

          return;

        }


        lastCode =
        decoded;


        lastTime =
        now;


        if(
          scannerMode ===
          "single"
        ){

          $("code").value =
          decoded;


          setTimeout(
            closeScanner,
            300
          );


          return;

        }


        const name =
        $("bulkScanName")
        .value
        .trim();


        const qr =
        $("bulkScanQr")
        .value
        .trim();


        const line =
        `${name},${decoded},${qr}`;


        const current =
        $("bulkInput")
        .value
        .trim();


        $("bulkInput")
        .value =

        current

        ?

        current +
        "\n" +
        line

        :

        line;


        bulkScanCount++;


        $("bulkScanCounter")
        .textContent =
        `已掃描 ${bulkScanCount} 筆`;


        $("bulkScanName")
        .value =
        "";


        $("bulkScanQr")
        .value =
        "";

      }

    );


    scanning =
    true;

  }

  catch(error){

    $("scannerStatus")
    .className =
    "status err";


    $("scannerStatus")
    .textContent =
    error.message;

  }

}


async function closeScanner(){

  try{

    if(
      scanner &&
      scanning
    ){

      await scanner.stop();

    }

  }
  catch{}


  try{

    if(
      scanner
    ){

      await scanner.clear();

    }

  }
  catch{}


  scanner =
  null;


  scanning =
  false;


  $("scannerModal")
  .style
  .display =
  "none";

}


$("scanBtn")
.onclick =
() =>
openScanner(
  "single"
);


$("bulkScanBtn")
.onclick =
() =>
openScanner(
  "bulk"
);


$("closeScannerBtn")
.onclick =
closeScanner;
