<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B3S V15｜連續紙停止測試</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f4f6f8;
  color:#18202a;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif
}
.wrap{
  max-width:700px;
  margin:auto;
  padding:18px
}
.card{
  background:#fff;
  border:1px solid #d8dee8;
  border-radius:16px;
  padding:16px;
  margin-bottom:15px
}
h1{margin:0 0 5px}
h2{margin-top:0}
.help{color:#667085;font-size:14px;line-height:1.6}
.status{
  padding:12px;
  border-radius:10px;
  background:#f2f4f7;
  margin:10px 0
}
.ok{background:#ecfdf3;color:#067647}
.warn{background:#fff8e6;color:#8a5a00}
.err{background:#fff1f0;color:#d92d20}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px
}
button{
  border:0;
  border-radius:10px;
  min-height:48px;
  padding:10px 14px;
  font-size:16px;
  font-weight:700
}
button:disabled{opacity:.4}
.connect{background:#e7f8ef;color:#087443}
.print{background:#1265f3;color:#fff}
.stop{background:#d92d20;color:#fff}
textarea{
  width:100%;
  min-height:270px;
  padding:10px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  font-family:monospace;
  font-size:12px
}
</style>
</head>

<body>

<div class="wrap">

<h1>B3S 連續紙測試</h1>
<div class="help">V15｜只測試「印完立即停止」</div>

<div class="card">

<h2>藍牙</h2>

<div id="bleStatus" class="status">
尚未連線
</div>

<div class="actions">

<button id="connectBtn" class="connect">
🔵 連接 B3S
</button>

<button id="disconnectBtn" disabled>
中斷連線
</button>

</div>

</div>


<div class="card">

<h2>連續紙模式</h2>

<div class="status ok">
固定使用 Label Type = 3（Continuous）
</div>

<p class="help">
這次只印 64 dots × 8 dots 的短黑線。目的是確認印完後 B3S 是否立即停住，不會再一直找下一張標籤。
</p>

<div class="actions">

<button id="testBtn" class="print" disabled>
🖨 印一條短黑線
</button>

<button id="stopBtn" class="stop" disabled>
⏹ 強制停止送紙
</button>

</div>

<div id="testStatus" class="status">
等待測試
</div>

</div>


<div class="card">

<h2>通訊紀錄</h2>

<textarea id="log" readonly></textarea>

</div>

</div>


<script>

const $ = id => document.getElementById(id);

const SERVICE =
"49535343-fe7d-4ae5-8fa9-9fafd205e455";

const WRITE_UUID =
"49535343-8841-43f4-a8d4-ecbe34729bb3";

const NOTIFY_UUID =
"49535343-1e4d-4bd9-ba61-23c647249616";


const state = {

  device:null,

  server:null,

  write:null,

  notify:null,

  rx:[],

  testing:false

};


function delay(ms){

  return new Promise(
    resolve =>
    setTimeout(resolve,ms)
  );

}


function hex(bytes){

  return Array
  .from(bytes)
  .map(
    b =>
    b.toString(16)
    .padStart(2,"0")
    .toUpperCase()
  )
  .join(" ");

}


function addLog(text){

  const box = $("log");

  box.value +=
  `[${new Date().toLocaleTimeString()}] ${text}\n`;

  box.scrollTop =
  box.scrollHeight;

}


function frame(
  command,
  data=[1],
  prefix=false
){

  const payload =
  Array.from(data);

  let checksum =
  command ^
  payload.length;

  for(const b of payload){

    checksum ^= b;

  }


  const result = [

    0x55,
    0x55,

    command,

    payload.length,

    ...payload,

    checksum & 0xFF,

    0xAA,
    0xAA

  ];


  if(prefix){

    result.unshift(0x03);

  }


  return new Uint8Array(result);

}


function u16(value){

  return [

    (value >> 8) & 255,

    value & 255

  ];

}


const P = {

  connect:
  frame(
    0xC1,
    [1],
    true
  ),

  density:
  frame(
    0x21,
    [2]
  ),

  /*
  V15 關鍵：
  3 = Continuous
  */
  labelContinuous:
  frame(
    0x23,
    [3]
  ),

  printStart:
  frame(
    0x01,
    [1]
  ),

  pageStart:
  frame(
    0x03,
    [1]
  ),

  pageSize:
  frame(
    0x13,
    [
      ...u16(8),
      ...u16(64)
    ]
  ),

  /*
  與 V11 成功的黑線資料相同
  */
  blackLine:
  frame(
    0x85,
    [

      0x00,
      0x00,

      0x00,
      0x40,
      0x00,

      0x08,

      0xFF,
      0xFF,
      0xFF,
      0xFF,
      0xFF,
      0xFF,
      0xFF,
      0xFF

    ]
  ),

  pageEnd:
  frame(
    0xE3,
    [1]
  ),

  printEnd:
  frame(
    0xF3,
    [1]
  )

};


function parse(text){

  const bytes =
  String(text)
  .trim()
  .split(/\s+/)
  .filter(Boolean)
  .map(x => parseInt(x,16));


  const out = [];


  for(
    let i=0;
    i<bytes.length;
    i++
  ){

    if(
      bytes[i] !== 0x55 ||
      bytes[i+1] !== 0x55
    ){

      continue;

    }


    const cmd =
    bytes[i+2];


    const len =
    bytes[i+3];


    const checksumIndex =
    i + 4 + len;


    if(
      bytes[checksumIndex+1] !== 0xAA ||
      bytes[checksumIndex+2] !== 0xAA
    ){

      continue;

    }


    const payload =
    bytes.slice(
      i+4,
      i+4+len
    );


    let check =
    cmd ^ len;


    for(const b of payload){

      check ^= b;

    }


    out.push({

      command:cmd,

      payload,

      checksumOk:
      (check & 255)
      ===
      bytes[checksumIndex]

    });

  }


  return out;

}


async function writeRaw(bytes){

  if(!state.write){

    throw new Error(
      "B3S 尚未連線"
    );

  }


  if(
    state.write.properties.writeWithoutResponse &&
    state.write.writeValueWithoutResponse
  ){

    await state.write
    .writeValueWithoutResponse(bytes);

  }

  else if(
    state.write.writeValueWithResponse
  ){

    await state.write
    .writeValueWithResponse(bytes);

  }

  else{

    await state.write.writeValue(bytes);

  }

}


async function sendWait(
  packet,
  expected,
  timeout=2500
){

  const startIndex =
  state.rx.length;


  addLog(
    "TX：" +
    hex(packet)
  );


  await writeRaw(packet);


  const started =
  Date.now();


  while(
    Date.now() - started <
    timeout
  ){

    const incoming =
    state.rx.slice(startIndex);


    for(const item of incoming){

      const packets =
      parse(item);


      for(const p of packets){

        if(!p.checksumOk)
        continue;


        if(p.command === 0x00){

          return {
            ok:false,
            unsupported:true
          };

        }


        if(p.command === expected){

          return {
            ok:true,
            packet:p
          };

        }

      }

    }


    await delay(30);

  }


  return {
    ok:false,
    timeout:true
  };

}


async function requireAck(
  name,
  packet,
  ack
){

  $("testStatus")
  .className =
  "status warn";


  $("testStatus")
  .textContent =
  name;


  const result =
  await sendWait(
    packet,
    ack
  );


  if(result.ok){

    return;

  }


  if(result.unsupported){

    throw new Error(
      `${name}：CMD 00 NOT_SUPPORTED`
    );

  }


  throw new Error(
    `${name}：等待回應逾時`
  );

}


/* Bluetooth */

$("connectBtn").onclick =
async () => {

  try{

    $("bleStatus")
    .className =
    "status warn";


    $("bleStatus")
    .textContent =
    "正在連線…";


    const device =
    await navigator.bluetooth
    .requestDevice({

      acceptAllDevices:true,

      optionalServices:[
        SERVICE
      ]

    });


    state.device =
    device;


    state.server =
    await device.gatt.connect();


    const service =
    await state.server
    .getPrimaryService(
      SERVICE
    );


    state.write =
    await service
    .getCharacteristic(
      WRITE_UUID
    );


    state.notify =
    await service
    .getCharacteristic(
      NOTIFY_UUID
    );


    state.rx = [];


    state.notify
    .addEventListener(
      "characteristicvaluechanged",

      event => {

        const value =
        event.target.value;


        const bytes =
        new Uint8Array(

          value.buffer,

          value.byteOffset,

          value.byteLength

        );


        const data =
        hex(bytes);


        state.rx.push(data);


        if(state.rx.length > 300){

          state.rx.shift();

        }


        addLog(
          "RX：" +
          data
        );

      }
    );


    await state.notify
    .startNotifications();


    device.addEventListener(
      "gattserverdisconnected",

      () => {

        state.server = null;

        state.write = null;

        state.notify = null;

        state.testing = false;


        $("bleStatus")
        .className =
        "status warn";


        $("bleStatus")
        .textContent =
        "已中斷";


        updateButtons();

      }
    );


    $("bleStatus")
    .className =
    "status ok";


    $("bleStatus")
    .textContent =
    "✅ B3S 已連線";


    addLog(
      "V15 BLE ready"
    );


    updateButtons();

  }

  catch(error){

    $("bleStatus")
    .className =
    "status err";


    $("bleStatus")
    .textContent =
    "連線失敗：" +
    error.message;

  }

};


$("disconnectBtn").onclick =
() => {

  try{

    state.device
    ?.gatt
    ?.disconnect();

  }catch{}

};


function updateButtons(){

  const connected =
  !!state.server?.connected
  &&
  !!state.write
  &&
  !!state.notify;


  $("disconnectBtn").disabled =
  !connected;


  $("testBtn").disabled =
  !connected ||
  state.testing;


  /*
  重要：
  只要 B3S 還連線，
  STOP 永遠可以按。
  */
  $("stopBtn").disabled =
  !connected;

}


/* 測試 */

$("testBtn").onclick =
async () => {

  if(!state.server?.connected)
  return;


  state.testing =
  true;


  updateButtons();


  try{

    await requireAck(
      "1/6 CONNECT",
      P.connect,
      0xC2
    );


    await requireAck(
      "2/6 SET DENSITY",
      P.density,
      0x31
    );


    /*
    V15 最重要的一步
    */

    await requireAck(
      "3/6 SET LABEL TYPE = CONTINUOUS",
      P.labelContinuous,
      0x33
    );


    await requireAck(
      "4/6 PRINT START",
      P.printStart,
      0x02
    );


    await requireAck(
      "5/6 PAGE START",
      P.pageStart,
      0x04
    );


    await requireAck(
      "6/6 PAGE SIZE",
      P.pageSize,
      0x14
    );


    $("testStatus")
    .className =
    "status warn";


    $("testStatus")
    .textContent =
    "正在印短黑線…";


    addLog(
      "TX BITMAP：" +
      hex(P.blackLine)
    );


    await writeRaw(
      P.blackLine
    );


    /*
    黑線資料送完後立即結頁
    */

    await delay(50);


    const pageEnd =
    await sendWait(
      P.pageEnd,
      0xE4,
      4000
    );


    if(!pageEnd.ok){

      throw new Error(
        "PAGE END 失敗"
      );

    }


    /*
    立刻 PRINT END
    */

    await delay(30);


    const end =
    await sendWait(
      P.printEnd,
      0xF4,
      4000
    );


    if(!end.ok){

      throw new Error(
        "PRINT END 失敗"
      );

    }


    $("testStatus")
    .className =
    "status ok";


    $("testStatus")
    .textContent =
    "✅ 指令完成，請看 B3S 是否在黑線後立即停紙";

  }

  catch(error){

    $("testStatus")
    .className =
    "status err";


    $("testStatus")
    .textContent =
    "❌ " +
    error.message;


    addLog(
      "ERROR：" +
      error.message
    );

  }

  finally{

    state.testing =
    false;


    updateButtons();

  }

};


/* 強制停止 */

$("stopBtn").onclick =
async () => {

  if(
    !state.server?.connected
  ){

    return;

  }


  $("testStatus")
  .className =
  "status warn";


  $("testStatus")
  .textContent =
  "⏹ 正在強制停止…";


  addLog(
    "USER FORCE STOP"
  );


  /*
  第一層：
  再送一次 PAGE END
  */

  try{

    await writeRaw(
      P.pageEnd
    );

  }catch{}


  await delay(50);


  /*
  第二層：
  PRINT END
  */

  try{

    await writeRaw(
      P.printEnd
    );

  }catch{}


  await delay(120);


  /*
  第三層：
  直接中斷 Bluetooth。
  不讓 STOP 因為網頁已完成而失效。
  */

  try{

    state.device
    ?.gatt
    ?.disconnect();

  }catch{}


  $("testStatus")
  .className =
  "status warn";


  $("testStatus")
  .textContent =
  "⏹ 已送停止指令並中斷 B3S";

};


updateButtons();

</script>

</body>
</html>
