<script>

const $=id=>document.getElementById(id);

function delay(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

function errorText(error){
  return error?.message||String(error||"未知錯誤");
}

function mmToDots(mm){
  return Math.round(Number(mm)*203/25.4);
}

function paperDots(mm){
  return Math.floor(mmToDots(mm)/8)*8;
}

function u16(value){
  return[(value>>8)&255,value&255];
}

function hex(bytes){
  return Array.from(bytes)
  .map(value=>value.toString(16).padStart(2,"0").toUpperCase())
  .join(" ");
}

function log(text){
  const box=$("log");
  box.value+=`[${new Date().toLocaleTimeString()}] ${text}\n`;
  box.scrollTop=box.scrollHeight;
}

function clamp(value,min,max){
  return Math.max(min,Math.min(max,value));
}

/* =========================================================
PACKET
========================================================= */

function frame(command,data=[1],prefix=false){

  const payload=Array.from(data);

  let checksum=
  command^payload.length;

  for(const value of payload){
    checksum^=value;
  }

  const packet=[
    0x55,0x55,
    command,
    payload.length,
    ...payload,
    checksum&255,
    0xAA,0xAA
  ];

  if(prefix){
    packet.unshift(0x03);
  }

  return new Uint8Array(packet);
}

const CMD={
  connect:()=>frame(0xC1,[1],true),
  density:value=>frame(0x21,[value]),
  labelType:value=>frame(0x23,[value]),
  printStart:()=>frame(0x01,[1]),
  pageStart:()=>frame(0x03,[1]),
  pageSize:(height,width)=>frame(
    0x13,
    [
      ...u16(height),
      ...u16(width)
    ]
  ),
  pageEnd:()=>frame(0xE3,[1]),
  printEnd:()=>frame(0xF3,[1])
};


/* =========================================================
RX
========================================================= */

function parsePackets(text){

  const bytes=
  String(text||"")
  .trim()
  .split(/\s+/)
  .filter(Boolean)
  .map(v=>parseInt(v,16));

  const result=[];
  let pos=0;

  while(pos<bytes.length){

    if(
      bytes[pos]!==0x55 ||
      bytes[pos+1]!==0x55
    ){
      pos++;
      continue;
    }

    const command=bytes[pos+2];
    const length=bytes[pos+3];

    const checksumIndex=
    pos+4+length;

    const tail=
    checksumIndex+1;

    if(tail+1>=bytes.length){
      break;
    }

    if(
      bytes[tail]!==0xAA ||
      bytes[tail+1]!==0xAA
    ){
      pos++;
      continue;
    }

    let checksum=command^length;

    for(let i=0;i<length;i++){
      checksum^=bytes[pos+4+i];
    }

    if(
      (checksum&255)!==
      bytes[checksumIndex]
    ){
      pos++;
      continue;
    }

    result.push({
      command,
      payload:
      bytes.slice(
        pos+4,
        pos+4+length
      )
    });

    pos=tail+2;
  }

  return result;
}


/* =========================================================
WRITE
========================================================= */

async function rawGattWrite(bytes){

  if(
    state.write.properties.writeWithoutResponse &&
    state.write.writeValueWithoutResponse
  ){
    await state.write.writeValueWithoutResponse(bytes);
  }

  else if(
    state.write.writeValueWithResponse
  ){
    await state.write.writeValueWithResponse(bytes);
  }

  else{
    await state.write.writeValue(bytes);
  }
}

async function writeRaw(bytes,chunkDelay=3){

  for(let i=0;i<bytes.length;i+=20){

    if(state.stop){
      throw new Error("使用者停止");
    }

    await rawGattWrite(
      bytes.slice(i,i+20)
    );

    await delay(chunkDelay);
  }
}


/* =========================================================
ACK
========================================================= */

async function sendWait(
  name,
  packet,
  expected,
  timeout=5000
){

  const startIndex=
  state.parsedRx.length;

  log(`${name} → ${hex(packet)}`);

  await rawGattWrite(packet);

  const start=Date.now();

  while(Date.now()-start<timeout){

    const incoming=
    state.parsedRx.slice(startIndex);

    for(const parsed of incoming){

      if(parsed.command===expected){

        log(
          `${name} ACK ✅ 0x${expected.toString(16).toUpperCase()}`
        );

        return true;
      }
    }

    await delay(25);
  }

  log(`${name} ACK ❌ TIMEOUT`);

  return false;
}


/* =========================================================
V20.5 PAGE END
========================================================= */

async function pageEndOnce(
  name,
  timeout=9000
){

  const packet=
  CMD.pageEnd();

  const startIndex=
  state.parsedRx.length;

  log(`${name} → ${hex(packet)}`);

  await rawGattWrite(packet);

  const start=
  Date.now();

  let sawDB=false;

  while(Date.now()-start<timeout){

    const incoming=
    state.parsedRx.slice(startIndex);

    for(const parsed of incoming){

      if(parsed.command===0xE4){

        log(
          `${name} ACK ✅ 0xE4`
        );

        return{
          ok:true,
          db:false
        };
      }

      if(parsed.command===0xDB){

        if(!sawDB){

          sawDB=true;

          log(
            `${name} 收到 DB：${hex(parsed.payload||[])}`
          );
        }
      }
    }

    /*
    DB 已經明確回來時，
    不用傻等滿9秒。
    */

    if(sawDB){

      await delay(250);

      return{
        ok:false,
        db:true
      };
    }

    await delay(40);
  }

  log(
    `${name} ACK ❌ TIMEOUT`
  );

  return{
    ok:false,
    db:false
  };
}


async function pageEndWithRetry(
  pageIndex
){

  const name=
  `PAGE END ${pageIndex+1}`;

  let result=
  await pageEndOnce(
    name,
    9000
  );

  if(result.ok){
    return true;
  }

  /*
  第一次失敗：
  DB → 等久一點
  Timeout → 也重新給緩衝
  */

  if(result.db){

    log(
      `${name}：印表機尚未接受，等待1500ms後重試`
    );

    await delay(1500);
  }

  else{

    log(
      `${name}：未收到E4，等待1200ms後重試`
    );

    await delay(1200);
  }

  result=
  await pageEndOnce(
    `${name} RETRY`,
    12000
  );

  return result.ok;
}


/* =========================================================
V20.5 ADAPTIVE SETTLE
========================================================= */

function hasLateD3(startIndex){

  const incoming=
  state.parsedRx.slice(startIndex);

  for(const packet of incoming){

    if(
      packet.command===0xD3 &&
      packet.payload?.length>=1 &&
      packet.payload[0]>=3
    ){
      return true;
    }
  }

  return false;
}


async function settleAfterBitmap(
  runs,
  d3StartIndex,
  status
){

  let waitMs=700;

  if(runs.length>=300){
    waitMs=1000;
  }

  if(runs.length>=450){
    waitMs=1500;
  }

  if(runs.length>=600){
    waitMs=2200;
  }

  if(runs.length>=750){
    waitMs=2800;
  }

  status.textContent=
  `Bitmap 完成｜SETTLE ${waitMs}ms…`;

  log(
    `BITMAP 完成｜RUNS ${runs.length}｜SETTLE ${waitMs}ms`
  );

  await delay(waitMs);

  if(hasLateD3(d3StartIndex)){

    log(
      "SETTLE：已看到後段 D3，再等待400ms"
    );

    await delay(400);
  }

  else if(runs.length>=500){

    /*
    大量圖片即使還沒看到後段D3，
    再補一點緩衝。
    */

    log(
      "SETTLE：大量資料未看到後段D3，再等待600ms"
    );

    await delay(600);
  }
}


/* =========================================================
CANVAS
========================================================= */

function whiteCanvas(width,height){

  const canvas=
  document.createElement("canvas");

  canvas.width=width;
  canvas.height=height;

  const ctx=
  canvas.getContext("2d");

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,width,height);

  ctx.fillStyle="#000";

  return canvas;
}

function wrapText(ctx,text,maxWidth){

  const chars=
  Array.from(text||"");

  const lines=[];
  let line="";

  for(const char of chars){

    const test=
    line+char;

    if(
      ctx.measureText(test).width>
      maxWidth &&
      line
    ){
      lines.push(line);
      line=char;
    }
    else{
      line=test;
    }
  }

  if(line){
    lines.push(line);
  }

  return lines;
}


/* =========================================================
RASTER
========================================================= */

function canvasRows(canvas){

  const ctx=
  canvas.getContext("2d");

  const data=
  ctx.getImageData(
    0,0,
    canvas.width,
    canvas.height
  ).data;

  const rows=[];

  for(let y=0;y<canvas.height;y++){

    const row=
    new Uint8Array(
      canvas.width/8
    );

    let black=0;

    for(let x=0;x<canvas.width;x++){

      const i=
      (
        y*
        canvas.width+
        x
      )*4;

      const gray=
      (
        data[i]*299+
        data[i+1]*587+
        data[i+2]*114
      )/1000;

      if(gray<170){

        row[x>>3]|=
        0x80>>(x&7);

        black++;
      }
    }

    rows.push({
      row:y,
      data:row,
      black
    });
  }

  return rows;
}


function sameRow(a,b){

  if(a.length!==b.length){
    return false;
  }

  for(let i=0;i<a.length;i++){

    if(a[i]!==b[i]){
      return false;
    }
  }

  return true;
}


function rowsToRuns(rows){

  const runs=[];
  let y=0;

  while(y<rows.length){

    const current=
    rows[y];

    if(current.black===0){

      let repeat=1;

      while(
        y+repeat<rows.length &&
        repeat<40 &&
        rows[y+repeat].black===0
      ){
        repeat++;
      }

      runs.push({
        row:y,
        repeat,
        data:current.data,
        black:0
      });

      y+=repeat;

      continue;
    }

    let repeat=1;

    while(
      y+repeat<rows.length &&
      repeat<2 &&
      rows[y+repeat].black>0 &&
      sameRow(
        current.data,
        rows[y+repeat].data
      )
    ){
      repeat++;
    }

    runs.push({
      row:y,
      repeat,
      data:current.data,
      black:current.black
    });

    y+=repeat;
  }

  return runs;
}


function canvasToRuns(canvas){

  return rowsToRuns(
    canvasRows(canvas)
  );
}


function rowPacket(run){

  return frame(
    0x85,
    [
      ...u16(run.row),

      0,

      run.black&255,

      (run.black>>8)&255,

      run.repeat,

      ...run.data
    ]
  );
}


/* =========================================================
BARCODE
========================================================= */

function createBarcodeCanvas(value){

  const raw=
  document.createElement("canvas");

  JsBarcode(
    raw,
    String(value),
    {
      format:"CODE128",
      displayValue:false,
      margin:0,
      width:2,
      height:100,
      background:"#fff",
      lineColor:"#000"
    }
  );

  return raw;
}


function stretchBarcode(
  raw,
  targetWidth,
  targetHeight
){

  const canvas=
  document.createElement("canvas");

  canvas.width=
  Math.max(
    8,
    Math.floor(
      targetWidth/8
    )*8
  );

  canvas.height=
  Math.max(
    10,
    targetHeight
  );

  const ctx=
  canvas.getContext("2d");

  ctx.fillStyle="#fff";

  ctx.fillRect(
    0,0,
    canvas.width,
    canvas.height
  );

  ctx.imageSmoothingEnabled=false;

  ctx.drawImage(
    raw,
    0,0,
    raw.width,
    raw.height,
    0,0,
    canvas.width,
    canvas.height
  );

  return canvas;
}


/* =========================================================
QR
========================================================= */

async function createQRCanvas(value,dots){

  return new Promise((resolve,reject)=>{

    try{

      const holder=
      document.createElement("div");

      holder.style.position=
      "fixed";

      holder.style.left=
      "-9999px";

      holder.style.top=
      "-9999px";

      document.body.appendChild(holder);

      new QRCode(
        holder,
        {
          text:String(value),
          width:dots,
          height:dots,
          correctLevel:
          QRCode.CorrectLevel.M
        }
      );

      setTimeout(()=>{

        try{

          const source=
          holder.querySelector("canvas");

          if(!source){

            throw new Error(
              "QR Code 產生失敗"
            );
          }

          const canvas=
          document.createElement("canvas");

          canvas.width=dots;
          canvas.height=dots;

          canvas
          .getContext("2d")
          .drawImage(
            source,
            0,0,
            dots,dots
          );

          holder.remove();

          resolve(canvas);
        }

        catch(error){

          holder.remove();

          reject(error);
        }

      },30);
    }

    catch(error){

      reject(error);
    }
  });
}

function escapeHtml(value){

  return String(value||"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;");
}


function renderProducts(){

  $("products");

  box.innerHTML="";

  if(!products.length){

    box.innerHTML=
    '<div class="help" style="margin-top:12px">尚未加入商品</div>';

    return;
  }

  products.forEach(
    (item,index)=>{

      const div=
      document.createElement("div");

      div.className="item";

      div.innerHTML=`
        <b>
        ${index+1}.
        ${escapeHtml(item.name||"未命名")}
        </b>

        <div class="help">
        條碼：${escapeHtml(item.barcode||"—")}<br>
        QR：${escapeHtml(item.qr||"—")}<br>
        文字：${escapeHtml(item.text||"—")}
        </div>

        <button
        class="danger removeProduct"
        data-i="${index}">
        刪除
        </button>
      `;

      box.appendChild(div);
    }

  document
  .querySelectorAll(".removeProduct")
  .forEach(button=>{

    button.onclick=()=>{

      products.splice(
        Number(
          button.dataset.i

        1
      );

      renderProducts();

      renderGeneralPreview();
    };
  });
}

/* =========================================================
GENERAL CANVAS
========================================================= */

async function buildProductCanvas(item){

  const mode=
  $("mode").value;

  const width=
  paperDots(
    Number(
      $("paperWidth").value
    )
  );

  const margin=
  Math.max(
    8,
    mmToDots(2)
  );

  const gap=
  Math.max(
    2,
    mmToDots(
      Number(
        $("itemGap").value
      )
    )
  );

  const barcodeHeightCm=
  Number(
    $("barcodeHeight").value
  )||2;

  const sync=
  $("syncBarcodeText").checked;

  const textScale=
  sync
  ?clamp(
    barcodeHeightCm/2,
    .5,
    5
  )
  :1;

  const baseNameFont=
  Number(
    $("nameFont").value
  )||30;

  const baseNumberFont=
  Number(
    $("numberFont").value
  )||24;

  const nameFont=
  sync
  ?Math.round(
    baseNameFont*
    textScale
  )
  :baseNameFont;

  const numberFont=
  sync
  ?Math.round(
    baseNumberFont*
    textScale
  )
  :baseNumberFont;

  const textFont=
  Number(
    $("textFont").value
  )||36;

  const barcodeHeight=
  mmToDots(
    barcodeHeightCm*
    10
  );

  const barcodePercent=
  Number(
    $("barcodeWidth").value
  )/100;

  const qrDots=
  mmToDots(
    Number(
      $("qrSize").value
    )*10
  );

  const footer=
  $("footer")
  .value.trim();

  const layers=[];

  function spacer(height=gap){

    layers.push({
      type:"space",
      height
    });
  }

  const needName=[
    "name_barcode_number",
    "name_barcode",
    "name",
    "name_qr",
    "name_qr_text",
    "name_barcode_qr",
    "name_barcode_number_qr",
    "name_text"
  ].includes(mode);

  const needBarcode=[
    "name_barcode_number",
    "name_barcode",
    "barcode_number",
    "barcode",
    "name_barcode_qr",
    "name_barcode_number_qr"
  ].includes(mode);

  const needNumber=[
    "name_barcode_number",
    "barcode_number",
    "name_barcode_number_qr"
  ].includes(mode);

  const needQR=[
    "name_qr",
    "qr",
    "qr_text",
    "name_qr_text",
    "name_barcode_qr",
    "name_barcode_number_qr"
  ].includes(mode);

  const needText=[
    "qr_text",
    "name_qr_text",
    "name_text",
    "text"
  ].includes(mode);


  if(
    needName &&
    item.name
  ){

    layers.push({
      type:"text",
      text:item.name,
      font:nameFont,
      weight:"700"
    });

    spacer();
  }


  if(
    needBarcode &&
    item.barcode
  ){

    const raw=
    createBarcodeCanvas(
      item.barcode
    );

    const available=
    width-
    margin*2;

    const target=
    Math.max(
      32,
      Math.floor(
        available*
        barcodePercent
      )
    );

    const barcodeCanvas=
    stretchBarcode(
      raw,
      target,
      barcodeHeight
    );

    layers.push({
      type:"image",
      canvas:barcodeCanvas,
      align:
      $("barcodeAlign").value,

      xOffset:
      mmToDots(
        Number(
          $("barcodeX").value
        )||0
      )
    });

    spacer();
  }


  if(
    needNumber &&
    item.barcode
  ){

    layers.push({
      type:"text",
      text:item.barcode,
      font:numberFont,
      weight:"500"
    });

    spacer();
  }


  if(
    needQR &&
    (
      item.qr ||
      item.barcode
    )
  ){

    const qrCanvas=
    await createQRCanvas(
      item.qr||
      item.barcode,
      qrDots
    );

    layers.push({
      type:"image",
      canvas:qrCanvas,
      align:"center",
      xOffset:0
    });

    spacer();
  }


  if(
    needText &&
    item.text
  ){

    layers.push({
      type:"text",
      text:item.text,
      font:textFont,
      weight:"700"
    });

    spacer();
  }


  if(footer){

    for(
      const line
      of footer.split(/\r?\n/)
    ){

      if(!line){
        continue;
      }

      layers.push({
        type:"text",
        text:line,
        font:20,
        weight:"500"
      });

      spacer(
        Math.max(
          2,
          gap/2
        )
      );
    }
  }


  if(
    layers.length &&
    layers[
      layers.length-1
    ].type==="space"
  ){
    layers.pop();
  }


  let height=
  margin*2;

  const measure=
  document
  .createElement("canvas")
  .getContext("2d");


  for(const layer of layers){

    if(layer.type==="space"){

      height+=layer.height;
    }

    else if(
      layer.type==="image"
    ){

      height+=
      layer.canvas.height;
    }

    else if(
      layer.type==="text"
    ){

      measure.font=
      `${layer.weight} ${layer.font}px "PingFang TC",sans-serif`;

      const lines=
      wrapText(
        measure,
        layer.text,
        width-
        margin*2
      );

      layer.lines=
      lines;

      layer.lineHeight=
      Math.ceil(
        layer.font*
        1.25
      );

      height+=
      layer.lineHeight*
      lines.length;
    }
  }


  height=
  Math.max(
    80,
    Math.ceil(height)
  );


  const canvas=
  whiteCanvas(
    width,
    height
  );

  const ctx=
  canvas.getContext("2d");

  let y=
  margin;


  for(const layer of layers){

    if(layer.type==="space"){

      y+=layer.height;

      continue;
    }


    if(layer.type==="image"){

      let x=
      margin;

      if(
        layer.align==="center"
      ){

        x=
        (
          width-
          layer.canvas.width
        )/2;
      }

      else if(
        layer.align==="right"
      ){

        x=
        width-
        margin-
        layer.canvas.width;
      }

      x+=
      layer.xOffset||
      0;

      x=
      clamp(
        x,
        0,
        width-
        layer.canvas.width
      );

      ctx.drawImage(
        layer.canvas,
        Math.round(x),
        Math.round(y)
      );

      y+=
      layer.canvas.height;

      continue;
    }


    if(layer.type==="text"){

      ctx.fillStyle="#000";

      ctx.font=
      `${layer.weight} ${layer.font}px -apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif`;

      ctx.textAlign=
      "center";

      ctx.textBaseline=
      "top";

      for(
        const line
        of layer.lines
      ){

        ctx.fillText(
          line,
          width/2,
          y
        );

        y+=
        layer.lineHeight;
      }
    }
  }

  return canvas;
}

function splitBigText(){

  const raw=
  $("bigText").value;

  const splitMode=
  $("splitMode").value;

  const charsPer=
  $("charsPerPage").value;

  let tokens=[];

  if(
    splitMode==="space"
  ){

    tokens=
    raw.trim()
    .split(/\s+/)
    .filter(Boolean);
  }

  else if(
    splitMode==="line"
  ){

    tokens=
    raw
    .split(/\r?\n/)
    .map(v=>v.trim())
    .filter(Boolean);
  }

  else{

    tokens=
    Array.from(
      raw.replace(
        /\s+/g,
        ""
      )
    );
  }

  if(
    splitMode!=="char" ||
    charsPer==="auto"
  ){
    return tokens;
  }

  const count=
  Math.max(
    1,
    Number(charsPer)||1
  );

  const pages=[];

  for(
    let i=0;
    i<tokens.length;
    i+=count
  ){

    pages.push(
      tokens
      .slice(
        i,
        i+count
      )
      .join("")
    );
  }

  return pages;
}


function fitFont(
  ctx,
  text,
  maxWidth,
  maxHeight,
  weight
){

  let low=20;
  let high=1000;
  let best=20;

  while(low<=high){

    const mid=
    Math.floor(
      (
        low+
        high
      )/2
    );

    ctx.font=
    `${weight} ${mid}px Arial,-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif`;

    const metrics=
    ctx.measureText(text);

    const width=
    metrics.width;

    const height=
    (
      metrics.actualBoundingBoxAscent||
      mid*.8
    )+
    (
      metrics.actualBoundingBoxDescent||
      mid*.2
    );

    if(
      width<=maxWidth &&
      height<=maxHeight
    ){

      best=mid;

      low=
      mid+1;
    }

    else{

      high=
      mid-1;
    }
  }

  return best;
}

  ){

    width-
    margin;
  }

  else{

    ctx.textAlign=
    "center";

  }

  let y;

  if(
    valign==="top"
  ){

  }

    height/2;
  }

  ctx.fillText(

    x+xOffset,
    y+yOffset
  );

  return canvas;
}


function bigFloydRows(
  canvas,
  blackPercent
){

  const ctx=
  canvas.getContext("2d");

  const source=
  ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  ).data;

  const w=
  canvas.width;

  const h=
  canvas.height;

  const gray=
  new Float32Array(
    w*h
  );

  const targetBlackGray=
  Math.round(
    255*
    (
      1-
      blackPercent/100
    )
  );

  for(let y=0;y<h;y++){

    for(let x=0;x<w;x++){

      const srcIndex=
      (
        y*w+
        x
      )*4;

      const original=
      (
        source[srcIndex]*299+
        source[srcIndex+1]*587+
        source[srcIndex+2]*114
      )/1000;

      const darkness=
      1-
      original/255;

      gray[
        y*w+x
      ]=
      255-
      darkness*
      (
        255-
        targetBlackGray
      );
    }
  }

  const rows=[];
  const threshold=128;

  for(let y=0;y<h;y++){

    const row=
    new Uint8Array(
      w/8
    );

    let black=0;

    const reverse=
    y%2===1;

    const start=
    reverse?
    w-1:
    0;

    const end=
    reverse?
    -1:
    w;

    const step=
    reverse?
    -1:
    1;

    for(
      let x=start;
      x!==end;
      x+=step
    ){

      const idx=
      y*w+x;

      const old=
      clamp(
        gray[idx],
        0,
        255
      );

      const newValue=
      old<
      threshold
      ?0
      :255;

      const error=
      old-
      newValue;

      if(
        newValue===0
      ){

        row[x>>3]|=
        0x80>>(x&7);

        black++;
      }

      if(!reverse){

        if(x+1<w){

          gray[
            idx+1
          ]+=
          error*
          7/16;
        }

        if(
          y+1<h &&
          x>0
        ){

          gray[
            idx+w-1
          ]+=
          error*
          3/16;
        }

        if(y+1<h){

          gray[
            idx+w
          ]+=
          error*
          5/16;
        }

        if(
          y+1<h &&
          x+1<w
        ){

          gray[
            idx+w+1
          ]+=
          error*
          1/16;
        }
      }

      else{

        if(x-1>=0){

          gray[
            idx-1
          ]+=
          error*
          7/16;
        }

        if(
          y+1<h &&
          x+1<w
        ){

          gray[
            idx+w+1
          ]+=
          error*
          3/16;
        }

        if(y+1<h){

          gray[
            idx+w
          ]+=
          error*
          5/16;
        }

        if(
          y+1<h &&
          x-1>=0
        ){

          gray[
            idx+w-1
          ]+=
          error*
          1/16;
        }
      }
    }

    rows.push({
      row:y,
      data:row,
      black
    });
  }

  return rows;
}

function readPhotoFile(file){

  return new Promise(
    (resolve,reject)=>{

      const reader=
      new FileReader();

      reader.onload=()=>{

        const img=
        new Image();

        img.onload=()=>{

          resolve({
            id:
            `${Date.now()}_${Math.random()}`,

            name:
            file.name||
            "照片",

            image:
            img,

            src:
            reader.result
          });
        };

        img.onerror=()=>{

          reject(
            new Error(
              "照片讀取失敗"
            )
          );
        };

        img.src=
        reader.result;
      };

      reader.onerror=()=>{

        reject(
          new Error(
            "照片檔案讀取失敗"
          )
        );
      };

      reader.readAsDataURL(
        file
      );
    }
  );
}

function buildPhotoCanvas(item){

  const settings=
  photoPageSettings();

  const canvas=
  whiteCanvas(
    settings.width,
    settings.height
  );

  const ctx=
  canvas.getContext("2d");

  const photoImage=
  item.image;

  const rotation=
  Number(
    $("photoRotate").value
  );

  const scale=
  (
    Number(
      $("photoScale").value
    )||100
  )/100;

  const xOffset=
  mmToDots(
    Number(
      $("photoX").value
    )||0
  );

  const yOffset=
  mmToDots(
    Number(
      $("photoY").value
    )||0
  );

  const fit=
  $("photoFit").value;

  const sourceW=
  photoImage.naturalWidth;

  const sourceH=
  photoImage.naturalHeight;

  const rotated=
  rotation===90||
  rotation===270;

  const effectiveW=
  rotated?
  sourceH:
  sourceW;

  const effectiveH=
  rotated?
  sourceW:
  sourceH;

  const fitScale=
  fit==="cover"
  ?Math.max(
    settings.width/
    effectiveW,

    settings.height/
    effectiveH
  )
  :Math.min(
    settings.width/
    effectiveW,

    settings.height/
    effectiveH
  );

  const drawScale=
  fitScale*
  scale;

  const drawW=
  sourceW*
  drawScale;

  const drawH=
  sourceH*
  drawScale;

  ctx.save();

  ctx.translate(
    settings.width/2+
    xOffset,

    settings.height/2+
    yOffset
  );

  ctx.rotate(
    rotation*
    Math.PI/180
  );

  ctx.drawImage(
    photoImage,
    -drawW/2,
    -drawH/2,
    drawW,
    drawH
  );

  ctx.restore();

  return canvas;
}

function thresholdPhotoRows(
  canvas,
  threshold
){

  const ctx=
  canvas.getContext("2d");

  const data=
  ctx.getImageData(
    0,0,
    canvas.width,
    canvas.height
  ).data;

  const rows=[];

  for(let y=0;y<canvas.height;y++){

    const row=
    new Uint8Array(
      canvas.width/8
    );

    let black=0;

    for(let x=0;x<canvas.width;x++){

      const i=
      (
        y*
        canvas.width+
        x
      )*4;

      const gray=
      (
        data[i]*299+
        data[i+1]*587+
        data[i+2]*114
      )/1000;

      if(gray<threshold){

        row[x>>3]|=
        0x80>>(x&7);

        black++;
      }
    }

    rows.push({
      row:y,
      data:row,
      black
    });
  }

  return rows;
}


function orderedPhotoRows(
  canvas,
  threshold
){

  const ctx=
  canvas.getContext("2d");

  const data=
  ctx.getImageData(
    0,0,
    canvas.width,
    canvas.height
  ).data;

  const bayer=[
    0,8,2,10,
    12,4,14,6,
    3,11,1,9,
    15,7,13,5
  ];

  const rows=[];

  for(let y=0;y<canvas.height;y++){

    const row=
    new Uint8Array(
      canvas.width/8
    );

    let black=0;

    for(let x=0;x<canvas.width;x++){

      const i=
      (
        y*
        canvas.width+
        x
      )*4;

      const gray=
      (
        data[i]*299+
        data[i+1]*587+
        data[i+2]*114
      )/1000;

      const b=
      bayer[
        (y&3)*4+
        (x&3)
      ];

      const local=
      threshold+
      (
        b-
        7.5
      )*9;

      if(gray<local){

        row[x>>3]|=
        0x80>>(x&7);

        black++;
      }
    }

    rows.push({
      row:y,
      data:row,
      black
    });
  }

  return rows;
}


function floydPhotoRows(
  canvas,
  threshold
){

  const ctx=
  canvas.getContext("2d");

  const source=
  ctx.getImageData(
    0,0,
    canvas.width,
    canvas.height
  ).data;

  const w=
  canvas.width;

  const h=
  canvas.height;

  const gray=
  new Float32Array(
    w*h
  );

  for(let y=0;y<h;y++){

    for(let x=0;x<w;x++){

      const i=
      (
        y*w+
        x
      )*4;

      gray[
        y*w+x
      ]=
      (
        source[i]*299+
        source[i+1]*587+
        source[i+2]*114
      )/1000;
    }
  }

  const rows=[];

  for(let y=0;y<h;y++){

    const row=
    new Uint8Array(
      w/8
    );

    let black=0;

    const reverse=
    y%2===1;

    const start=
    reverse?
    w-1:
    0;

    const end=
    reverse?
    -1:
    w;

    const step=
    reverse?
    -1:
    1;

    for(
      let x=start;
      x!==end;
      x+=step
    ){

      const idx=
      y*w+x;

      const old=
      clamp(
        gray[idx],
        0,
        255
      );

      const newValue=
      old<threshold
      ?0
      :255;

      const error=
      old-newValue;

      if(
        newValue===0
      ){

        row[x>>3]|=
        0x80>>(x&7);

        black++;
      }

      if(!reverse){

        if(x+1<w){

          gray[
            idx+1
          ]+=
          error*
          7/16;
        }

        if(
          y+1<h &&
          x>0
        ){

          gray[
            idx+w-1
          ]+=
          error*
          3/16;
        }

        if(y+1<h){

          gray[
            idx+w
          ]+=
          error*
          5/16;
        }

        if(
          y+1<h &&
          x+1<w
        ){

          gray[
            idx+w+1
          ]+=
          error*
          1/16;
        }
      }

      else{

        if(x-1>=0){

          gray[
            idx-1
          ]+=
          error*
          7/16;
        }

        if(
          y+1<h &&
          x+1<w
        ){

          gray[
            idx+w+1
          ]+=
          error*
          3/16;
        }

        if(y+1<h){

          gray[
            idx+w
          ]+=
          error*
          5/16;
        }

        if(
          y+1<h &&
          x-1>=0
        ){

          gray[
            idx+w-1
          ]+=
          error*
          1/16;
        }
      }
    }

    rows.push({
      row:y,
      data:row,
      black
    });
  }

  return rows;
}


function photoRows(canvas){

    $("photoThreshold").value
  )||160;

  if(
    mode==="ordered"
  ){

    return orderedPhotoRows(
      canvas,
      threshold
    );
  }

  if(
    mode==="floyd"
  ){

    return floydPhotoRows(
      canvas,
      threshold
    );
  }

  return thresholdPhotoRows(
    canvas,
    threshold
  );
}

/* =========================================================
PRINT SESSION
========================================================= */

async function beginPrint(
  density,
  labelType
){

  if(
    !await sendWait(
      "CONNECT",
      CMD.connect(),
      0xC2
    )
  ){

    throw new Error(
      "CONNECT 沒有 ACK"
    );
  }

  if(
    !await sendWait(
      "DENSITY",
      CMD.density(density),
      0x31
    )
  ){

    throw new Error(
      "DENSITY 沒有 ACK"
    );
  }

  if(
    !await sendWait(
      "LABEL TYPE",
      CMD.labelType(labelType),
      0x33
    )
  ){

    throw new Error(
      "LABEL TYPE 沒有 ACK"
    );
  }

  if(
    !await sendWait(
      "PRINT START",
      CMD.printStart(),
      0x02
    )
  ){

    throw new Error(
      "PRINT START 沒有 ACK"
    );
  }
}


async function finishPrint(){

  if(
    !await sendWait(
      "PRINT END",
      CMD.printEnd(),
      0xF4,
      12000
    )
  ){

    throw new Error(
      "PRINT END 沒有 ACK"
    );
  }
}


/* =========================================================
V20.5 PAGE SEND
========================================================= */

async function sendRunsPage(
  canvas,
  runs,
  pageIndex,
  total,
  status,
  options={}
){

  const paced=
  !!options.paced;

  const settle=
  !!options.settle;

  const retryPageEnd=
  !!options.retryPageEnd;

  const betweenPages=
  Number(
    options.betweenPages||
    500
  );


  if(
    !await sendWait(
      `PAGE START ${pageIndex+1}`,
      CMD.pageStart(),
      0x04,
      5000
    )
  ){

    throw new Error(
      `第 ${pageIndex+1} 張 PAGE START 失敗`
    );
  }


  if(
    !await sendWait(
      `PAGE SIZE ${pageIndex+1}`,
      CMD.pageSize(
        canvas.height,
        canvas.width
      ),
      0x14,
      5000
    )
  ){

    throw new Error(
      `第 ${pageIndex+1} 張 PAGE SIZE 失敗`
    );
  }


  log(
    `PAGE ${pageIndex+1}｜${canvas.width}×${canvas.height}｜RUNS ${runs.length}`
  );


  const d3StartIndex=
  state.parsedRx.length;


  for(
    let i=0;
    i<runs.length;
    i++
  ){

    await writeRaw(
      rowPacket(
        runs[i]
      ),
      paced?
      3:
      5
    );


    if(
      paced &&
      runs[i].black>0
    ){

      await delay(5);
    }


    if(
      paced &&
      (
        i+1
      )%
      24===
      0
    ){

      await delay(18);
    }


    if(
      (
        i+1
      )%
      20===
      0 ||
      i===
      runs.length-1
    ){

      status.textContent=
      `第 ${pageIndex+1}/${total} 張｜${i+1}/${runs.length}`;
    }
  }


  log(
    `第 ${pageIndex+1} 張 BITMAP DATA ✅`
  );


  if(settle){

    await settleAfterBitmap(
      runs,
      d3StartIndex,
      status
    );
  }


  let pageEndOK;


  if(retryPageEnd){

    pageEndOK=
    await pageEndWithRetry(
      pageIndex
    );
  }

  else{

    pageEndOK=
    await sendWait(
      `PAGE END ${pageIndex+1}`,
      CMD.pageEnd(),
      0xE4,
      20000
    );
  }


  if(!pageEndOK){

    throw new Error(
      `第 ${pageIndex+1} 張 PAGE END 失敗`
    );
  }


  if(
    pageIndex<
    total-1
  ){

    status.textContent=
    `第 ${pageIndex+1}/${total} 張完成｜等待下一張…`;

    await delay(
      betweenPages
    );
  }
}

/* =========================================================
CONNECT
========================================================= */

$("connectBtn").onclick=
async()=>{

  try{

    $("bleStatus").className=
    "status warn";

    $("bleStatus").textContent=
    "正在連線…";

    const device=
    await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:[
        SERVICE
      ]
    });

    state.device=
    device;

    $("deviceName").textContent=
    device.name||
    "—";

    state.server=
    await device.gatt.connect();

    const service=
    await state.server
    .getPrimaryService(
      SERVICE
    );

    state.write=
    await service
    .getCharacteristic(
      WRITE_UUID
    );

    state.notify=
    await service
    .getCharacteristic(
      NOTIFY_UUID
    );

    state.parsedRx=[];

    state.notify
    .addEventListener(
      "characteristicvaluechanged",
      event=>{

        const value=
        event.target.value;

        const bytes=
        new Uint8Array(
          value.buffer,
          value.byteOffset,
          value.byteLength
        );

        const text=
        hex(bytes);

        const packets=
        parsePackets(text);

        for(
          const packet
          of packets
        ){

          state.parsedRx.push(
            packet
          );
        }

        log(
          "RX："+text
        );
      }
    );

    await state.notify
    .startNotifications();

    state.device
    .addEventListener(
      "gattserverdisconnected",
      ()=>{

        state.server=null;
        state.write=null;
        state.notify=null;

        $("bleStatus").className=
        "status warn";

        $("bleStatus").textContent=
        "B3S 已中斷";

        updateButtons();
      }
    );

    $("bleStatus").className=
    "status ok";

    $("bleStatus").textContent=
    "✅ B3S 已連線";

    updateButtons();
  }

  catch(error){

    const message=
    errorText(error);

    $("bleStatus").className=
    "status err";

    $("bleStatus").textContent=
    "❌ "+message;

    log(
      "CONNECT ERROR："+
      message
    );

    updateButtons();
  }
};

/* =========================================================
SCANNER
========================================================= */

$("scanBtn").onclick=
async()=>{

  const reader=
  $("reader");

  try{

    if(html5QrCode){

      await html5QrCode
      .stop()
      .catch(()=>{});

      html5QrCode.clear();

      html5QrCode=null;

      reader
      .classList
      .add("hidden");

      $("scanBtn").textContent=
      "📷 掃描條碼 / QR";

      return;
    }

    reader
    .classList
    .remove("hidden");

    html5QrCode=
    new Html5Qrcode(
      "reader"
    );

    $("scanBtn").textContent=
    "停止掃描";

    await html5QrCode.start(

      {
        facingMode:
        "environment"
      },

      {
        fps:10,

        qrbox:{
          width:260,
          height:180
        }
      },

      async decodedText=>{

        const value=
        String(
          decodedText||
          ""
        ).trim();

        if(!value){
          return;
        }

        if(
          /^\d+$/.test(value)
        ){

          $("barcode").value=
          value;
        }

        else{

          $("qrValue").value=
          value;
        }

        try{

          await html5QrCode
          .stop();
        }
        catch{}

        html5QrCode.clear();

        html5QrCode=null;

        reader
        .classList
        .add("hidden");

        $("scanBtn").textContent=
        "📷 掃描條碼 / QR";
      }
    );
  }

  catch(error){

    alert(
      "掃描器錯誤："+
      errorText(error)
    );

    try{

      html5QrCode
      ?.clear();
    }
    catch{}

    html5QrCode=null;

    reader
    .classList
    .add("hidden");

    $("scanBtn").textContent=
    "📷 掃描條碼 / QR";
  }
};


/* =========================================================
MODE
========================================================= */

function updateMode(){

  const value=
  $("mode").value;

  const big=
  value===
  "big_sign";

  const photo=
  value===
  "photo";

  $("generalPanel")
  .classList
  .toggle(
    "hidden",
    big||photo
  );

  $("bigPanel")
  .classList
  .toggle(
    "hidden",
    !big
  );

  $("photoPanel")
  .classList
  .toggle(
    "hidden",
    !photo
  );

  if(big){

    renderBigPreview();
  }

  else if(photo){

    renderPhotoList();

    renderPhotoPreview();
  }

  else{

    renderGeneralPreview();
  }
}

$("mode").onchange=
updateMode;
