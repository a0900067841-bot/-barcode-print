<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>商品條碼列印｜B3S V10</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#f4f6f8;color:#18202a;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif
}
.wrap{max-width:900px;margin:auto;padding:18px}
h1{margin:0 0 5px;font-size:28px}
h2{margin-top:0}
.sub,.help{color:#667085}
.sub{margin-bottom:18px}
.help{font-size:14px;line-height:1.6}
.card{
  background:#fff;border:1px solid #d8dee8;
  border-radius:16px;padding:16px;margin-bottom:16px
}
button{
  border:0;border-radius:10px;min-height:48px;padding:10px 14px;
  font-size:16px;font-weight:700;background:#eef2f6;color:#18202a
}
button:disabled{opacity:.45}
.primary{background:#1265f3;color:#fff}
.okbtn{background:#e7f8ef;color:#087443}
.danger{background:#fff0ef;color:#d92d20}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.status{
  padding:12px;border-radius:10px;background:#f2f4f7;margin:12px 0
}
.status.ok{background:#ecfdf3;color:#067647}
.status.warn{background:#fff8e6;color:#8a5a00}
.status.err{background:#fff1f0;color:#d92d20}
.step{
  border:1px solid #d8dee8;border-radius:12px;
  padding:12px;margin:8px 0;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace
}
.step.ok{background:#ecfdf3}
.step.err{background:#fff1f0}
.step.wait{background:#fff8e6}
textarea{
  width:100%;min-height:300px;padding:12px;
  border:1px solid #cfd6e1;border-radius:10px;
  font:13px ui-monospace,SFMono-Regular,Menlo,monospace
}
.device-grid{
  display:grid;grid-template-columns:140px 1fr;
  gap:8px 12px;font-size:14px
}
@media(max-width:650px){
  .device-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="wrap">

<h1>B3S 頁面流程測試</h1>
<div class="sub">NIIMBOT 協定辨識 V10</div>

<div class="card">

<h2>藍牙連線</h2>

<div id="bleStatus" class="status">
尚未連線
</div>

<div class="actions">
<button id="connectBtn" class="okbtn">
🔵 連接 B3S
</button>

<button id="disconnectBtn" disabled>
中斷連線
</button>
</div>

<div class="device-grid">
<b>裝置</b>
<span id="deviceName">—</span>

<b>固定寫入通道</b>
<span>49535343…8841</span>

<b>固定通知通道</b>
<span>49535343…1E4D</span>
</div>

</div>


<div class="card">

<h2>V10 頁面流程辨識</h2>

<p class="help">
這版不送 PRINT_CLEAR，也不送圖片。
會先測 PAGE START，接著自動辨識 B3S 使用哪一種 SET PAGE SIZE 格式。
</p>

<p class="help">
測試尺寸固定為 64 dots 寬 × 8 dots 高，只用來辨識協定。
</p>

<div class="actions">

<button id="autoTestBtn" class="primary" disabled>
🧪 自動辨識頁面格式
</button>

<button id="d110Btn" disabled>
測試 D110：高度＋寬度
</button>

<button id="d11Btn" disabled>
測試 D11：只有高度
</button>

<button id="clearBtn">
清除結果
</button>

</div>

<div id="testStatus" class="status">
尚未測試
</div>

<div id="steps"></div>

<textarea
id="result"
readonly
placeholder="V10 測試結果會顯示在這裡">
</textarea>

</div>


<div class="card">

<h2>通訊紀錄</h2>

<div class="actions">

<button id="copyBtn">
複製紀錄
</button>

<button id="clearLogBtn">
清除紀錄
</button>

</div>

<textarea id="log" readonly></textarea>

</div>

</div>


<script>

const $ = id =>
document.getElementById(id);


const SERVICE =
"49535343-fe7d-4ae5-8fa9-9fafd205e455";

const WRITE_UUID =
"49535343-8841-43f4-a8d4-ecbe34729bb3";

const NOTIFY_UUID =
"49535343-1e4d-4bd9-ba61-23c647249616";


const state = {

  device:null,

  server:null,

  write:null,

  notify:null,

  rx:[]

};


function delay(ms){

  return new Promise(
    resolve =>
    setTimeout(resolve,ms)
  );

}


function hex(bytes){

  return Array
  .from(bytes)
  .map(
    value =>
    value
    .toString(16)
    .padStart(2,"0")
    .toUpperCase()
  )
  .join(" ");

}


function log(text){

  const box =
  $("log");

  box.value +=
  `[${new Date().toLocaleTimeString()}] ${text}\n`;

  box.scrollTop =
  box.scrollHeight;

}


function frame(
  command,
  data=[0x01],
  connect=false
){

  const payload =
  Array.from(data);

  let checksum =
  command ^
  payload.length;

  for(const value of payload){

    checksum ^=
    value;

  }

  const packet = [

    0x55,
    0x55,

    command,

    payload.length,

    ...payload,

    checksum & 0xFF,

    0xAA,
    0xAA

  ];


  if(connect){

    packet.unshift(
      0x03
    );

  }


  return new Uint8Array(
    packet
  );

}


function u16(value){

  return [

    (value >> 8) & 0xFF,

    value & 0xFF

  ];

}


/*
已確認成功：
CONNECT       C1 -> C2
SET DENSITY   21 -> 31
SET LABEL     23 -> 33
PRINT START   01 -> 02

V10 要測：
PAGE START      03 -> 04
SET PAGE SIZE   13 -> 14
PRINT QUANTITY  15 -> 16
*/

const PACKET = {

  connect:
  frame(
    0xC1,
    [0x01],
    true
  ),

  density:
  frame(
    0x21,
    [0x02]
  ),

  label:
  frame(
    0x23,
    [0x01]
  ),

  printStart:
  frame(
    0x01
  ),

  pageStart:
  frame(
    0x03
  ),

  /* D110 = height + width */
  pageSizeD110:
  frame(
    0x13,
    [
      ...u16(8),
      ...u16(64)
    ]
  ),

  /* D11_V1 = height only */
  pageSizeD11:
  frame(
    0x13,
    [
      ...u16(8)
    ]
  ),

  quantity:
  frame(
    0x15,
    [
      ...u16(1)
    ]
  ),

  printEnd:
  frame(
    0xF3
  )

};


function parse(hexText){

  const bytes =
  String(hexText || "")
  .trim()
  .split(/\s+/)
  .filter(Boolean)
  .map(x => parseInt(x,16));


  const packets =
  [];


  for(
    let i=0;
    i<bytes.length;
    i++
  ){

    if(
      bytes[i] !== 0x55 ||
      bytes[i+1] !== 0x55
    ){

      continue;

    }


    const cmd =
    bytes[i+2];


    const len =
    bytes[i+3];


    const checksumIndex =
    i + 4 + len;


    const tail =
    checksumIndex + 1;


    if(
      bytes[tail] !== 0xAA ||
      bytes[tail+1] !== 0xAA
    ){

      continue;

    }


    const payload =
    bytes.slice(
      i+4,
      i+4+len
    );


    let checksum =
    cmd ^ len;


    for(const value of payload){

      checksum ^=
      value;

    }


    packets.push({

      command:cmd,

      payload,

      checksumOk:
      (checksum & 0xFF)
      ===
      bytes[checksumIndex]

    });

  }


  return packets;

}


async function write(bytes){

  log(
    "TX：" +
    hex(bytes)
  );


  if(
    state.write.properties.writeWithoutResponse &&
    state.write.writeValueWithoutResponse
  ){

    await state.write
    .writeValueWithoutResponse(
      bytes
    );

  }

  else if(
    state.write.writeValueWithResponse
  ){

    await state.write
    .writeValueWithResponse(
      bytes
    );

  }

  else{

    await state.write
    .writeValue(bytes);

  }

}


async function sendWait(
  packet,
  expected,
  timeout=1800
){

  const startIndex =
  state.rx.length;


  await write(packet);


  const start =
  Date.now();


  while(
    Date.now() - start <
    timeout
  ){

    const newPackets =
    state.rx.slice(
      startIndex
    );


    for(
      const rx
      of newPackets
    ){

      for(
        const packetData
        of parse(rx.hex)
      ){

        if(
          !packetData.checksumOk
        ){

          continue;

        }


        if(
          packetData.command ===
          0x00
        ){

          return {

            ok:false,

            unsupported:true,

            packet:
            packetData

          };

        }


        if(
          packetData.command ===
          expected
        ){

          return {

            ok:true,

            packet:
            packetData

          };

        }

      }

    }


    await delay(40);

  }


  return {

    ok:false,

    timeout:true

  };

}


function hx(value){

  return value
  .toString(16)
  .padStart(2,"0")
  .toUpperCase();

}


function payloadText(payload){

  if(
    !payload ||
    !payload.length
  ){

    return "(空)";

  }


  return payload
  .map(hx)
  .join(" ");

}


function enable(value){

  $("disconnectBtn").disabled =
  !value;

  $("autoTestBtn").disabled =
  !value;

  $("d110Btn").disabled =
  !value;

  $("d11Btn").disabled =
  !value;

}


$("connectBtn").onclick =
async () => {

  try{

    $("bleStatus")
    .className =
    "status warn";


    $("bleStatus")
    .textContent =
    "正在連接…";


    const device =
    await navigator.bluetooth
    .requestDevice({

      acceptAllDevices:true,

      optionalServices:[
        SERVICE
      ]

    });


    state.device =
    device;


    $("deviceName")
    .textContent =
    device.name ||
    "—";


    state.server =
    await device.gatt.connect();


    const service =
    await state.server
    .getPrimaryService(
      SERVICE
    );


    state.write =
    await service
    .getCharacteristic(
      WRITE_UUID
    );


    state.notify =
    await service
    .getCharacteristic(
      NOTIFY_UUID
    );


    state.notify
    .addEventListener(
      "characteristicvaluechanged",

      event => {

        const value =
        event.target.value;


        const bytes =
        new Uint8Array(
          value.buffer,
          value.byteOffset,
          value.byteLength
        );


        const data =
        hex(bytes);


        state.rx.push({

          time:Date.now(),

          hex:data

        });


        if(
          state.rx.length >
          500
        ){

          state.rx.shift();

        }


        log(
          "RX：" +
          data
        );

      }
    );


    await state.notify
    .startNotifications();


    device.addEventListener(
      "gattserverdisconnected",
      () => {

        state.server =
        null;

        state.write =
        null;

        state.notify =
        null;


        enable(false);


        $("bleStatus")
        .className =
        "status warn";


        $("bleStatus")
        .textContent =
        "已中斷";

      }
    );


    $("bleStatus")
    .className =
    "status ok";


    $("bleStatus")
    .textContent =
    "✅ B3S 已連線，NIIMBOT 通道準備完成";


    log(
      "B3S V10 通道準備完成"
    );


    enable(true);

  }

  catch(error){

    $("bleStatus")
    .className =
    "status err";


    $("bleStatus")
    .textContent =
    "連線失敗：" +
    error.message;

  }

};


$("disconnectBtn").onclick =
() => {

  try{

    state.device
    ?.gatt
    ?.disconnect();

  }catch{}

};


/* 顯示步驟 */

function renderSteps(rows){

  $("steps")
  .innerHTML =
  rows

  .map(
    row => `

    <div class="step ${row.type}">

      <b>
      ${row.name}
      </b>

      <br>

      ${row.text}

    </div>

    `
  )

  .join("");

}


async function runBasicStart(
  rows,
  output
){

  const basic = [

    {
      name:"1. CONNECT",
      packet:PACKET.connect,
      ack:0xC2
    },

    {
      name:"2. SET DENSITY",
      packet:PACKET.density,
      ack:0x31
    },

    {
      name:"3. SET LABEL TYPE",
      packet:PACKET.label,
      ack:0x33
    },

    {
      name:"4. PRINT START",
      packet:PACKET.printStart,
      ack:0x02
    },

    {
      name:"5. PAGE START",
      packet:PACKET.pageStart,
      ack:0x04
    }

  ];


  for(
    const step
    of basic
  ){

    rows.push({

      name:step.name,

      text:
      "等待回應…",

      type:"wait"

    });


    renderSteps(rows);


    output.push(
      `\n=== ${step.name} ===`
    );


    output.push(
      "TX：" +
      hex(step.packet)
    );


    const result =
    await sendWait(
      step.packet,
      step.ack
    );


    const row =
    rows[
      rows.length - 1
    ];


    if(result.ok){

      row.type =
      "ok";


      row.text =
      `✅ CMD ${hx(result.packet.command)} / DATA ${payloadText(result.packet.payload)}`;


      output.push(
        row.text
      );

    }

    else{

      row.type =
      "err";


      row.text =
      result.unsupported
      ?
      "❌ CMD 00 NOT_SUPPORTED"
      :
      "❌ 等待 ACK 逾時";


      output.push(
        row.text
      );


      renderSteps(rows);


      return false;

    }


    renderSteps(rows);


    await delay(
      150
    );

  }


  return true;

}


async function cleanup(){

  try{

    await write(
      PACKET.printEnd
    );


    await delay(
      300
    );

  }

  catch{}

}


/* 單一格式測試 */

async function testFormat(
  type
){

  $("autoTestBtn").disabled =
  true;


  $("d110Btn").disabled =
  true;


  $("d11Btn").disabled =
  true;


  const rows =
  [];


  const output =
  [];


  $("result").value =
  "";


  $("testStatus")
  .className =
  "status warn";


  $("testStatus")
  .textContent =
  "V10 測試進行中…";


  const basicOk =
  await runBasicStart(
    rows,
    output
  );


  if(!basicOk){

    $("testStatus")
    .className =
    "status err";


    $("testStatus")
    .textContent =
    "前置流程失敗";


    $("result").value =
    output.join("\n");


    await cleanup();


    enable(true);

    return null;

  }


  const isD110 =
  type === "d110";


  const sizePacket =
  isD110
  ?
  PACKET.pageSizeD110
  :
  PACKET.pageSizeD11;


  rows.push({

    name:
    isD110
    ?
    "6. SET PAGE SIZE：D110 高度＋寬度"
    :
    "6. SET PAGE SIZE：D11 只有高度",

    text:
    "等待 CMD 14…",

    type:"wait"

  });


  renderSteps(rows);


  output.push(
    "\n=== SET PAGE SIZE ==="
  );


  output.push(
    "格式：" +
    (
      isD110
      ?
      "D110 = HEIGHT + WIDTH"
      :
      "D11_V1 = HEIGHT ONLY"
    )
  );


  output.push(
    "TX：" +
    hex(sizePacket)
  );


  const sizeResult =
  await sendWait(
    sizePacket,
    0x14,
    3000
  );


  let row =
  rows[
    rows.length-1
  ];


  if(!sizeResult.ok){

    row.type =
    "err";


    row.text =
    sizeResult.unsupported
    ?
    "❌ CMD 00 NOT_SUPPORTED"
    :
    "❌ SET PAGE SIZE timeout";


    output.push(
      row.text
    );


    renderSteps(rows);


    $("testStatus")
    .className =
    "status warn";


    $("testStatus")
    .textContent =
    "此頁面格式不相容";


    $("result").value =
    output.join("\n");


    await cleanup();


    enable(true);


    return {

      format:type,

      success:false

    };

  }


  row.type =
  "ok";


  row.text =
  `✅ CMD 14 / DATA ${payloadText(sizeResult.packet.payload)}`;


  output.push(
    row.text
  );


  renderSteps(rows);


  /* quantity */


  rows.push({

    name:
    "7. PRINT QUANTITY = 1",

    text:
    "等待 CMD 16…",

    type:"wait"

  });


  renderSteps(rows);


  output.push(
    "\n=== PRINT QUANTITY ==="
  );


  output.push(
    "TX：" +
    hex(PACKET.quantity)
  );


  const qtyResult =
  await sendWait(
    PACKET.quantity,
    0x16
  );


  row =
  rows[
    rows.length-1
  ];


  if(qtyResult.ok){

    row.type =
    "ok";


    row.text =
    `✅ CMD 16 / DATA ${payloadText(qtyResult.packet.payload)}`;


    output.push(
      row.text
    );


    $("testStatus")
    .className =
    "status ok";


    $("testStatus")
    .textContent =
    (
      isD110
      ?
      "✅ B3S 使用 D110 頁面大小格式"
      :
      "✅ B3S 使用 D11_V1 頁面大小格式"
    );


    output.push(
      "\n✅ V10 判定："
      +
      (
        isD110
        ?
        "D110 HEIGHT + WIDTH 可用"
        :
        "D11_V1 HEIGHT ONLY 可用"
      )
    );

  }

  else{

    row.type =
    "err";


    row.text =
    qtyResult.unsupported
    ?
    "❌ PRINT QUANTITY 回 CMD 00"
    :
    "❌ PRINT QUANTITY timeout";


    output.push(
      row.text
    );


    $("testStatus")
    .className =
    "status warn";


    $("testStatus")
    .textContent =
    "PAGE SIZE 成功，但 PRINT QUANTITY 不相容";

  }


  renderSteps(rows);


  $("result").value =
  output.join("\n");


  await cleanup();


  enable(true);


  return {

    format:type,

    success:
    sizeResult.ok &&
    qtyResult.ok

  };

}


$("d110Btn").onclick =
() =>
testFormat(
  "d110"
);


$("d11Btn").onclick =
() =>
testFormat(
  "d11"
);


/* 自動測試 */

$("autoTestBtn").onclick =
async () => {

  $("testStatus")
  .className =
  "status warn";


  $("testStatus")
  .textContent =
  "先測 D110 高度＋寬度…";


  const first =
  await testFormat(
    "d110"
  );


  if(
    first?.success
  ){

    return;

  }


  await delay(
    700
  );


  $("testStatus")
  .className =
  "status warn";


  $("testStatus")
  .textContent =
  "D110 不相容，改測 D11 只有高度…";


  const second =
  await testFormat(
    "d11"
  );


  if(
    second?.success
  ){

    return;

  }


  $("testStatus")
  .className =
  "status err";


  $("testStatus")
  .textContent =
  "兩種已知頁面格式都沒有完整通過";

};


$("clearBtn").onclick =
() => {

  $("steps")
  .innerHTML =
  "";


  $("result")
  .value =
  "";


  $("testStatus")
  .className =
  "status";


  $("testStatus")
  .textContent =
  "尚未測試";

};


$("clearLogBtn").onclick =
() => {

  $("log").value =
  "";

};


$("copyBtn").onclick =
async () => {

  try{

    await navigator.clipboard
    .writeText(
      $("log").value
    );


    alert(
      "已複製"
    );

  }

  catch{

    $("log").select();

  }

};


enable(false);

</script>

</body>
</html>
