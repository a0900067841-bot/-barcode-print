<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B3S V19.8 高度診斷</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f4f6f8;
  color:#18202a;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif
}
.wrap{max-width:850px;margin:auto;padding:14px}
.card{
  background:#fff;
  border:1px solid #d8dee8;
  border-radius:16px;
  padding:15px;
  margin-bottom:14px
}
h1{font-size:24px;margin:0 0 5px}
h2{font-size:19px;margin:0 0 10px}
.help{font-size:13px;color:#667085;line-height:1.6}
.status{
  padding:10px;
  border-radius:10px;
  background:#f2f4f7;
  margin-top:10px;
  line-height:1.5
}
.ok{background:#ecfdf3;color:#067647}
.warn{background:#fff8e6;color:#8a5a00}
.err{background:#fff1f0;color:#d92d20}
button{
  min-height:48px;
  border:0;
  border-radius:11px;
  padding:10px 14px;
  margin:4px;
  font-size:15px;
  font-weight:700
}
button:disabled{opacity:.4}
.primary{background:#1265f3;color:#fff}
.success{background:#e7f8ef;color:#087443}
.orange{background:#fff2d6;color:#9a5b00}
.purple{background:#eee8ff;color:#5b37b7}
.danger{background:#d92d20;color:#fff}
.gray{background:#e9edf3;color:#344054}
.row{display:flex;flex-wrap:wrap;gap:6px}
textarea{
  width:100%;
  min-height:280px;
  resize:vertical;
  border:1px solid #ccd3dd;
  border-radius:10px;
  padding:10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px
}
.preview{
  background:#e7e9ed;
  padding:12px;
  border-radius:12px;
  overflow:auto
}
.page{
  display:inline-block;
  background:#fff;
  box-shadow:0 1px 4px #999
}
canvas{
  display:block;
  max-width:100%;
  height:auto
}
</style>
</head>

<body>
<div class="wrap">

<h1>B3S V19.8 高度診斷</h1>
<div class="help">
固定：8｜72mm寬｜黑標2｜濃度1｜PAGE END → 500ms → PRINT END
</div>

<div class="card">
<h2>🖨 B3S</h2>

<div id="bleStatus" class="status">尚未連線</div>

<div class="row">
<button id="connectBtn" class="success">🔵 連接 B3S</button>
<button id="disconnectBtn" class="gray" disabled>中斷</button>
</div>

<div class="help" style="margin-top:8px">
裝置：<span id="deviceName">—</span><br>
GATT：<span id="gattState">false</span>
</div>
</div>


<div class="card">
<h2>高度測試</h2>

<div class="row">
<button id="test148" class="orange" disabled>148 mm</button>
<button id="test140" class="purple" disabled>140 mm</button>
<button id="test130" class="primary" disabled>130 mm</button>
</div>

<div id="testStatus" class="status">
等待測試
</div>

<div class="help" style="margin-top:10px">
每次只測一個高度。<br>
不用看畫質，只記錄：<b>出 1 張或 2 張</b>。<br>
可以繼續使用同一張廢紙。
</div>
</div>


<div class="card">
<h2>預覽</h2>
<div id="preview" class="preview"></div>
</div>


<div class="card">
<h2>通訊紀錄</h2>

<div class="row">
<button id="copyLogBtn" class="gray">複製紀錄</button>
<button id="clearLogBtn" class="gray">清除</button>
</div>

<textarea id="log" readonly></textarea>
</div>

</div>

<script>

const $=id=>document.getElementById(id);

function delay(ms){
  return new Promise(r=>setTimeout(r,ms));
}

function errorText(e){
  return e?.message||String(e||"未知錯誤");
}

function mmToDots(mm){
  return Math.round(Number(mm)*203/25.4);
}

function paperDots(mm){
  return Math.floor(mmToDots(mm)/8)*8;
}

function u16(v){
  return [(v>>8)&255,v&255];
}

function hex(bytes){
  return Array.from(bytes)
    .map(v=>v.toString(16).padStart(2,"0").toUpperCase())
    .join(" ");
}

function log(text){
  const box=$("log");
  box.value+=`[${new Date().toLocaleTimeString()}] ${text}\n`;
  box.scrollTop=box.scrollHeight;
}


/* BLE */

const SERVICE=
"49535343-fe7d-4ae5-8fa9-9fafd205e455";

const WRITE_UUID=
"49535343-8841-43f4-a8d4-ecbe34729bb3";

const NOTIFY_UUID=
"49535343-1e4d-4bd9-ba61-23c647249616";

const state={
  device:null,
  server:null,
  write:null,
  notify:null,
  rx:[],
  running:false
};

function connected(){
  return !!(
    state.server?.connected &&
    state.write &&
    state.notify
  );
}

function updateButtons(){
  const ready=connected()&&!state.running;

  $("disconnectBtn").disabled=!connected();
  $("test148").disabled=!ready;
  $("test140").disabled=!ready;
  $("test130").disabled=!ready;

  $("gattState").textContent=
  String(!!state.server?.connected);
}


/* PACKET */

function frame(command,data=[1],prefix=false){

  const payload=Array.from(data);

  let checksum=
  command^payload.length;

  for(const b of payload){
    checksum^=b;
  }

  const packet=[
    0x55,0x55,
    command,
    payload.length,
    ...payload,
    checksum&255,
    0xAA,0xAA
  ];

  if(prefix){
    packet.unshift(0x03);
  }

  return new Uint8Array(packet);
}

const CMD={
  connect:()=>frame(0xC1,[1],true),
  density:v=>frame(0x21,[v]),
  labelType:v=>frame(0x23,[v]),
  printStart:()=>frame(0x01,[1]),
  pageStart:()=>frame(0x03,[1]),
  pageSize:(h,w)=>frame(0x13,[...u16(h),...u16(w)]),
  pageEnd:()=>frame(0xE3,[1]),
  printEnd:()=>frame(0xF3,[1])
};


/* RX */

function parsePackets(text){

  const bytes=
  String(text||"")
  .trim()
  .split(/\s+/)
  .filter(Boolean)
  .map(v=>parseInt(v,16));

  const result=[];
  let pos=0;

  while(pos<bytes.length){

    if(
      bytes[pos]!==0x55 ||
      bytes[pos+1]!==0x55
    ){
      pos++;
      continue;
    }

    const command=bytes[pos+2];
    const length=bytes[pos+3];
    const checksumIndex=pos+4+length;
    const tail=checksumIndex+1;

    if(tail+1>=bytes.length){
      break;
    }

    if(
      bytes[tail]!==0xAA ||
      bytes[tail+1]!==0xAA
    ){
      pos++;
      continue;
    }

    let checksum=command^length;

    for(let i=0;i<length;i++){
      checksum^=bytes[pos+4+i];
    }

    if(
      (checksum&255)!==
      bytes[checksumIndex]
    ){
      pos++;
      continue;
    }

    result.push({
      command,
      payload:bytes.slice(
        pos+4,
        pos+4+length
      )
    });

    pos=tail+2;
  }

  return result;
}


/* WRITE */

async function rawGattWrite(bytes){

  if(
    state.write.properties.writeWithoutResponse &&
    state.write.writeValueWithoutResponse
  ){
    await state.write.writeValueWithoutResponse(bytes);
  }
  else if(
    state.write.writeValueWithResponse
  ){
    await state.write.writeValueWithResponse(bytes);
  }
  else{
    await state.write.writeValue(bytes);
  }
}

async function writeRaw(bytes){

  for(let i=0;i<bytes.length;i+=20){

    await rawGattWrite(
      bytes.slice(i,i+20)
    );

    await delay(2);
  }
}

async function sendWait(
  name,
  packet,
  expected,
  timeout=5000
){

  const startIndex=state.rx.length;

  log(`${name} → ${hex(packet)}`);

  await rawGattWrite(packet);

  const start=Date.now();

  while(Date.now()-start<timeout){

    const incoming=
    state.rx.slice(startIndex);

    for(const raw of incoming){

      for(const parsed of parsePackets(raw)){

        if(parsed.command===expected){

          log(
            `${name} ACK ✅ 0x${expected.toString(16).toUpperCase()}`
          );

          return true;
        }
      }
    }

    await delay(25);
  }

  log(`${name} ACK ❌ TIMEOUT`);
  return false;
}


/* CANVAS */

function buildCanvas(heightMm){

  const width=paperDots(72);
  const height=mmToDots(heightMm);

  const canvas=document.createElement("canvas");

  canvas.width=width;
  canvas.height=height;

  const ctx=canvas.getContext("2d");

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,width,height);

  ctx.fillStyle="#000";

  const margin=mmToDots(7);

  let low=20;
  let high=1000;
  let best=20;

  while(low<=high){

    const mid=Math.floor((low+high)/2);

    ctx.font=
    `700 ${mid}px Arial,"PingFang TC",sans-serif`;

    const m=ctx.measureText("8");

    const textHeight=
    (m.actualBoundingBoxAscent||mid*.8)+
    (m.actualBoundingBoxDescent||mid*.2);

    if(
      m.width<=width-margin*2 &&
      textHeight<=height-margin*2
    ){
      best=mid;
      low=mid+1;
    }else{
      high=mid-1;
    }
  }

  ctx.font=
  `700 ${best}px Arial,"PingFang TC",sans-serif`;

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    "8",
    width/2,
    height/2
  );

  return canvas;
}


/* RASTER */

function canvasRows(canvas){

  const ctx=canvas.getContext("2d");

  const data=
  ctx.getImageData(
    0,0,
    canvas.width,
    canvas.height
  ).data;

  const rows=[];

  for(let y=0;y<canvas.height;y++){

    const row=
    new Uint8Array(canvas.width/8);

    let black=0;

    for(let x=0;x<canvas.width;x++){

      const i=
      (y*canvas.width+x)*4;

      const gray=
      (
        data[i]*299+
        data[i+1]*587+
        data[i+2]*114
      )/1000;

      if(gray<170){

        row[x>>3]|=
        0x80>>(x&7);

        black++;
      }
    }

    rows.push({
      row:y,
      data:row,
      black
    });
  }

  return rows;
}

function sameRow(a,b){

  if(a.length!==b.length){
    return false;
  }

  for(let i=0;i<a.length;i++){
    if(a[i]!==b[i]){
      return false;
    }
  }

  return true;
}

function toRuns(canvas){

  const rows=canvasRows(canvas);

  const runs=[];
  let y=0;

  while(y<rows.length){

    const current=rows[y];

    if(current.black===0){

      let repeat=1;

      while(
        y+repeat<rows.length &&
        repeat<40 &&
        rows[y+repeat].black===0
      ){
        repeat++;
      }

      runs.push({
        row:y,
        repeat,
        data:current.data,
        black:0
      });

      y+=repeat;
      continue;
    }

    let repeat=1;

    while(
      y+repeat<rows.length &&
      repeat<2 &&
      rows[y+repeat].black>0 &&
      sameRow(
        current.data,
        rows[y+repeat].data
      )
    ){
      repeat++;
    }

    runs.push({
      row:y,
      repeat,
      data:current.data,
      black:current.black
    });

    y+=repeat;
  }

  return runs;
}

function rowPacket(run){

  return frame(
    0x85,
    [
      ...u16(run.row),
      0,
      run.black&255,
      (run.black>>8)&255,
      run.repeat,
      ...run.data
    ]
  );
}


/* PRINT */

async function preparePrint(){

  if(
    !await sendWait(
      "CONNECT",
      CMD.connect(),
      0xC2
    )
  ){
    throw new Error("CONNECT 失敗");
  }

  if(
    !await sendWait(
      "DENSITY 1",
      CMD.density(1),
      0x31
    )
  ){
    throw new Error("DENSITY 失敗");
  }

  if(
    !await sendWait(
      "LABEL TYPE 2",
      CMD.labelType(2),
      0x33
    )
  ){
    throw new Error("LABEL TYPE 失敗");
  }

  if(
    !await sendWait(
      "PRINT START",
      CMD.printStart(),
      0x02
    )
  ){
    throw new Error("PRINT START 失敗");
  }

  if(
    !await sendWait(
      "PAGE START",
      CMD.pageStart(),
      0x04
    )
  ){
    throw new Error("PAGE START 失敗");
  }
}


async function sendBitmap(canvas){

  if(
    !await sendWait(
      "PAGE SIZE",
      CMD.pageSize(
        canvas.height,
        canvas.width
      ),
      0x14
    )
  ){
    throw new Error("PAGE SIZE 失敗");
  }

  const runs=toRuns(canvas);

  log(
    `CANVAS ${canvas.width}×${canvas.height}`
  );

  log(
    `RUNS ${runs.length}`
  );

  for(let i=0;i<runs.length;i++){

    await writeRaw(
      rowPacket(runs[i])
    );

    if(runs[i].black>0){
      await delay(4);
    }

    if((i+1)%24===0){
      await delay(18);
    }
  }

  log("BITMAP DATA ✅");
}


async function runHeightTest(heightMm){

  if(!connected())return;

  state.running=true;
  updateButtons();

  const status=$("testStatus");

  status.className="status warn";
  status.textContent=
  `正在測試 ${heightMm} mm…`;

  try{

    const canvas=
    buildCanvas(heightMm);

    log("");
    log(
      `========== HEIGHT ${heightMm}mm START ==========`
    );

    await preparePrint();

    await sendBitmap(canvas);

    if(
      !await sendWait(
        "PAGE END",
        CMD.pageEnd(),
        0xE4,
        20000
      )
    ){
      throw new Error(
        "PAGE END 沒有 ACK"
      );
    }

    await delay(500);

    if(
      !await sendWait(
        "PRINT END",
        CMD.printEnd(),
        0xF4,
        12000
      )
    ){
      throw new Error(
        "PRINT END 沒有 ACK"
      );
    }

    status.className="status ok";
    status.textContent=
    `✅ ${heightMm} mm 完成｜只記錄出幾張`;

    log(
      `========== HEIGHT ${heightMm}mm COMPLETE ==========`
    );

  }

  catch(error){

    const message=
    errorText(error);

    status.className="status err";
    status.textContent=
    "❌ "+message;

    log(
      `HEIGHT ${heightMm} ERROR：${message}`
    );
  }

  finally{

    state.running=false;
    updateButtons();
  }
}


/* BUTTONS */

$("test148").onclick=
()=>runHeightTest(148);

$("test140").onclick=
()=>runHeightTest(140);

$("test130").onclick=
()=>runHeightTest(130);


/* CONNECT */

$("connectBtn").onclick=
async()=>{

  try{

    $("bleStatus").className=
    "status warn";

    $("bleStatus").textContent=
    "正在連線…";

    const device=
    await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:[SERVICE]
    });

    state.device=device;

    $("deviceName").textContent=
    device.name||"—";

    state.server=
    await device.gatt.connect();

    const service=
    await state.server.getPrimaryService(
      SERVICE
    );

    state.write=
    await service.getCharacteristic(
      WRITE_UUID
    );

    state.notify=
    await service.getCharacteristic(
      NOTIFY_UUID
    );

    state.rx=[];

    state.notify.addEventListener(
      "characteristicvaluechanged",
      event=>{

        const value=event.target.value;

        const bytes=
        new Uint8Array(
          value.buffer,
          value.byteOffset,
          value.byteLength
        );

        const text=hex(bytes);

        state.rx.push(text);

        log("RX："+text);
      }
    );

    await state.notify.startNotifications();

    state.device.addEventListener(
      "gattserverdisconnected",
      ()=>{

        state.server=null;
        state.write=null;
        state.notify=null;

        $("bleStatus").className=
        "status warn";

        $("bleStatus").textContent=
        "B3S 已中斷";

        updateButtons();
      }
    );

    $("bleStatus").className=
    "status ok";

    $("bleStatus").textContent=
    "✅ B3S 已連線";

    updateButtons();

  }

  catch(error){

    const message=
    errorText(error);

    $("bleStatus").className=
    "status err";

    $("bleStatus").textContent=
    "❌ "+message;

    log(
      "CONNECT ERROR："+message
    );

    updateButtons();
  }
};


$("disconnectBtn").onclick=
()=>{

  try{
    state.device?.gatt?.disconnect();
  }catch{}

  state.server=null;
  state.write=null;
  state.notify=null;

  $("bleStatus").className="status";
  $("bleStatus").textContent="已中斷";

  updateButtons();
};


/* LOG */

$("copyLogBtn").onclick=
async()=>{

  try{

    await navigator.clipboard.writeText(
      $("log").value
    );

    alert("已複製");

  }catch{

    $("log").select();
  }
};

$("clearLogBtn").onclick=
()=>{

  $("log").value="";
};


/* PREVIEW */

function renderPreview(){

  const box=$("preview");
  box.innerHTML="";

  const holder=document.createElement("div");
  holder.className="page";

  holder.appendChild(
    buildCanvas(148)
  );

  box.appendChild(holder);
}

renderPreview();
updateButtons();

</script>

</body>
</html>
