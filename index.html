<style>

body{

<script>

const $ = id => document.getElementById(id);


/* =========================
   BLE
========================= */

const SERVICE =
"49535343-fe7d-4ae5-8fa9-9fafd205e455";

const WRITE_UUID =
"49535343-8841-43f4-a8d4-ecbe34729bb3";

const NOTIFY_UUID =
"49535343-1e4d-4bd9-ba61-23c647249616";


const state = {

  items:[],

  device:null,

  server:null,

  write:null,

  notify:null,

  rx:[],

  printing:false,

  needsReconnect:false,

  stopRequested:false

};


/* =========================
   工具
========================= */

function delay(ms){

  return new Promise(
    resolve =>
    setTimeout(resolve,ms)
  );

}


function mmToPx(mm){

  return Math.round(
    mm * 203 / 25.4
  );

}


function paperDots(mm){

  return Math.max(
    8,
    Math.floor(
      mmToPx(mm) / 8
    ) * 8
  );

}


function hex(bytes){

  return Array
  .from(bytes)
  .map(
    value =>
    value
    .toString(16)
    .padStart(2,"0")
    .toUpperCase()
  )
  .join(" ");

}


function u16(value){

  return [
    (value >> 8) & 255,
    value & 255
  ];

}


function log(text){

  const box = $("log");

  box.value +=
  `[${new Date().toLocaleTimeString()}] ${text}\n`;

  box.scrollTop =
  box.scrollHeight;

}


function escapeHtml(text){

  return String(text ?? "")
  .replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char])
  );

}


/* =========================
   NIIMBOT
========================= */

function frame(
  command,
  data=[1],
  connectPrefix=false
){

  const payload =
  Array.from(data);


  let checksum =
  command ^
  payload.length;


  for(const value of payload){

    checksum ^=
    value;

  }


  const packet = [

    0x55,
    0x55,

    command,

    payload.length,

    ...payload,

    checksum & 255,

    0xAA,
    0xAA

  ];


  if(connectPrefix){

    packet.unshift(
      0x03
    );

  }


  return new Uint8Array(
    packet
  );

}


const CONTROL = {

  connect:
  () =>
  frame(
    0xC1,
    [1],
    true
  ),


  density:
  value =>
  frame(
    0x21,
    [value]
  ),


  label:
  () =>
  frame(
    0x23,
    [1]
  ),


  printStart:
  () =>
  frame(
    0x01
  ),


  pageStart:
  () =>
  frame(
    0x03
  ),


  pageSize:
  (height,width) =>
  frame(
    0x13,
    [
      ...u16(height),
      ...u16(width)
    ]
  ),


  pageEnd:
  () =>
  frame(
    0xE3
  ),


  printEnd:
  () =>
  frame(
    0xF3
  )

};


/* =========================
   RX
========================= */

function parsePackets(text){

  const bytes =
  String(text || "")
  .trim()
  .split(/\s+/)
  .filter(Boolean)
  .map(
    value =>
    parseInt(value,16)
  );


  const output = [];

  let position = 0;


  while(position < bytes.length){

    if(
      bytes[position] !== 0x55
      ||
      bytes[position+1] !== 0x55
    ){

      position++;

      continue;

    }


    const command =
    bytes[position+2];


    const length =
    bytes[position+3];


    const checksumIndex =
    position +
    4 +
    length;


    const tail =
    checksumIndex +
    1;


    if(
      tail + 1 >= bytes.length
    ){

      break;

    }


    if(
      bytes[tail] !== 0xAA
      ||
      bytes[tail+1] !== 0xAA
    ){

      position++;

      continue;

    }


    const payload =
    bytes.slice(
      position+4,
      position+4+length
    );


    let checksum =
    command ^
    length;


    for(const value of payload){

      checksum ^=
      value;

    }


    output.push({

      command,

      payload,

      checksumOk:
      (checksum & 255)
      ===
      bytes[checksumIndex]

    });


    position =
    tail + 2;

  }


  return output;

}


/* =========================
   BLE TX
========================= */

async function writeRaw(bytes){

  if(!state.write){

    throw new Error(
      "B3S 尚未連線"
    );

  }


  const chunkSize = 20;


  for(
    let index=0;
    index<bytes.length;
    index+=chunkSize
  ){

    if(state.stopRequested){

      throw new Error(
        "STOP_REQUESTED"
      );

    }


    const part =
    bytes.slice(
      index,
      index+chunkSize
    );


    if(
      state.write.properties.writeWithoutResponse
      &&
      state.write.writeValueWithoutResponse
    ){

      await state.write
      .writeValueWithoutResponse(
        part
      );

    }

    else if(
      state.write.writeValueWithResponse
    ){

      await state.write
      .writeValueWithResponse(
        part
      );

    }

    else{

      await state.write
      .writeValue(
        part
      );

    }


    if(bytes.length > chunkSize){

      await delay(5);

    }

  }

}


async function writeControlRaw(bytes){

  if(!state.write){

    throw new Error(
      "B3S 尚未連線"
    );

  }


  if(
    state.write.properties.writeWithoutResponse
    &&
    state.write.writeValueWithoutResponse
  ){

    await state.write
    .writeValueWithoutResponse(bytes);

  }

  else if(
    state.write.writeValueWithResponse
  ){

    await state.write
    .writeValueWithResponse(bytes);

  }

  else{

    await state.write.writeValue(bytes);

  }

}


async function sendWait(
  packet,
  expected,
  timeout=3000
){

  const startIndex =
  state.rx.length;


  log(
    "TX：" +
    hex(packet)
  );


  await writeControlRaw(
    packet
  );


  const start =
  Date.now();


  while(
    Date.now() - start <
    timeout
  ){

    const newRx =
    state.rx.slice(
      startIndex
    );


    for(const rx of newRx){

      for(
        const parsed
        of parsePackets(rx.hex)
      ){

        if(!parsed.checksumOk){

          continue;

        }


        if(parsed.command === 0x00){

          return {
            ok:false,
            unsupported:true,
            packet:parsed
          };

        }


        if(parsed.command === expected){

          return {
            ok:true,
            packet:parsed
          };

        }

      }

    }


    await delay(35);

  }


  return {
    ok:false,
    timeout:true
  };

}


/* =========================
   條碼
========================= */

function detectFormat(code){

  if(/^\d{13}$/.test(code))
  return "EAN13";

  if(/^\d{8}$/.test(code))
  return "EAN8";

  if(/^\d{12}$/.test(code))
  return "UPC";

  return "CODE128";

}


function makeBarcode(
  code,
  maxWidth,
  height
){

  const canvas =
  document.createElement(
    "canvas"
  );


  try{

    JsBarcode(
      canvas,
      code,
      {

        format:
        detectFormat(code),

        displayValue:true,

        height,

        margin:0,

        width:2,

        fontSize:20,

        textMargin:4

      }
    );

  }

  catch{

    JsBarcode(
      canvas,
      code,
      {

        format:"CODE128",

        displayValue:true,

        height,

        margin:0,

        width:2,

        fontSize:20,

        textMargin:4

      }
    );

  }


  if(
    canvas.width <=
    maxWidth
  ){

    return canvas;

  }


  const scaled =
  document.createElement(
    "canvas"
  );


  scaled.width =
  maxWidth;


  scaled.height =
  Math.round(
    canvas.height *
    maxWidth /
    canvas.width
  );


  const ctx =
  scaled.getContext(
    "2d"
  );


  ctx.imageSmoothingEnabled =
  false;


  ctx.drawImage(
    canvas,
    0,
    0,
    scaled.width,
    scaled.height
  );


  return scaled;

}


/* =========================
   商品 UI
========================= */

function renderItems(){

  $("itemCount")
  .textContent =
  `${state.items.length} 筆商品`;


  if(!state.items.length){

    $("items").innerHTML =
    '<div class="help" style="margin-top:10px">目前沒有商品</div>';


    updateButtons();

    return;

  }


  $("items").innerHTML =
  state.items

  .map(
    (item,index) => `

    <div class="item">

      <input
      type="checkbox"
      class="itemCheck"
      data-index="${index}"
      ${item.selected ? "checked" : ""}>

      <div>

        <div class="itemName">
        ${escapeHtml(
          item.name ||
          "未命名商品"
        )}
        </div>

        <div class="itemCode">
        ${escapeHtml(item.code)}
        </div>

        <div class="itemBottom">

          <div class="qtyWrap">

            <span>份數</span>

            <input
            type="number"
            min="1"
            max="99"
            value="${item.qty}"
            class="qtyInput"
            data-index="${index}">

          </div>

          <button
          class="danger smallBtn deleteBtn"
          data-index="${index}">
          刪除
          </button>

        </div>

      </div>

    </div>

    `
  )

  .join("");


  updateButtons();

}


$("items")
.addEventListener(
  "change",
  event => {

    const index =
    Number(
      event.target.dataset.index
    );


    if(
      event.target.classList
      .contains("itemCheck")
    ){

      state.items[index]
      .selected =
      event.target.checked;

    }


    if(
      event.target.classList
      .contains("qtyInput")
    ){

      let qty =
      Number(
        event.target.value
      );


      if(
        !Number.isFinite(qty)
        ||
        qty < 1
      ){

        qty = 1;

      }


      qty =
      Math.min(
        99,
        Math.floor(qty)

/* =========================
   批次新增
========================= */

function parseBulk(){

  const text =
  $("bulkInput")
  .value
  .trim();


  if(!text){

    return {
      added:0,
      skipped:0
    };

  }


  let added = 0;

  let skipped = 0;


  for(
    const raw
    of text.split(/\r?\n/)
  ){

    const line =
    raw.trim();


    if(!line)
    continue;


    let name = "";

    let code = "";


    if(
      line.includes("\t")
    ){

      const parts =
      line.split("\t");


      name =
      (
        parts[0] || ""
      ).trim();


      code =
      (
        parts[1] || ""
      ).trim();

    }


    else if(
      line.includes(",")
    ){

      const parts =
      line.split(",");


      code =
      (
        parts.pop() || ""
      ).trim();


      name =
      parts
      .join(",")
      .trim();

    }


    else{

      const match =
      line.match(
        /^(.*?)[\s]+(\d{6,})$/
      );


      if(match){

        name =
        match[1]
        .trim();


        code =
        match[2]
        .trim();

      }

    }


    if(!code){

      skipped++;

      continue;

    }


    state.items.push({

      name,

      code,

      qty:1,

      selected:true

    });


    added++;

  }


  return {
    added,
    skipped
  };

}

function expandedItems(

){

  mode === "all"

  ?

/* =========================
   Canvas
========================= */

function buildCanvas(
  printItems
){

  const width =
  paperDots(
    Number(
      $("paperWidth").value
    )
  );


  const margin =
  mmToPx(2);


  const contentWidth =
  width -
  margin * 2;


  const barcodeHeight =
  mmToPx(
    Number(
      $("barcodeHeight").value
    )
  );


  const gap =
  mmToPx(
    Number(
      $("itemGap").value
    )
  );


  const blocks =
  printItems.map(
    item => {

      const barcode =
      makeBarcode(
        item.code,
        contentWidth,
        barcodeHeight
      );


      return {

        item,

        barcode,

        height:
        32 +
        barcode.height +
        gap

      };

    }
  );


  const footer =
  $("footerText")
  .value
  .trim();


  let height =
  mmToPx(1);


  for(
    const block
    of blocks
  ){

    height +=
    block.height;

  }


  if(footer){

    height +=
    30;

  }


  height +=
  mmToPx(1);


  const canvas =
  document.createElement(
    "canvas"
  );


  canvas.width =
  width;


  canvas.height =
  Math.max(
    16,
    height
  );


  const ctx =
  canvas.getContext(
    "2d"
  );


  ctx.fillStyle =
  "#fff";


  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.fillStyle =
  "#000";


  ctx.textAlign =
  "center";


  ctx.textBaseline =
  "top";


  let y =
  mmToPx(1);


  for(
    const block
    of blocks
  ){

    ctx.font =
    '700 21px "PingFang TC","Microsoft JhengHei",sans-serif';


    ctx.fillText(
      block.item.name || "",
      width / 2,
      y,
      contentWidth
    );


    y += 32;


    ctx.imageSmoothingEnabled =
    false;


    ctx.drawImage(
      block.barcode,
      (
        width -
        block.barcode.width
      ) / 2,
      y
    );


    y +=
    block.barcode.height +
    gap;

  }


  if(footer){

    ctx.font =
    '700 18px "PingFang TC","Microsoft JhengHei",sans-serif';


    ctx.fillText(
      footer,
      width/2,
      y,
      contentWidth
    );

  }


  return canvas;

}


/* =========================
   列印前裁掉底部白紙
========================= */

function cropCanvasForPrint(
  source
){

  const ctx =
  source.getContext(
    "2d"
  );


  const image =
  ctx.getImageData(
    0,
    0,
    source.width,
    source.height
  );


  const pixels =
  image.data;


  let lastContentRow =
  -1;


  for(
    let y=
    source.height - 1;
    y>=0;
    y--
  ){

    let found =
    false;


    for(
      let x=0;
      x<source.width;
      x++
    ){

      const index =
      (
        y *
        source.width +
        x
      ) *
      4;


      const gray =

      (
        pixels[index] * 299

        +

        pixels[index+1] * 587

        +

        pixels[index+2] * 114
      )

      /

      1000;


      if(gray < 220){

        found =
        true;

        break;

      }

    }


    if(found){

      lastContentRow =
      y;

      break;

    }

  }


  if(lastContentRow < 0){

    lastContentRow =
    7;

  }


  const extra =
  mmToPx(
    Number(
      $("endGap").value
    )
  );


  let newHeight =
  lastContentRow +
  1 +
  extra;


  /*
  最少 8 dots
  */

  newHeight =
  Math.max(
    8,
    newHeight
  );


  /*
  高度限制
  */

  if(newHeight > 65535){

    throw new Error(
      "內容太長，請分批列印"
    );

  }


  const output =
  document.createElement(
    "canvas"
  );


  output.width =
  source.width;


  output.height =
  newHeight;


  const outputCtx =
  output.getContext(
    "2d"
  );


  outputCtx.fillStyle =
  "#fff";


  outputCtx.fillRect(
    0,
    0,
    output.width,
    output.height
  );


  outputCtx.drawImage(
    source,
    0,
    0
  );


  return output;

}

/* =========================
   Canvas → 黑白點陣
========================= */

function sameRow(a,b){

  if(a.length !== b.length){

    return false;

  }


  for(
    let i=0;
    i<a.length;
    i++
  ){

    if(a[i] !== b[i]){

      return false;

    }

  }


  return true;

}


function canvasToRuns(canvas){

  const ctx =
  canvas.getContext(
    "2d"
  );


  const pixels =
  ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  ).data;


  const width =
  canvas.width;


  const height =
  canvas.height;


  const bytesPerRow =
  width / 8;


  const rows = [];


  for(
    let y=0;
    y<height;
    y++
  ){

    const row =
    new Uint8Array(
      bytesPerRow
    );


    let black = 0;


    for(
      let x=0;
      x<width;
      x++
    ){

      const index =
      (
        y *
        width +
        x
      ) *
      4;


      const gray =

      (
        pixels[index] * 299
        +
        pixels[index+1] * 587
        +
        pixels[index+2] * 114
      )
      /
      1000;


      if(gray < 170){

        row[x >> 3] |=
        0x80 >>
        (x & 7);


        black++;

      }

    }


    rows.push({
      data:row,
      black
    });

  }


  const runs = [];

  let y = 0;


  while(y < rows.length){

    const first =
    rows[y];


    let repeat =
    1;


    while(
      y + repeat <
      rows.length
      &&
      repeat <
      255
      &&
      sameRow(
        first.data,
        rows[y+repeat].data
      )
    ){

      repeat++;

    }


    runs.push({

      row:y,

      repeat,

      data:first.data,

      black:first.black

    });


    y += repeat;

  }


  return runs;

}


function rowPacket(run){

  const count = [

    0x00,

    run.black &
    0xFF,

    (
      run.black >>
      8
    ) &
    0xFF

  ];


  return frame(
    0x85,
    [

      ...u16(
        run.row
      ),

      ...count,

      run.repeat,

      ...run.data

    ]
  );

}

$("connectBtn").onclick =
async () => {

  try{

    $("bleStatus")
    .className =
    "status warn";


    $("bleStatus")
    .textContent =
    "正在連接 B3S…";


    const device =
    await navigator.bluetooth
    .requestDevice({

      acceptAllDevices:true,

      optionalServices:[
        SERVICE
      ]

    });


    state.device =
    device;


    $("deviceName")
    .textContent =
    device.name || "—";


    state.server =
    await device.gatt
    .connect();


    const service =
    await state.server
    .getPrimaryService(
      SERVICE
    );


    state.write =
    await service
    .getCharacteristic(
      WRITE_UUID
    );


    state.notify =
    await service
    .getCharacteristic(
      NOTIFY_UUID
    );


    state.rx = [];

    state.needsReconnect = false;

    state.stopRequested = false;


    state.notify
    .addEventListener(
      "characteristicvaluechanged",
      event => {

        const value =
        event.target.value;


        const bytes =
        new Uint8Array(
          value.buffer,
          value.byteOffset,
          value.byteLength
        );


        const data =
        hex(bytes);


        state.rx.push({
          hex:data
        });


        if(state.rx.length > 1000){

          state.rx.shift();

        }


        log(
          "RX：" +
          data
        );

      }
    );


    await state.notify
    .startNotifications();


    device.addEventListener(
      "gattserverdisconnected",
      () => {

        state.server = null;

        state.write = null;

        state.notify = null;

        state.printing = false;

        state.needsReconnect = false;

        state.stopRequested = false;


        $("bleStatus")
        .className =
        "status warn";


        $("bleStatus")
        .textContent =
        "已中斷";


        updateButtons();

      }
    );


    $("bleStatus")
    .className =
    "status ok";


    $("bleStatus")
    .textContent =
    "✅ B3S 已連線";


    log(
      "V14 B3S ready"
    );


    updateButtons();

  }

  catch(error){

    $("bleStatus")
    .className =
    "status err";


    $("bleStatus")
    .textContent =
    "連線失敗：" +
    error.message;


    updateButtons();

  }

};

function progress(

  text=""
){

  $("progressBar")
  .style

    Math.min(
      100,
      percent
    )
  )
  +

async function ackStep(
  label,
  packet,
  expected,
  timeout=3500
){

  if(state.stopRequested){

    throw new Error(
      "STOP_REQUESTED"
    );

  }


  $("printStatus")
  .className =
  "status warn";


  $("printStatus")
  .textContent =
  label;


  const result =
  await sendWait(
    packet,
    expected,
    timeout
  );


  if(result.ok){

    return result;

  }


  if(result.unsupported){

    throw new Error(
      `${label}：CMD 00 NOT_SUPPORTED`
    );

  }


  throw new Error(
    `${label}：等待回應逾時`
  );

}


/* =========================
   緊急／人工停止
========================= */

async function safeFinishPrint(){

  let pageOk =
  false;


  try{

    const page =
    await sendWait(
      CONTROL.pageEnd(),
      0xE4,
      3000
    );


    pageOk =
    !!page.ok;

  }catch{}


  try{

    await delay(80);


    await sendWait(
      CONTROL.printEnd(),
      0xF4,
      3000
    );

  }catch{}


  return pageOk;

}

/* =========================
   列印核心
========================= */

async function printItems(
  printList,
  sourceItems
){

  if(!printList.length){

    alert(
      "沒有可列印商品"
    );

    return;

  }


  state.printing = true;

  state.stopRequested = false;


  updateButtons();


  progress(
    0,
    "建立列印資料…"
  );


  try{

    /*
    先建立內容，
    再把最後空白自動裁掉。
    */

    const originalCanvas =
    buildCanvas(
      printList
    );


    const canvas =
    cropCanvasForPrint(
      originalCanvas
    );


    const runs =
    canvasToRuns(
      canvas
    );


    $("printMeta")
    .textContent =
    `${printList.length} 份｜${canvas.width} × ${canvas.height} dots｜已裁掉尾端白紙`;


    await ackStep(
      "CONNECT",
      CONTROL.connect(),
      0xC2
    );


    progress(5);


    await ackStep(
      "SET DENSITY",
      CONTROL.density(
        Number(
          $("density").value
        )
      ),
      0x31
    );


    progress(10);


    await ackStep(
      "SET LABEL TYPE",
      CONTROL.label(),
      0x33
    );


    progress(15);


    await ackStep(
      "PRINT START",
      CONTROL.printStart(),
      0x02
    );


    progress(20);


    await ackStep(
      "PAGE START",
      CONTROL.pageStart(),
      0x04
    );


    progress(25);


    await ackStep(
      "SET PAGE SIZE",
      CONTROL.pageSize(
        canvas.height,
        canvas.width
      ),
      0x14,
      5000
    );


    progress(
      30,
      `傳送點陣 0/${runs.length}`
    );


    for(
      let index=0;
      index<runs.length;
      index++
    ){

      if(state.stopRequested){

        throw new Error(
          "STOP_REQUESTED"
        );

      }


      await writeRaw(
        rowPacket(
          runs[index]
        )
      );


      if(
        index % 4 === 0
        ||
        index ===
        runs.length - 1
      ){

        progress(
          30
          +
          Math.round(
            (
              index + 1
            )
            /
            runs.length
            *
            55
          ),

          `傳送點陣 ${index+1}/${runs.length}`
        );


        await delay(5);

      }

    }


    /*
    最後一列傳完，
    立即 PAGE END。
    */

    progress(
      88,
      "最後一筆完成，立即停止走紙…"
    );


    await ackStep(
      "PAGE END",
      CONTROL.pageEnd(),
      0xE4,
      7000
    );


    progress(95);


    /*
    不再等 500ms。
    ACK 收到後馬上 PRINT END。
    */

    await delay(60);


    const end =
    await sendWait(
      CONTROL.printEnd(),
      0xF4,
      7000
    );


    if(!end.ok){

      throw new Error(
        "PRINT END 沒有收到 F4"
      );

    }


    progress(
      100,
      "列印完成，已停止走紙"
    );


    $("printStatus")
    .className =
    "status ok";


    $("printStatus")
    .textContent =
    "✅ B3S 列印完成並已停止";


    state.needsReconnect =
    false;


    if(
      $("autoClear").checked
    ){

      state.items =
      state.items.filter(
        item =>
        !sourceItems.includes(item)
      );


      renderItems();

      drawPreview();

    }

  }

  catch(error){

    if(
      error.message ===
      "STOP_REQUESTED"
    ){

      log(
        "使用者要求停止列印"
      );


      try{

        /*
        重置 stopRequested，
        才能發送結束封包。
        */

        state.stopRequested =
        false;


        await safeFinishPrint();


        $("printStatus")
        .className =
        "status warn";


        $("printStatus")
        .textContent =
        "⏹ 列印已停止";


        $("printMeta")
        .textContent =
        "已停止後續內容傳送。";


        state.needsReconnect =
        false;

      }

      catch{

        $("printStatus")
        .className =
        "status err";


        $("printStatus")
        .textContent =
        "停止失敗，請中斷 B3S";


        state.needsReconnect =
        true;

      }

    }

    else{

      $("printStatus")
      .className =
      "status err";


      $("printStatus")
      .textContent =
      "❌ " +
      error.message;


      $("printMeta")
      .textContent =
      "請中斷 B3S，再重新連線後重試。";


      log(
        "PRINT ERROR：" +
        error.message
      );


      state.needsReconnect =
      true;

    }

  }

  finally{

    state.printing =
    false;


    state.stopRequested =
    false;


    updateButtons();

  }

}

let scanner =
null;


let scanning =
false;


let scannerMode =
"single";


let bulkScanCount =
0;


let lastScanCode =
"";


let lastScanTime =
0;


async function openScanner(
  mode
){

  scannerMode =
  mode;


  bulkScanCount =
  0;


  lastScanCode =
  "";


  lastScanTime =
  0;


  $("scannerModal")
  .style.display =
  "block";


  if(mode === "bulk"){

    $("scannerTitle")
    .textContent =
    "批次連續掃描";


    $("bulkScanNameArea")
    .style.display =
    "block";


    $("bulkScanCounter")
    .textContent =
    "已掃描 0 筆";


    $("bulkScanName").value =
    "";

  }

  else{

    $("scannerTitle")
    .textContent =
    "掃描商品條碼";


    $("bulkScanNameArea")
    .style.display =
    "none";


    $("bulkScanCounter")
    .textContent =
    "";

  }


  $("scannerStatus")
  .className =
  "status";


  $("scannerStatus")
  .textContent =
  "正在啟動相機…";


  try{

    scanner =
    new Html5Qrcode(
      "qrReader"
    );


    await scanner.start(

      {
        facingMode:
        "environment"
      },

      {
        fps:12,

        qrbox:
        (width,height) => ({

          width:
          Math.floor(
            width * 0.88
          ),

          height:
          Math.min(
            150,
            Math.floor(
              height * 0.3
            )
          )

        })
      },

      decoded => {

        handleScan(
          decoded
        );

      },

      () => {}

    );


    scanning =
    true;


    $("scannerStatus")
    .className =
    "status ok";


    $("scannerStatus")
    .textContent =
    mode === "bulk"
    ?
    "請連續掃描商品條碼"
    :
    "請對準商品條碼";

  }

  catch(error){

    $("scannerStatus")
    .className =
    "status err";


    $("scannerStatus")
    .textContent =
    "相機啟動失敗：" +
    error.message;

  }

}


function handleScan(
  decoded
){

  const now =
  Date.now();


  /*
  防止同一條碼一秒內被連續讀好幾次。
  */

  if(
    decoded ===
    lastScanCode
    &&
    now -
    lastScanTime <
    1500
  ){

    return;

  }


  lastScanCode =
  decoded;


  lastScanTime =
  now;


  if(
    scannerMode ===
    "single"
  ){

    $("code").value =
    decoded;


    $("scannerStatus")
    .className =
    "status ok";


    $("scannerStatus")
    .textContent =
    "掃描成功：" +
    decoded;


    setTimeout(
      closeScanner,
      350
    );


    return;

  }


  /*
  批次模式：
  商品名稱,條碼
  */

  const name =
  $("bulkScanName")
  .value
  .trim();


  const line =
  `${name},${decoded}`;


  const current =
  $("bulkInput")
  .value
  .trim();


  $("bulkInput")
  .value =
  current
  ?
  current +
  "\n" +
  line
  :
  line;


  bulkScanCount++;


  $("bulkScanCounter")
  .textContent =
  `已掃描 ${bulkScanCount} 筆`;


  $("scannerStatus")
  .className =
  "status ok";


  $("scannerStatus")
  .textContent =
  `已加入：${decoded}`;


  /*
  掃完一筆把名稱清空，
  可以直接輸入下一個商品名稱。
  */

  $("bulkScanName").value =
  "";


  $("bulkScanName")
  .focus();


  $("bulkStatus")
  .textContent =
  `批次相機已掃描 ${bulkScanCount} 筆，關閉相機後按「加入全部」即可。`;

}


async function closeScanner(){

  try{

    if(
      scanner &&
      scanning
    ){

      await scanner.stop();

    }

  }catch{}


  try{

    if(scanner){

      await scanner.clear();

    }

  }catch{}


  scanner =
  null;


  scanning =
  false;


  $("scannerModal")
  .style.display =
  "none";

}


$("scanBtn").onclick =
() => {

  openScanner(
    "single"
  );

};


$("bulkScanBtn").onclick =
() => {

  openScanner(
    "bulk"
  );

};


$("closeScannerBtn").onclick =
closeScanner;


/* =========================
   Log
========================= */

$("clearLogBtn").onclick =
() => {

  $("log").value =
  "";

};


$("copyLogBtn").onclick =
async () => {

  try{

    await navigator.clipboard
    .writeText(
      $("log").value
    );


    alert(
      "已複製"
    );

  }

  catch{

    $("log").select();

  }

};


/* =========================
   初始化
========================= */

renderItems();

drawPreview();

updateButtons();

progress(0);

</script>

</body>
</html>
