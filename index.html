<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>B3S 黑標單張診斷 V18.7</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f4f6f8;
  color:#18202a;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif
}

.wrap{
  max-width:720px;
  margin:auto;
  padding:16px
}

.card{
  background:#fff;
  border:1px solid #d8dee8;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px
}

h1{
  font-size:26px;
  margin:0 0 5px
}

h2{
  margin:0 0 12px
}

.help{
  color:#667085;
  font-size:14px;
  line-height:1.6
}

button{
  min-height:48px;
  border:0;
  border-radius:11px;
  padding:10px 16px;
  font-size:16px;
  font-weight:700;
  margin:4px
}

.connect{
  background:#e7f8ef;
  color:#087443
}

.test{
  background:#1265f3;
  color:#fff
}

.danger{
  background:#d92d20;
  color:#fff
}

button:disabled{
  opacity:.4
}

.status{
  padding:12px;
  border-radius:10px;
  background:#f2f4f7;
  margin-top:10px
}

.ok{
  background:#ecfdf3;
  color:#067647
}

.warn{
  background:#fff8e6;
  color:#8a5a00
}

.err{
  background:#fff1f0;
  color:#d92d20
}

textarea{
  width:100%;
  min-height:250px;
  border:1px solid #d8dee8;
  border-radius:10px;
  padding:10px;
  font-size:13px
}

.preview{
  background:#e8eaed;
  padding:10px;
  border-radius:12px;
  overflow:auto
}

canvas{
  display:block;
  margin:auto;
  max-width:100%;
  height:auto;
  background:white
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}
</style>
</head>

<body>

<div class="wrap">

<h1>B3S 黑標單張診斷</h1>

<div class="help">
V18.7 Diagnostic<br>
只測一張 75 × 148 mm 黑標紙，不做批次。
</div>


<div class="card">

<h2>測試內容</h2>

<div class="help">
這次固定印：
<br>
① 上方一條黑線
<br>
② 中央一個大字「1」
<br>
③ 下方一條黑線
</div>

<div class="preview" style="margin-top:12px">
<canvas id="preview"></canvas>
</div>

</div>


<div class="card">

<h2>B3S</h2>

<div id="bleStatus" class="status">
尚未連線
</div>

<div class="row">

<button id="connectBtn" class="connect">
🔵 連接 B3S
</button>

<button id="disconnectBtn" disabled>
中斷
</button>

</div>

<div class="help" style="margin-top:10px">

裝置：
<span id="deviceName">—</span>

<br>

GATT：
<span id="gattState">false</span>

<br>

通道：
<span id="channelState">未就緒</span>

</div>

</div>


<div class="card">

<h2>診斷測試</h2>

<button id="testBtn" class="test" disabled>
🧪 單張黑標測試
</button>

<button id="stopBtn" class="danger" disabled>
⏹ 停止
</button>

<div id="testStatus" class="status">
等待測試
</div>

<div class="help" style="margin-top:10px">
固定設定：75 mm × 148 mm｜黑標紙｜濃度 2
</div>

</div>


<div class="card">

<h2>通訊紀錄</h2>

<div class="row">

<button id="copyBtn">
複製紀錄
</button>

<button id="clearBtn">
清除
</button>

</div>

<textarea id="log" readonly></textarea>

</div>

</div>


<script>

const $=
id=>
document.getElementById(id);


/* =========================
BLE UUID
========================= */

const SERVICE=
"49535343-fe7d-4ae5-8fa9-9fafd205e455";

const WRITE_UUID=
"49535343-8841-43f4-a8d4-ecbe34729bb3";

const NOTIFY_UUID=
"49535343-1e4d-4bd9-ba61-23c647249616";


const state={

  device:null,
  server:null,
  write:null,
  notify:null,

  rx:[],

  running:false,
  stop:false

};


/* =========================
UTIL
========================= */

function delay(ms){

  return new Promise(
    resolve=>
    setTimeout(resolve,ms)
  );

}


function mmToDots(mm){

  return Math.round(
    mm*203/25.4
  );

}


function paperDots(mm){

  return Math.floor(
    mmToDots(mm)/8
  )*8;

}


function u16(value){

  return[
    (value>>8)&255,
    value&255
  ];

}


function hex(bytes){

  return Array.from(bytes)
  .map(
    v=>
    v.toString(16)
    .padStart(2,"0")
    .toUpperCase()
  )
  .join(" ");

}


function log(text){

  const box=
  $("log");


  box.value+=
  `[${new Date().toLocaleTimeString()}] ${text}\n`;


  box.scrollTop=
  box.scrollHeight;

}


function errorText(error){

  if(error?.message){
    return error.message;
  }

  if(typeof error==="string"){
    return error;
  }

  return String(error||"未知錯誤");

}


/* =========================
PACKET
========================= */

function frame(
  command,
  data=[1],
  prefix=false
){

  const payload=
  Array.from(data);


  let checksum=
  command^payload.length;


  for(const value of payload){

    checksum^=
    value;

  }


  const packet=[

    0x55,
    0x55,

    command,

    payload.length,

    ...payload,

    checksum&255,

    0xAA,
    0xAA

  ];


  if(prefix){

    packet.unshift(
      0x03
    );

  }


  return new Uint8Array(
    packet
  );

}


const CONTROL={

  connect:
  ()=>frame(
    0xC1,
    [1],
    true
  ),

  density:
  value=>frame(
    0x21,
    [value]
  ),

  labelType:
  value=>frame(
    0x23,
    [value]
  ),

  printStart:
  ()=>frame(
    0x01,
    [1]
  ),

  pageStart:
  ()=>frame(
    0x03,
    [1]
  ),

  pageSize:
  (height,width)=>frame(
    0x13,
    [
      ...u16(height),
      ...u16(width)
    ]
  ),

  pageEnd:
  ()=>frame(
    0xE3,
    [1]
  ),

  printEnd:
  ()=>frame(
    0xF3,
    [1]
  )

};


/* =========================
RX
========================= */

function parsePackets(text){

  const bytes=
  String(text||"")
  .trim()
  .split(/\s+/)
  .filter(Boolean)
  .map(
    value=>
    parseInt(value,16)
  );


  const result=[];

  let pos=0;


  while(pos<bytes.length){

    if(
      bytes[pos]!==0x55 ||
      bytes[pos+1]!==0x55
    ){

      pos++;

      continue;

    }


    const command=
    bytes[pos+2];


    const length=
    bytes[pos+3];


    const checksumIndex=
    pos+4+length;


    const tail=
    checksumIndex+1;


    if(tail+1>=bytes.length){

      break;

    }


    if(
      bytes[tail]!==0xAA ||
      bytes[tail+1]!==0xAA
    ){

      pos++;

      continue;

    }


    result.push({

      command,

      payload:
      bytes.slice(
        pos+4,
        pos+4+length
      )

    });


    pos=
    tail+2;

  }


  return result;

}


/* =========================
WRITE
========================= */

async function writeControl(bytes){

  log(
    "TX："+hex(bytes)
  );


  if(
    state.write.properties.writeWithoutResponse &&
    state.write.writeValueWithoutResponse
  ){

    await state.write
    .writeValueWithoutResponse(bytes);

  }

  else if(
    state.write.writeValueWithResponse
  ){

    await state.write
    .writeValueWithResponse(bytes);

  }

  else{

    await state.write
    .writeValue(bytes);

  }

}


async function writeRaw(bytes){

  const size=20;


  for(
    let i=0;
    i<bytes.length;
    i+=size
  ){

    if(state.stop){

      throw new Error(
        "使用者停止"
      );

    }


    const part=
    bytes.slice(
      i,
      i+size
    );


    if(
      state.write.properties.writeWithoutResponse &&
      state.write.writeValueWithoutResponse
    ){

      await state.write
      .writeValueWithoutResponse(part);

    }

    else if(
      state.write.writeValueWithResponse
    ){

      await state.write
      .writeValueWithResponse(part);

    }

    else{

      await state.write
      .writeValue(part);

    }


    await delay(5);

  }

}


/* =========================
WAIT ACK
========================= */

async function sendWait(
  name,
  packet,
  expected,
  timeout=5000
){

  const startIndex=
  state.rx.length;


  log(
    `${name} → ${hex(packet)}`
  );


  await writeControl(
    packet
  );


  const start=
  Date.now();


  while(
    Date.now()-start<
    timeout
  ){

    const incoming=
    state.rx.slice(
      startIndex
    );


    for(const raw of incoming){

      for(
        const parsed
        of parsePackets(raw)
      ){

        if(
          parsed.command===
          expected
        ){

          log(
            `${name} ACK ✅ 0x${expected.toString(16).toUpperCase()}`
          );


          return true;

        }

      }

    }


    await delay(30);

  }


  log(
    `${name} ACK ❌ TIMEOUT`
  );


  return false;

}


/* =========================
CANVAS
========================= */

function buildCanvas(){

  const width=
  paperDots(75);


  const height=
  mmToDots(148);


  const canvas=
  document.createElement(
    "canvas"
  );


  canvas.width=
  width;


  canvas.height=
  height;


  const ctx=
  canvas.getContext(
    "2d"
  );


  ctx.fillStyle=
  "#fff";


  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  /*
    上黑線
  */

  ctx.fillStyle=
  "#000";


  ctx.fillRect(
    30,
    30,
    width-60,
    8
  );


  /*
    大字 1
  */

  ctx.font=
  '900 430px Arial,"PingFang TC",sans-serif';


  ctx.textAlign=
  "center";


  ctx.textBaseline=
  "middle";


  ctx.fillText(
    "1",
    width/2,
    height/2
  );


  /*
    下黑線
  */

  ctx.fillRect(
    30,
    height-38,
    width-60,
    8
  );


  return canvas;

}


/* =========================
BITMAP
========================= */

function sameRow(a,b){

  if(a.length!==b.length){

    return false;

  }


  for(
    let i=0;
    i<a.length;
    i++
  ){

    if(a[i]!==b[i]){

      return false;

    }

  }


  return true;

}


function canvasToRuns(canvas){

  const ctx=
  canvas.getContext(
    "2d"
  );


  const data=
  ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  ).data;


  const rows=[];


  for(
    let y=0;
    y<canvas.height;
    y++
  ){

    const row=
    new Uint8Array(
      canvas.width/8
    );


    let black=0;


    for(
      let x=0;
      x<canvas.width;
      x++
    ){

      const i=
      (
        y*
        canvas.width+
        x
      )*4;


      const gray=
      (
        data[i]*299+
        data[i+1]*587+
        data[i+2]*114
      )/1000;


      if(gray<170){

        row[x>>3]|=
        0x80>>(x&7);


        black++;

      }

    }


    rows.push({

      data:row,

      black

    });

  }


  const runs=[];

  let y=0;


  while(
    y<rows.length
  ){

    const first=
    rows[y];


    let repeat=1;


    while(
      y+repeat<
      rows.length &&
      repeat<255 &&
      sameRow(
        first.data,
        rows[y+repeat].data
      )
    ){

      repeat++;

    }


    runs.push({

      row:y,

      repeat,

      data:first.data,

      black:first.black

    });


    y+=repeat;

  }


  return runs;

}


function rowPacket(run){

  return frame(
    0x85,
    [

      ...u16(run.row),

      0,

      run.black&255,

      (run.black>>8)&255,

      run.repeat,

      ...run.data

    ]
  );

}


/* =========================
PREVIEW
========================= */

function preview(){

  const source=
  buildCanvas();


  const target=
  $("preview");


  target.width=
  source.width;


  target.height=
  source.height;


  target
  .getContext("2d")
  .drawImage(
    source,
    0,
    0
  );

}


/* =========================
CONNECT
========================= */

function connected(){

  return !!(
    state.server?.connected &&
    state.write &&
    state.notify
  );

}


function updateButtons(){

  const ready=
  connected();


  $("testBtn").disabled=
  !ready ||
  state.running;


  $("disconnectBtn").disabled=
  !ready;


  $("stopBtn").disabled=
  !ready;


  $("gattState").textContent=
  String(
    !!state.server?.connected
  );


  $("channelState").textContent=
  ready
  ?
  "已就緒"
  :
  "未就緒";

}


$("connectBtn").onclick=
async()=>{

  try{

    $("bleStatus").className=
    "status warn";


    $("bleStatus").textContent=
    "正在連線…";


    const device=
    await navigator.bluetooth
    .requestDevice({

      acceptAllDevices:true,

      optionalServices:[
        SERVICE
      ]

    });


    state.device=
    device;


    $("deviceName").textContent=
    device.name||"—";


    state.server=
    await device.gatt.connect();


    const service=
    await state.server
    .getPrimaryService(
      SERVICE
    );


    state.write=
    await service
    .getCharacteristic(
      WRITE_UUID
    );


    state.notify=
    await service
    .getCharacteristic(
      NOTIFY_UUID
    );


    state.rx=[];


    state.notify
    .addEventListener(
      "characteristicvaluechanged",
      event=>{

        const value=
        event.target.value;


        const bytes=
        new Uint8Array(
          value.buffer,
          value.byteOffset,
          value.byteLength
        );


        const text=
        hex(bytes);


        state.rx.push(
          text
        );


        log(
          "RX："+text
        );

      }
    );


    await state.notify
    .startNotifications();


    $("bleStatus").className=
    "status ok";


    $("bleStatus").textContent=
    "✅ B3S 已連線";


    updateButtons();

  }

  catch(error){

    $("bleStatus").className=
    "status err";


    $("bleStatus").textContent=
    "❌ "+
    errorText(error);


    log(
      "CONNECT ERROR："+
      errorText(error)
    );

  }

};


$("disconnectBtn").onclick=
()=>{

  try{

    state.device
    ?.gatt
    ?.disconnect();

  }

  catch{}


  state.server=null;
  state.write=null;
  state.notify=null;


  $("bleStatus").className=
  "status";


  $("bleStatus").textContent=
  "已中斷";


  updateButtons();

};


/* =========================
TEST
========================= */

$("testBtn").onclick=
async()=>{

  if(!connected()){

    return;

  }


  state.running=true;

  state.stop=false;


  updateButtons();


  $("testStatus").className=
  "status warn";


  $("testStatus").textContent=
  "開始診斷…";


  try{

    const canvas=
    buildCanvas();


    const runs=
    canvasToRuns(
      canvas
    );


    log(
      `CANVAS：${canvas.width} × ${canvas.height}`
    );


    log(
      `ROWS/RUNS：${runs.length}`
    );


    /*
      1 CONNECT
    */

    if(
      !await sendWait(
        "CONNECT",
        CONTROL.connect(),
        0xC2,
        5000
      )
    ){

      throw new Error(
        "CONNECT 沒有 ACK"
      );

    }


    /*
      2 濃度
    */

    if(
      !await sendWait(
        "DENSITY",
        CONTROL.density(2),
        0x31,
        5000
      )
    ){

      throw new Error(
        "DENSITY 沒有 ACK"
      );

    }


    /*
      3 黑標紙
    */

    if(
      !await sendWait(
        "BLACK MARK",
        CONTROL.labelType(2),
        0x33,
        5000
      )
    ){

      throw new Error(
        "BLACK MARK 沒有 ACK"
      );

    }


    /*
      4 PRINT START
    */

    if(
      !await sendWait(
        "PRINT START",
        CONTROL.printStart(),
        0x02,
        5000
      )
    ){

      throw new Error(
        "PRINT START 沒有 ACK"
      );

    }


    /*
      5 PAGE START
    */

    if(
      !await sendWait(
        "PAGE START",
        CONTROL.pageStart(),
        0x04,
        5000
      )
    ){

      throw new Error(
        "PAGE START 沒有 ACK"
      );

    }


    /*
      6 PAGE SIZE
    */

    if(
      !await sendWait(
        "PAGE SIZE",
        CONTROL.pageSize(
          canvas.height,
          canvas.width
        ),
        0x14,
        5000
      )
    ){

      throw new Error(
        "PAGE SIZE 沒有 ACK"
      );

    }


    /*
      7 DATA
    */

    $("testStatus")
    .textContent=
    `傳送資料 0/${runs.length}`;


    for(
      let i=0;
      i<runs.length;
      i++
    ){

      await writeRaw(
        rowPacket(
          runs[i]
        )
      );


      if(
        i%20===0 ||
        i===runs.length-1
      ){

        $("testStatus")
        .textContent=
        `傳送資料 ${i+1}/${runs.length}`;

      }

    }


    /*
      8 PAGE END

      這次我們把結果直接紀錄，
      不先假設一定會有 E4。
    */

    $("testStatus")
    .textContent=
    "資料完成，送 PAGE END…";


    const pageEnd=
    await sendWait(
      "PAGE END",
      CONTROL.pageEnd(),
      0xE4,
      20000
    );


    if(pageEnd){

      $("testStatus")
      .className=
      "status ok";


      $("testStatus")
      .textContent=
      "✅ PAGE END 有收到 E4，準備 PRINT END";

    }

    else{

      $("testStatus")
      .className=
      "status warn";


      $("testStatus")
      .textContent=
      "⚠️ PAGE END 沒有 E4，請觀察紙張有沒有實際列印／走紙";


      log(
        "重要：PAGE END 無 E4。請確認此時紙張是否有印出黑線＋大字 1。"
      );


      /*
        仍然送 PRINT END，
        看機器是否在這一步真正開始印。
      */

    }


    await delay(
      1000
    );


    const printEnd=
    await sendWait(
      "PRINT END",
      CONTROL.printEnd(),
      0xF4,
      20000
    );


    if(printEnd){

      log(
        "PRINT END ACK ✅"
      );

    }

    else{

      log(
        "PRINT END ACK ❌"
      );

    }


    if(
      pageEnd &&
      printEnd
    ){

      $("testStatus")
      .className=
      "status ok";


      $("testStatus")
      .textContent=
      "✅ 診斷流程全部完成";

    }

    else{

      $("testStatus")
      .className=
      "status warn";


      $("testStatus")
      .textContent=
      "⚠️ 診斷完成，請看紙張結果＋通訊紀錄";

    }

  }

  catch(error){

    const message=
    errorText(error);


    $("testStatus")
    .className=
    "status err";


    $("testStatus")
    .textContent=
    "❌ "+
    message;


    log(
      "DIAG ERROR："+
      message
    );

  }

  finally{

    state.running=false;


    updateButtons();

  }

};


/* =========================
STOP
========================= */

$("stopBtn").onclick=
async()=>{

  state.stop=true;


  try{

    await writeControl(
      CONTROL.pageEnd()
    );

  }

  catch{}


  await delay(100);


  try{

    await writeControl(
      CONTROL.printEnd()
    );

  }

  catch{}


  $("testStatus").className=
  "status warn";


  $("testStatus").textContent=
  "⏹ 已送出停止";

};


/* =========================
LOG
========================= */

$("clearBtn").onclick=
()=>{

  $("log").value="";

};


$("copyBtn").onclick=
async()=>{

  try{

    await navigator.clipboard
    .writeText(
      $("log").value
    );


    alert(
      "已複製"
    );

  }

  catch{

    $("log").select();

  }

};


/* =========================
INIT
========================= */

preview();

updateButtons();

</script>

</body>
</html>
