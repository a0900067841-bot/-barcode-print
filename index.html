<style>

</style>
</head>

<body>

<div class="wrap">

<h1>🔢 B3S 大字號碼牌</h1>

<div class="help">
V19.5｜黑色面積動態節流版
</div>


<div class="card">

<h2>🖨 B3S</h2>

<div id="bleStatus" class="status">
尚未連線
</div>

<div class="row">

<button id="connectBtn" class="success">

裝置：

<br>

GATT：
<span id="gattState">false</span>

<br>

通道：
<span id="channelState">未就緒</span>

</div>

</div>


<div class="card">

<h2>紙張</h2>

<div class="verified">
實體紙：75 × 148 mm<br>
有效列印：72 × 148 mm<br>
黑標模式：2

<div class="grid" style="margin-top:12px">

<div>

<select id="density">

</div>

</div>

<h2>大字內容</h2>

<label>文字</label>

<input id="bigText" value="2" maxlength="3">

<div class="grid" style="margin-top:10px">

<div>
<label>字體大小</label>

<select id="fontMode">
<option value="auto" selected>自動最大</option>
<option value="manual">手動</option>
</select>
</div>

<div>
<label>手動字體 px</label>
<input id="fontSize" type="number" value="430" min="40" max="1000">
</div>

<div>
<label>粗體</label>

<select id="fontWeight">
<option value="900">超粗</option>
<option value="700" selected>粗體</option>
<option value="600">中粗</option>
<option value="500">中等</option>
<option value="400">一般</option>
</select>
</div>

<div>
<label>邊界 mm</label>
<input id="margin" type="number" value="7" min="0" max="30" step=".5">
</div>

<label>X 位移 mm</label>
<input id="offsetX" type="number" value="0" step=".5">
</div>

<div>
<label>Y 位移 mm</label>
<input id="offsetY" type="number" value="0" step=".5">
</div>

</div>

<div class="row" style="margin-top:12px">

<button id="previewBtn" class="gray">
更新預覽
</button>

🖨 列印 1 張
</button>

</div>

等待列印
</div>

<div class="card">

<h2>預覽</h2>

<canvas id="preview"></canvas>
</div>

</div>


<div class="card">

<h2>通訊紀錄</h2>

<div class="row">

<button id="copyBtn" class="gray">
複製紀錄
</button>

<button id="clearBtn" class="gray">
清除紀錄
</button>

</div>

<textarea id="log" class="log" readonly></textarea>

</div>

</div>


<script>

const $=
id=>
document.getElementById(id);


/* =========================
UUID
========================= */

const SERVICE=
"49535343-fe7d-4ae5-8fa9-9fafd205e455";

const WRITE_UUID=
"49535343-8841-43f4-a8d4-ecbe34729bb3";

const NOTIFY_UUID=
"49535343-1e4d-4bd9-ba61-23c647249616";


const state={

  device:null,
  server:null,
  write:null,
  notify:null,

  rx:[],

  running:false,
  stop:false

};


/* =========================
UTIL
========================= */

function delay(ms){

  return new Promise(
    resolve=>
    setTimeout(resolve,ms)
  );
}


function mmToDots(mm){

  return Math.round(
    Number(mm)*
    203/
    25.4
  );
}


function paperDots(mm){

  return Math.floor(
    mmToDots(mm)/8
  )*8;
}


function u16(value){

  return[
    (value>>8)&255,
    value&255
  ];
}


function hex(bytes){

  return Array.from(bytes)
  .map(
    value=>
    value
    .toString(16)
    .padStart(2,"0")
    .toUpperCase()
  )
  .join(" ");
}


function log(text){

  const box=
  $("log");

  box.value+=
  `[${new Date().toLocaleTimeString()}] ${text}\n`;

  box.scrollTop=
  box.scrollHeight;
}


function errorText(error){

  if(error?.message){
    return error.message;
  }

  if(typeof error==="string"){
    return error;
  }

  return String(
    error||
    "未知錯誤"
  );
}


/* =========================
BLE STATE
========================= */

function connected(){

  return !!(
    state.server?.connected &&
    state.write &&
    state.notify
  );
}


function updateButtons(){

  const ready=
  connected();

  $("disconnectBtn").disabled=
  !ready;

  $("stopBtn").disabled=
  !ready;

  $("printBtn").disabled=
  !ready||
  state.running;

  $("gattState").textContent=
  String(
    !!state.server?.connected
  );

  $("channelState").textContent=
  ready
  ?
  "已就緒"
  :
  "未就緒";
}


/* =========================
PACKET
========================= */

function frame(
  command,
  data=[1],
  prefix=false
){

  const payload=
  Array.from(data);

  let checksum=
  command^payload.length;

  for(
    const value
    of payload
  ){

    checksum^=
    value;
  }

  const packet=[

    0x55,
    0x55,

    command,

    payload.length,

    ...payload,

    checksum&255,

    0xAA,
    0xAA

  ];

  if(prefix){

    packet.unshift(
      0x03
    );
  }

  return new Uint8Array(
    packet
  );
}


const CONTROL={

  connect:
  ()=>frame(
    0xC1,
    [1],
    true
  ),

  density:
  value=>frame(
    0x21,
    [value]
  ),

  labelType:
  value=>frame(
    0x23,
    [value]
  ),

  printStart:
  ()=>frame(
    0x01,
    [1]
  ),

  pageStart:
  ()=>frame(
    0x03,
    [1]
  ),

  pageSize:
  (
    height,
    width
  )=>frame(
    0x13,
    [
      ...u16(height),
      ...u16(width)
    ]
  ),

  pageEnd:
  ()=>frame(
    0xE3,
    [1]
  ),

  printEnd:
  ()=>frame(
    0xF3,
    [1]
  )

};


/* =========================
RX
========================= */

function parsePackets(text){

  const bytes=
  String(text||"")
  .trim()
  .split(/\s+/)
  .filter(Boolean)
  .map(
    value=>
    parseInt(
      value,
      16
    )
  );

  const result=[];

  let pos=0;


  while(
    pos<
    bytes.length
  ){

    if(
      bytes[pos]!==0x55 ||
      bytes[pos+1]!==0x55
    ){

      pos++;

      continue;
    }


    const command=
    bytes[pos+2];

    const length=
    bytes[pos+3];

    const checksumIndex=
    pos+
    4+
    length;

    const tail=
    checksumIndex+
    1;


    if(
      tail+1>=
      bytes.length
    ){

      break;
    }


    if(
      bytes[tail]!==0xAA ||
      bytes[tail+1]!==0xAA
    ){

      pos++;

      continue;
    }


    let checksum=
    command^length;


    for(
      let i=0;
      i<length;
      i++
    ){

      checksum^=
      bytes[
        pos+
        4+
        i
      ];
    }


    if(
      (checksum&255)!==
      bytes[
        checksumIndex
      ]
    ){

      pos++;

      continue;
    }


    result.push({

      command,

      payload:
      bytes.slice(
        pos+4,
        pos+4+length
      )

    });


    pos=
    tail+
    2;
  }


  return result;
}


/* =========================
WRITE
========================= */

async function rawGattWrite(bytes){

  if(
    state.write
    .properties
    .writeWithoutResponse &&
    state.write
    .writeValueWithoutResponse
  ){

    await state.write
    .writeValueWithoutResponse(
      bytes
    );
  }

  else if(
    state.write
    .writeValueWithResponse
  ){

    await state.write
    .writeValueWithResponse(
      bytes
    );
  }

  else{

    await state.write
    .writeValue(
      bytes
    );
  }
}


async function writeRaw(
  bytes,
  chunkDelay=2
){

  const size=
  20;


  for(
    let i=0;
    i<bytes.length;
    i+=size
  ){

    if(state.stop){

      throw new Error(
        "使用者停止"
      );
    }


    await rawGattWrite(
      bytes.slice(
        i,
        i+size
      )
    );


    await delay(
      chunkDelay
    );
  }
}


/* =========================
ACK
========================= */

async function sendWait(
  name,
  packet,
  expected,
  timeout=5000
){

  const startIndex=
  state.rx.length;


  log(
    `${name} → ${hex(packet)}`
  );


  await rawGattWrite(
    packet
  );


  const start=
  Date.now();


  while(
    Date.now()-start<
    timeout
  ){

    const incoming=
    state.rx.slice(
      startIndex
    );


    for(
      const raw
      of incoming
    ){

      for(
        const parsed
        of parsePackets(raw)
      ){

        if(
          parsed.command===
          expected
        ){

          log(
            `${name} ACK ✅ 0x${expected.toString(16).toUpperCase()}`
          );

          return true;
        }

      }

    }


    await delay(
      25
    );
  }


  log(
    `${name} ACK ❌ TIMEOUT`
  );


  return false;
}


/* =========================
FONT
========================= */

function fitFont(
  ctx,
  text,
  maxWidth,
  maxHeight,
  weight
){

  let low=
  30;

  let high=
  1000;

  let best=
  30;


  while(
    low<=high
  ){

    const mid=
    Math.floor(
      (
        low+
        high
      )/
      2
    );


    ctx.font=
    `${weight} ${mid}px Arial,-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif`;


    const metrics=
    ctx.measureText(
      text
    );


    const width=
    metrics.width;


    const height=
    (
      metrics.actualBoundingBoxAscent||
      mid*.8
    )+
    (
      metrics.actualBoundingBoxDescent||
      mid*.2
    );


    if(
      width<=maxWidth &&
      height<=maxHeight
    ){

      best=
      mid;

      low=
      mid+
      1;
    }

    else{

      high=
      mid-
      1;
    }
  }


  return best;
}


/* =========================
CANVAS
========================= */

function buildCanvas(){

  const width=
  paperDots(
    72
  );


  const height=
  mmToDots(
    148
  );


  const canvas=
  document.createElement(
    "canvas"
  );


  canvas.width=
  width;


  canvas.height=
  height;


  const ctx=
  canvas.getContext(
    "2d"
  );


  ctx.fillStyle=
  "#fff";


  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  const text=
  (
    $("bigText").value||
    "2"
  )
  .trim();


  const weight=
  $("fontWeight").value;


  const margin=
  mmToDots(
    Number(
      $("margin").value
    )||
    0
  );


  const offsetX=
  mmToDots(
    Number(
      $("offsetX").value
    )||
    0
  );


  const offsetY=
  mmToDots(
    Number(
      $("offsetY").value
    )||
    0
  );


  const maxWidth=
  width-
  margin*2;


  const maxHeight=
  height-
  margin*2;


  let fontSize;


  if(
    $("fontMode").value===
    "auto"
  ){

    fontSize=
    fitFont(
      ctx,
      text,
      maxWidth,
      maxHeight,
      weight
    );
  }

  else{

    fontSize=
    Number(
      $("fontSize").value
    )||
    430;
  }


  ctx.fillStyle=
  "#000";


  ctx.font=
  `${weight} ${fontSize}px Arial,-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif`;


  ctx.textAlign=
  "center";


  ctx.textBaseline=
  "middle";


  ctx.fillText(
    text,
    width/2+
    offsetX,
    height/2+
    offsetY
  );


  return canvas;
}


/* =========================
ROWS
========================= */

function canvasRows(canvas){

  const ctx=
  canvas.getContext(
    "2d"
  );


  const data=
  ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  ).data;


  const rows=[];


  for(
    let y=0;
    y<canvas.height;
    y++
  ){

    const row=
    new Uint8Array(
      canvas.width/8
    );


    let black=
    0;


    for(
      let x=0;
      x<canvas.width;
      x++
    ){

      const i=
      (
        y*
        canvas.width+
        x
      )*
      4;


      const gray=
      (
        data[i]*299+
        data[i+1]*587+
        data[i+2]*114
      )/
      1000;


      if(gray<170){

        row[x>>3]|=
        0x80>>
        (x&7);


        black++;
      }

    }


    rows.push({

      row:y,

      data:row,

      black

    });

  }


  return rows;
}


/* =========================
V19.5 RUNS

空白列可壓縮。
所有黑色列 repeat 固定 1。
========================= */

function buildRuns(canvas){

  const rows=
  canvasRows(
    canvas
  );


  const runs=[];


  let y=
  0;


  while(
    y<
    rows.length
  ){

    const current=
    rows[y];


    if(
      current.black===
      0
    ){

      let repeat=
      1;


      while(
        y+repeat<
        rows.length &&
        repeat<
        40 &&
        rows[
          y+
          repeat
        ].black===
        0
      ){

        repeat++;
      }


      runs.push({

        row:y,

        repeat,

        data:
        current.data,

        black:
        0

      });


      y+=
      repeat;


      continue;
    }


    /*
    黑色列完全不壓縮
    */

    runs.push({

      row:y,

      repeat:
      1,

      data:
      current.data,

      black:
      current.black

    });


    y++;

  }


  return runs;
}


/* =========================
ROW PACKET
========================= */

function rowPacket(run){

  return frame(
    0x85,
    [

      ...u16(
        run.row
      ),

      0,

      run.black&
      255,

      (
        run.black>>
        8
      )&
      255,

      run.repeat,

      ...run.data

    ]
  );
}


/* =========================
DYNAMIC DELAY
========================= */

function blackDelay(
  black,
  quality
){

  if(
    black<=0
  ){

    return 0;
  }


  /*
  72mm = 568 dots

  黑點越多，
  每列等待越久。
  */


  let wait=
  4;


  if(
    black>=100
  ){

    wait=
    5;
  }


  if(
    black>=180
  ){

    wait=
    7;
  }


  if(
    black>=260
  ){

    wait=
    9;
  }


  if(
    black>=340
  ){

    wait=
    11;
  }


  if(
    black>=420
  ){

    wait=
    13;
  }


  if(
    quality===
    "safe"
  ){

    wait+=
    4;
  }


  return wait;
}


/* =========================
PREVIEW
========================= */

function preview(){

  const source=
  buildCanvas();


  const target=
  $("preview");


  target.width=
  source.width;


  target.height=
  source.height;


  target
  .getContext("2d")
  .drawImage(
    source,
    0,
    0
  );
}


$("previewBtn").onclick=
preview;


/* =========================
CONNECT
========================= */

$("connectBtn").onclick=
async()=>{

  try{

    $("bleStatus").className=
    "status warn";


    $("bleStatus").textContent=
    "正在連線…";


    const device=
    await navigator.bluetooth
    .requestDevice({

      acceptAllDevices:
      true,

      optionalServices:[
        SERVICE
      ]

    });


    state.device=
    device;


    $("deviceName").textContent=
    device.name||
    "—";


    state.server=
    await device.gatt
    .connect();


    const service=
    await state.server
    .getPrimaryService(
      SERVICE
    );


    state.write=
    await service
    .getCharacteristic(
      WRITE_UUID
    );


    state.notify=
    await service
    .getCharacteristic(
      NOTIFY_UUID
    );


    state.rx=
    [];


    state.notify
    .addEventListener(
      "characteristicvaluechanged",
      event=>{

        const value=
        event.target.value;


        const bytes=
        new Uint8Array(
          value.buffer,
          value.byteOffset,
          value.byteLength
        );


        const text=
        hex(
          bytes
        );


        state.rx.push(
          text
        );


        log(
          "RX："+text
        );

      }
    );


    await state.notify
    .startNotifications();


    state.device
    .addEventListener(
      "gattserverdisconnected",
      ()=>{

        state.server=
        null;

        state.write=
        null;

        state.notify=
        null;


        $("bleStatus").className=
        "status warn";


        $("bleStatus").textContent=
        "B3S 已中斷";


        updateButtons();

      }
    );


    $("bleStatus").className=
    "status ok";


    $("bleStatus").textContent=
    "✅ B3S 已連線";


    updateButtons();

  }

  catch(error){

    $("bleStatus").className=
    "status err";


    $("bleStatus").textContent=
    "❌ "+
    errorText(error);


    log(
      "CONNECT ERROR："+
      errorText(error)
    );


    updateButtons();

  }

};


/* =========================
DISCONNECT
========================= */

$("disconnectBtn").onclick=
()=>{

  try{

    state.device
    ?.gatt
    ?.disconnect();

  }

  catch{}


  state.server=
  null;

  state.write=
  null;

  state.notify=
  null;


  $("bleStatus").className=
  "status";


  $("bleStatus").textContent=
  "已中斷";


  updateButtons();

};


/* =========================
PRINT
========================= */

$("printBtn").onclick=
async()=>{

  if(
    !connected()
  ){

    return;
  }


  state.running=
  true;


  state.stop=
  false;


  updateButtons();


  const status=
  $("printStatus");


  status.className=
  "status warn";


  status.textContent=
  "準備列印…";


  try{

    const canvas=
    buildCanvas();


    const runs=
    buildRuns(
      canvas
    );


    const density=
    Number(
      $("density").value
    );


    const quality=
    $("quality").value;


    log(
      "========== V19.5 START =========="
    );


    log(
      `CANVAS：${canvas.width} × ${canvas.height}`
    );


    log(
      `TEXT：${$("bigText").value}`
    );


    log(
      `RUNS：${runs.length}`
    );


    log(
      `DENSITY：${density}`
    );


    log(
      `QUALITY：${quality}`
    );


    if(
      !await sendWait(
        "CONNECT",
        CONTROL.connect(),
        0xC2,
        5000
      )
    ){

      throw new Error(
        "CONNECT 沒有 ACK"
      );

    }


    if(
      !await sendWait(
        "DENSITY",
        CONTROL.density(
          density
        ),
        0x31,
        5000
      )
    ){

      throw new Error(
        "DENSITY 沒有 ACK"
      );

    }


    if(
      !await sendWait(
        "LABEL TYPE",
        CONTROL.labelType(
          2
        ),
        0x33,
        5000
      )
    ){

      throw new Error(
        "LABEL TYPE 沒有 ACK"
      );

    }


    if(
      !await sendWait(
        "PRINT START",
        CONTROL.printStart(),
        0x02,
        5000
      )
    ){

      throw new Error(
        "PRINT START 沒有 ACK"
      );

    }


    if(
      !await sendWait(
        "PAGE START",
        CONTROL.pageStart(),
        0x04,
        5000
      )
    ){

      throw new Error(
        "PAGE START 沒有 ACK"
      );

    }


    if(
      !await sendWait(
        "PAGE SIZE",
        CONTROL.pageSize(
          canvas.height,
          canvas.width
        ),
        0x14,
        5000
      )
    ){

      throw new Error(
        "PAGE SIZE 沒有 ACK"
      );

    }


    /*
    BITMAP
    */


    for(
      let i=0;
      i<runs.length;
      i++
    ){

      const run=
      runs[i];


      await writeRaw(
        rowPacket(run),
        2
      );


      if(
        run.black>
        0
      ){

        await delay(
          blackDelay(
            run.black,
            quality
          )
        );

      }


      /*
      每 20 run
      保留一次小緩衝
      */


      if(
        (i+1)%20===
        0
      ){

        await delay(
          quality===
          "safe"
          ?
          25
          :
          16
        );

      }


      if(
        (i+1)%10===
        0 ||
        i===
        runs.length-
        1
      ){

        status.textContent=
        `傳送 ${i+1}/${runs.length}`;

      }

    }


    log(
      "BITMAP DATA ✅"
    );


    status.textContent=
    "黑標定位中…";


    const pageEnd=
    await sendWait(
      "PAGE END",
      CONTROL.pageEnd(),
      0xE4,
      20000
    );


    if(
      !pageEnd
    ){

      throw new Error(
        "PAGE END／定位逾時"
      );

    }


    /*
    維持成功版本的等待
    */


    await delay(
      500
    );


    const printEnd=
    await sendWait(
      "PRINT END",
      CONTROL.printEnd(),
      0xF4,
      12000
    );


    if(
      !printEnd
    ){

      throw new Error(
        "PRINT END 沒有 ACK"
      );

    }


    status.className=
    "status ok";


    status.textContent=
    "✅ V19.5 列印完成";


    log(
      "========== V19.5 COMPLETE =========="
    );

  }

  catch(error){

    const message=
    errorText(
      error
    );


    status.className=
    "status err";


    status.textContent=
    "❌ "+
    message;


    log(
      "V19.5 ERROR："+
      message
    );

  }

  finally{

    state.running=
    false;


    updateButtons();

  }

};


/* =========================
STOP
========================= */

$("stopBtn").onclick=
async()=>{

  state.stop=
  true;


  try{

    await rawGattWrite(
      CONTROL.pageEnd()
    );

  }

  catch{}


  await delay(
    100
  );


  try{

    await rawGattWrite(
      CONTROL.printEnd()
    );

  }

  catch{}


  $("printStatus").className=
  "status warn";


  $("printStatus").textContent=
  "⏹ 已停止";

};


/* =========================
LOG
========================= */

$("clearBtn").onclick=
()=>{

  $("log").value=
  "";

};


$("copyBtn").onclick=
async()=>{

  try{

    await navigator.clipboard
    .writeText(
      $("log").value
    );


    alert(
      "已複製"
    );

  }

  catch{

    $("log")
    .select();

  }

};


/* =========================
AUTO PREVIEW
========================= */

[
  "bigText",
  "fontMode",
  "fontSize",
  "fontWeight",
  "margin",
  "offsetX",
  "offsetY"
]
.forEach(
  id=>{

    $(id)
    .addEventListener(
      "change",
      preview
    );

  }
);


/* =========================
INIT
========================= */

preview();

updateButtons();

</script>

</body>
</html>
