<script>

const $ =
id =>
document.getElementById(id);


/* =========================
   B3S UUID
========================= */

const SERVICE =
"49535343-fe7d-4ae5-8fa9-9fafd205e455";

const WRITE_UUID =
"49535343-8841-43f4-a8d4-ecbe34729bb3";

const NOTIFY_UUID =
"49535343-1e4d-4bd9-ba61-23c647249616";


const state = {

  items:[],

  device:null,

  server:null,

  write:null,

  notify:null,

  rx:[],

  printing:false,

  needsReconnect:false

};


/* =========================
   Utility
========================= */

function delay(ms){

  return new Promise(
    resolve =>
    setTimeout(
      resolve,
      ms
    )
  );

}


function mmToPx(mm){

  return Math.round(
    mm * 203 / 25.4
  );

}


function paperDots(mm){

  return Math.max(

    8,

    Math.floor(
      mmToPx(mm) / 8
    ) * 8

  );

}


function hex(bytes){

  return Array
  .from(bytes)

  .map(
    value =>
    value
    .toString(16)
    .padStart(2,"0")
    .toUpperCase()
  )

  .join(" ");

}


function hx(value){

  return Number(value)
  .toString(16)
  .padStart(2,"0")
  .toUpperCase();

}


function log(text){

  const box =
  $("log");


  box.value +=
  `[${new Date().toLocaleTimeString()}] ${text}\n`;


  box.scrollTop =
  box.scrollHeight;

}


function escapeHtml(text){

  return String(
    text ?? ""
  )

  .replace(

    /[&<>"']/g,

    c => ({

      "&":"&amp;",

      "<":"&lt;",

      ">":"&gt;",

      '"':"&quot;",

      "'":"&#039;"

    }[c])

  );

}


function u16(value){

  return [

    (value >> 8) & 255,

    value & 255

  ];

}


/* =========================
   NIIMBOT Frame
========================= */

function frame(
  command,
  data=[1],
  connectPrefix=false
){

  const payload =
  Array.from(data);


  let checksum =
  command ^
  payload.length;


  for(
    const value
    of payload
  ){

    checksum ^=
    value;

  }


  const packet = [

    0x55,
    0x55,

    command,

    payload.length,

    ...payload,

    checksum & 255,

    0xAA,
    0xAA

  ];


  if(
    connectPrefix
  ){

    packet.unshift(
      0x03
    );

  }


  return new Uint8Array(
    packet
  );

}


const CONTROL = {

  connect:
  () =>
  frame(
    0xC1,
    [1],
    true
  ),


  density:
  value =>
  frame(
    0x21,
    [value]
  ),


  label:
  () =>
  frame(
    0x23,
    [1]
  ),


  printStart:
  () =>
  frame(
    0x01
  ),


  pageStart:
  () =>
  frame(
    0x03
  ),


  pageSize:
  (height,width) =>
  frame(
    0x13,
    [
      ...u16(height),
      ...u16(width)
    ]
  ),


  pageEnd:
  () =>
  frame(
    0xE3
  ),


  printEnd:
  () =>
  frame(
    0xF3
  )

};


/* =========================
   RX parser
========================= */

function parsePackets(text){

  const bytes =
  String(text || "")
  .trim()
  .split(/\s+/)
  .filter(Boolean)
  .map(
    value =>
    parseInt(
      value,
      16
    )
  );


  const output =
  [];


  let position =
  0;


  while(
    position <
    bytes.length
  ){

    if(
      bytes[position] !== 0x55
      ||
      bytes[position+1] !== 0x55
    ){

      position++;

      continue;

    }


    if(
      position + 6 >
      bytes.length
    ){

      break;

    }


    const command =
    bytes[position+2];


    const length =
    bytes[position+3];


    const checksumIndex =
    position +
    4 +
    length;


    const tail =
    checksumIndex +
    1;


    if(
      tail + 1 >=
      bytes.length
    ){

      break;

    }


    if(
      bytes[tail] !== 0xAA
      ||
      bytes[tail+1] !== 0xAA
    ){

      position++;

      continue;

    }


    const payload =
    bytes.slice(

      position+4,

      position+4+length

    );


    let checksum =
    command ^
    length;


    for(
      const value
      of payload
    ){

      checksum ^=
      value;

    }


    output.push({

      command,

      payload,

      checksumOk:
      (checksum & 255)
      ===
      bytes[checksumIndex]

    });


    position =
    tail + 2;

  }


  return output;

}


/* =========================
   BLE write
========================= */

async function writeRaw(bytes){

  if(
    !state.write
  ){

    throw new Error(
      "B3S 寫入通道未就緒"
    );

  }


  /*
  為避免大點陣超過 BLE MTU，
  拆成 20 bytes 串流送出。
  */

  const chunkSize =
  20;


  for(
    let i=0;
    i<bytes.length;
    i+=chunkSize
  ){

    const part =
    bytes.slice(
      i,
      i+chunkSize
    );


    if(
      state.write
      .properties
      .writeWithoutResponse

      &&

      state.write
      .writeValueWithoutResponse
    ){

      await state.write
      .writeValueWithoutResponse(
        part
      );

    }


    else if(
      state.write
      .writeValueWithResponse
    ){

      await state.write
      .writeValueWithResponse(
        part
      );

    }


    else{

      await state.write
      .writeValue(
        part
      );

    }


    if(
      bytes.length >
      chunkSize
    ){

      await delay(
        6
      );

    }

  }

}


async function writePacket(
  bytes,
  label="TX"
){

  log(
    `${label}：${hex(bytes)}`
  );


  await writeRaw(
    bytes
  );

}


/* =========================
   Send + wait
========================= */

async function sendWait(
  packet,
  expectedCommand,
  timeout=2500
){

  const startIndex =
  state.rx.length;


  await writePacket(
    packet
  );


  const started =
  Date.now();


  while(
    Date.now() -
    started <
    timeout
  ){

    const newPackets =
    state.rx.slice(
      startIndex
    );


    for(
      const rx
      of newPackets
    ){

      const packets =
      parsePackets(
        rx.hex
      );


      for(
        const packet
        of packets
      ){

        if(
          !packet.checksumOk
        ){

          continue;

        }


        if(
          packet.command ===
          0x00
        ){

          return {

            ok:false,

            unsupported:true,

            packet

          };

        }


        if(
          packet.command ===
          expectedCommand
        ){

          return {

            ok:true,

            packet

          };

        }

      }

    }


    await delay(
      40
    );

  }


  return {

    ok:false,

    timeout:true

  };

}


/* =========================
   Barcode
========================= */

function detectFormat(code){

  if(
    /^\d{13}$/.test(code)
  ){

    return "EAN13";

  }


  if(
    /^\d{8}$/.test(code)
  ){

    return "EAN8";

  }


  if(
    /^\d{12}$/.test(code)
  ){

    return "UPC";

  }


  return "CODE128";

}


function makeBarcode(
  code,
  maxWidth,
  height
){

  const canvas =
  document.createElement(
    "canvas"
  );


  try{

    JsBarcode(
      canvas,
      code,
      {

        format:
        detectFormat(code),

        displayValue:true,

        height,

        margin:0,

        width:2,

        fontSize:18,

        textMargin:3

      }
    );

  }

  catch{

    JsBarcode(
      canvas,
      code,
      {

        format:"CODE128",

        displayValue:true,

        height,

        margin:0,

        width:2,

        fontSize:18,

        textMargin:3

      }
    );

  }


  if(
    canvas.width <=
    maxWidth
  ){

    return canvas;

  }


  const scaled =
  document.createElement(
    "canvas"
  );


  scaled.width =
  maxWidth;


  scaled.height =
  Math.round(

    canvas.height *
    maxWidth /
    canvas.width

  );


  const ctx =
  scaled.getContext(
    "2d"
  );


  ctx.imageSmoothingEnabled =
  false;


  ctx.drawImage(

    canvas,

    0,
    0,

    scaled.width,
    scaled.height

  );


  return scaled;

}


/* =========================
   Preview canvas
========================= */

function buildPreviewCanvas(){

  const width =
  paperDots(
    Number(
      $("paperWidth").value
    )
  );


  const margin =
  mmToPx(2);


  const contentWidth =
  width -
  margin * 2;


  const barcodeHeight =
  mmToPx(
    Number(
      $("barcodeHeight").value
    )
  );


  const gap =
  mmToPx(
    Number(
      $("itemGap").value
    )
  );


  const blocks =
  state.items.map(
    item => {

      const barcode =
      makeBarcode(

        item.code,

        contentWidth,

        barcodeHeight

      );


      return {

        item,

        barcode,

        height:
        30 +
        barcode.height +
        gap

      };

    }
  );


  const footer =
  $("footerText")
  .value
  .trim();


  let height =

  mmToPx(2)

  +

  blocks.reduce(
    (sum,block) =>
    sum +
    block.height,
    0
  )

  +

  (
    footer
    ?
    34 +
    mmToPx(2)
    :
    mmToPx(2)
  );


  height =
  Math.max(
    24,
    height
  );


  if(
    height >
    65000
  ){

    throw new Error(
      "內容太長，請減少商品筆數後再列印"
    );

  }


  const canvas =
  $("previewCanvas");


  canvas.width =
  width;


  canvas.height =
  height;


  const ctx =
  canvas.getContext(
    "2d"
  );


  ctx.fillStyle =
  "#fff";


  ctx.fillRect(

    0,
    0,

    width,
    height

  );


  ctx.fillStyle =
  "#000";


  ctx.textAlign =
  "center";


  ctx.textBaseline =
  "top";


  let y =
  mmToPx(2);


  for(
    const block
    of blocks
  ){

    ctx.font =
    '600 20px "PingFang TC","Microsoft JhengHei",sans-serif';


    ctx.fillText(

      block.item.name ||
      "",

      width / 2,

      y,

      contentWidth

    );


    y +=
    30;


    ctx.imageSmoothingEnabled =
    false;


    ctx.drawImage(

      block.barcode,

      (
        width -
        block.barcode.width
      ) / 2,

      y

    );


    y +=

    block.barcode.height

    +

    gap;

  }


  if(
    footer
  ){

    ctx.font =
    '700 18px "PingFang TC","Microsoft JhengHei",sans-serif';


    ctx.fillText(

      footer,

      width / 2,

      y,

      contentWidth

    );

  }


  return canvas;

}


function drawPreview(){

  try{

    buildPreviewCanvas();

  }

  catch(error){

    alert(
      error.message
    );

  }

}


/* =========================
   Items
========================= */

function renderItems(){

  const box =
  $("items");


  if(
    !state.items.length
  ){

    box.innerHTML =
    '<div class="help">目前沒有商品</div>';


    updatePrintButton();


    return;

  }


  box.innerHTML =
  state.items

  .map(
    (item,index) => `

    <div class="item">

      <b>
      ${escapeHtml(
        item.name ||
        "未命名商品"
      )}
      </b>

      <br>

      <small>
      ${escapeHtml(
        item.code
      )}
      </small>

      <div class="actions">

        <button
        class="danger deleteBtn"
        data-index="${index}">
        刪除
        </button>

      </div>

    </div>

    `
  )

  .join("");


  updatePrintButton();

}


function addItem(){

  const name =
  $("name")
  .value
  .trim();


  const code =
  $("code")
  .value
  .trim();


  if(
    !code
  ){

    alert(
      "請輸入商品條碼"
    );

    return;

  }


  state.items.push({
    name,
    code
  });


  $("name").value =
  "";


  $("code").value =
  "";


  renderItems();

  drawPreview();

}


$("addBtn").onclick =
addItem;


$("clearInputBtn").onclick =
() => {

  $("name").value =
  "";


  $("code").value =

/* =========================
   Bulk
========================= */

$("bulkAddBtn").onclick =
() => {

  const text =
  $("bulkInput")
  .value
  .trim();


  if(
    !text
  ){

    $("bulkStatus")
    .textContent =
    "請先輸入商品名稱與條碼";


    return;

  }


  let added =
  0;


  let skipped =
  0;


  const lines =
  text.split(
    /\r?\n/
  );


  for(
    const raw
    of lines
  ){

    const line =
    raw.trim();


    if(
      !line
    ){

      continue;

    }


    let name =
    "";


    let code =
    "";


    if(
      line.includes("\t")
    ){

      const parts =
      line.split("\t");


      name =
      (
        parts[0] ||
        ""
      )
      .trim();


      code =
      (
        parts[1] ||
        ""
      )
      .trim();

    }


    else if(
      line.includes(",")
    ){

      const parts =
      line.split(",");


      code =
      (
        parts.pop() ||
        ""
      )
      .trim();


      name =
      parts
      .join(",")
      .trim();

    }


    else{

      const match =
      line.match(
        /^(.*?)[\s]+(\d{6,})$/
      );


      if(
        match
      ){

        name =
        match[1]
        .trim();


        code =
        match[2]
        .trim();

      }

    }


    if(
      !code
    ){

      skipped++;

      continue;

    }


    state.items.push({
      name,
      code
    });


    added++;

  }


  $("bulkStatus")
  .textContent =

  `已加入 ${added} 筆`

  +

  (
    skipped
    ?
    `，略過 ${skipped} 筆`
    :
    ""
  );


  if(
    added
  ){

    $("bulkInput").value =
    "";

  }


  renderItems();

  drawPreview();

};

() => {

  false;

$("connectBtn").onclick =
async () => {

  try{

    $("bleStatus")
    .className =
    "status warn";


    $("bleStatus")
    .textContent =
    "正在連接 B3S…";


    const device =
    await navigator.bluetooth
    .requestDevice({

      acceptAllDevices:true,

      optionalServices:[
        SERVICE
      ]

    });


    state.device =
    device;


    $("deviceName")
    .textContent =
    device.name ||
    "—";


    state.server =
    await device.gatt
    .connect();


    const service =
    await state.server
    .getPrimaryService(
      SERVICE
    );


    state.write =
    await service
    .getCharacteristic(
      WRITE_UUID
    );


    state.notify =
    await service
    .getCharacteristic(
      NOTIFY_UUID
    );


    state.rx =
    [];


    state.needsReconnect =
    false;


    state.notify
    .addEventListener(
      "characteristicvaluechanged",

      event => {

        const value =
        event.target.value;


        const bytes =
        new Uint8Array(

          value.buffer,

          value.byteOffset,

          value.byteLength

        );


        const data =
        hex(bytes);


        state.rx.push({

          time:
          Date.now(),

          hex:
          data

        });


        if(
          state.rx.length >
          800
        ){

          state.rx.shift();

        }


        log(
          "RX：" +
          data
        );

      }
    );


    await state.notify
    .startNotifications();


    device.addEventListener(
      "gattserverdisconnected",

      () => {

        state.server =
        null;


        state.write =
        null;


        state.notify =
        null;


        state.printing =
        false;


        state.needsReconnect =
        false;


        $("bleStatus")
        .className =
        "status warn";


        $("bleStatus")
        .textContent =
        "已中斷";


        updateBleUi();

      }
    );


    $("bleStatus")
    .className =
    "status ok";


    $("bleStatus")
    .textContent =
    "✅ B3S 已連線，可直接列印";


    log(
      "V12 B3S print channel ready"
    );


    updateBleUi();

  }


  catch(error){

    $("bleStatus")
    .className =
    "status err";


    $("bleStatus")
    .textContent =
    "連線失敗：" +
    error.message;


    updateBleUi();

  }

};

/* =========================
   Canvas → BW1 rows
========================= */

function rowEqual(
  a,
  b
){

  if(
    a.length !==
    b.length
  ){

    return false;

  }


  for(
    let i=0;
    i<a.length;
    i++
  ){

    if(
      a[i] !==
      b[i]
    ){

      return false;

    }

  }


  return true;

}


function canvasToRuns(canvas){

  const ctx =
  canvas.getContext(
    "2d"
  );


  const image =
  ctx.getImageData(

    0,
    0,

    canvas.width,
    canvas.height

  )
  .data;


  const width =
  canvas.width;


  const height =
  canvas.height;


  const rowBytes =
  width / 8;


  const rows =
  [];


  for(
    let y=0;
    y<height;
    y++
  ){

    const data =
    new Uint8Array(
      rowBytes
    );


    let black =
    0;


    for(
      let x=0;
      x<width;
      x++
    ){

      const index =
      (
        y *
        width +
        x
      ) * 4;


      const gray =

      (
        image[index] *
        299

        +

        image[index+1] *
        587

        +

        image[index+2] *
        114
      )

      /

      1000;


      const isBlack =
      gray <
      170;


      if(
        isBlack
      ){

        data[x >> 3] |=

        (
          0x80 >>
          (x & 7)
        );


        black++;

      }

    }


    rows.push({
      data,
      black
    });

  }


  /*
  相同連續列壓縮成 repeat，
  降低 BLE 傳輸量。
  */

  const runs =
  [];


  let y =
  0;


  while(
    y <
    rows.length
  ){

    const first =
    rows[y];


    let repeat =
    1;


    while(

      y + repeat <
      rows.length

      &&

      repeat <
      255

      &&

      rowEqual(

        first.data,

        rows[y+repeat].data

      )

    ){

      repeat++;

    }


    runs.push({

      row:
      y,

      repeat,

      data:
      first.data,

      black:
      first.black

    });


    y +=
    repeat;

  }


  return runs;

}


/* =========================
   Bitmap row

   已成功測試：
   PRINT_BITMAP_ROW = 0x85

   pixel count 使用
   total mode：
   00, LOW, HIGH
========================= */

function rowPacket(run){

  const count = [

    0x00,

    run.black &
    0xFF,

    (
      run.black >>
      8
    )
    &
    0xFF

  ];


  const payload = [

    ...u16(
      run.row
    ),

    ...count,

    run.repeat,

    ...run.data

  ];


  return frame(
    0x85,
    payload
  );

}


/* =========================
   Progress
========================= */

function progress(
  value,
  text=""
){

  const result =
  Math.max(
    0,
    Math.min(
      100,
      value
    )
  );


  $("progressBar")
  .style
  .width =
  result + "%";


  if(
    text
  ){

    $("printMeta")
    .textContent =
    text;

  }

}


/* =========================
   ACK step
========================= */

async function expectStep(
  name,
  packet,
  ack,
  timeout=3000
){

  $("printStatus")
  .className =
  "status warn";


  $("printStatus")
  .textContent =
  name;


  const result =
  await sendWait(
    packet,
    ack,
    timeout
  );


  if(
    result.ok
  ){

    log(

      `${name} ACK ${hx(result.packet.command)} DATA ${result.packet.payload.map(hx).join(" ")}`

    );


    return result;

  }


  if(
    result.unsupported
  ){

    throw new Error(

      `${name}：B3S 回 CMD 00 NOT_SUPPORTED`

    );

  }


  throw new Error(

    `${name}：等待 ACK 逾時`

  );

}


/* =========================
   DIRECT PRINT
========================= */

$("directPrintBtn").onclick =
async () => {

  if(
    !state.items.length
  ){

    alert(
      "請先新增商品"
    );

    return;

  }


  if(
    !state.server?.connected
    ||
    !state.write
    ||
    !state.notify
  ){

    alert(
      "請先連接 B3S"
    );

    return;

  }


  if(
    state.needsReconnect
  ){

    alert(
      "上一筆列印未正常結束，請先中斷再重新連接 B3S"
    );

    return;

  }


  state.printing =
  true;


  updatePrintButton();


  progress(
    0,
    "正在建立列印點陣…"
  );


  try{

    const canvas =
    buildPreviewCanvas();


    const width =
    canvas.width;


    const height =
    canvas.height;


    if(
      width % 8 !== 0
    ){

      throw new Error(
        "列印寬度必須是 8 dots 的倍數"
      );

    }


    const runs =
    canvasToRuns(
      canvas
    );


    $("printMeta")
    .textContent =

    `${width} × ${height} dots｜${state.items.length} 筆商品｜${runs.length} 個點陣區段`;


    /*
    1 CONNECT
    */

    await expectStep(

      "1/7 CONNECT",

      CONTROL.connect(),

      0xC2

    );


    progress(
      5
    );


    /*
    2 Density
    */

    await expectStep(

      "2/7 SET DENSITY",

      CONTROL.density(
        Number(
          $("density").value
        )
      ),

      0x31

    );


    progress(
      10
    );


    /*
    3 Label type
    */

    await expectStep(

      "3/7 SET LABEL TYPE",

      CONTROL.label(),

      0x33

    );


    progress(
      15
    );


    /*
    4 Print Start
    */

    await expectStep(

      "4/7 PRINT START",

      CONTROL.printStart(),

      0x02

    );


    progress(
      20
    );


    /*
    5 Page Start
    */

    await expectStep(

      "5/7 PAGE START",

      CONTROL.pageStart(),

      0x04

    );


    progress(
      25
    );


    /*
    6 Page size

    B3S 已確認：
    height + width
    */

    await expectStep(

      "6/7 SET PAGE SIZE",

      CONTROL.pageSize(
        height,
        width
      ),

      0x14,

      5000

    );


    progress(
      30
    );


    /*
    Bitmap
    */

    $("printStatus")
    .className =
    "status warn";


    $("printStatus")
    .textContent =
    "正在傳送商品條碼點陣…";


    for(
      let i=0;
      i<runs.length;
      i++
    ){

      await writeRaw(
        rowPacket(
          runs[i]
        )
      );


      if(
        i % 4 === 0
      ){

        progress(

          30

          +

          Math.round(

            (
              i + 1
            )

            /

            runs.length

            *

            55

          ),

          `正在傳送點陣 ${i+1}/${runs.length}`

        );


        await delay(
          8
        );

      }

    }


    progress(

      87,

      "點陣已送完，正在結束頁面…"

    );


    /*
    PAGE END
    */

    await expectStep(

      "PAGE END",

      CONTROL.pageEnd(),

      0xE4,

      7000

    );


    progress(
      92
    );


    await delay(
      500
    );


    /*
    PRINT END
    */

    const end =
    await sendWait(

      CONTROL.printEnd(),

      0xF4,

      7000

    );


    if(
      !end.ok
    ){

      if(
        end.unsupported
      ){

        throw new Error(
          "PRINT END：B3S 回 CMD 00"
        );

      }


      throw new Error(
        "PRINT END：沒有收到 F4"
      );

    }


    const endData =
    end.packet
    .payload?.[0];


    progress(

      100,

      "列印資料傳送完成"

    );


    if(
      endData ===
      1
    ){

      $("printStatus")
      .className =
      "status ok";


      $("printStatus")
      .textContent =
      "✅ B3S 列印完成";


      state.needsReconnect =
      false;

    }


    else{

      $("printStatus")
      .className =
      "status warn";


      $("printStatus")
      .textContent =

      `⚠️ 已送完列印資料，但 PRINT END DATA=${hx(endData ?? 0)}；若實體已正常列印可繼續使用`;


      state.needsReconnect =
      false;

    }

  }


  catch(error){

    log(
      "V12 PRINT ERROR：" +
      error.message
    );


    $("printStatus")
    .className =
    "status err";


    $("printStatus")
    .textContent =
    "❌ " +
    error.message;


    state.needsReconnect =
    true;


    $("printMeta")
    .textContent =
    "請中斷 B3S 後重新連線再試。";

  }


  finally{

    state.printing =
    false;


    updatePrintButton();

  }

};
