<script>

const $ =
id =>
document.getElementById(id);


/* =========================
   BLE
========================= */

const SERVICE =
"49535343-fe7d-4ae5-8fa9-9fafd205e455";

const WRITE_UUID =
"49535343-8841-43f4-a8d4-ecbe34729bb3";

const NOTIFY_UUID =
"49535343-1e4d-4bd9-ba61-23c647249616";


const state = {

  items:[],

  device:null,

  server:null,

  write:null,

  notify:null,

  rx:[],

  printing:false,

  needsReconnect:false

};


/* =========================
   工具
========================= */

function delay(ms){

  return new Promise(
    resolve =>
    setTimeout(
      resolve,
      ms
    )
  );

}


function mmToPx(mm){

  return Math.round(
    mm *
    203 /
    25.4
  );

}


function paperDots(mm){

  return Math.max(
    8,
    Math.floor(
      mmToPx(mm) / 8
    ) * 8
  );

}


function hex(bytes){

  return Array
  .from(bytes)

  .map(
    value =>
    value
    .toString(16)
    .padStart(2,"0")
    .toUpperCase()
  )

  .join(" ");

}


function hx(value){

  return Number(value)
  .toString(16)
  .padStart(2,"0")
  .toUpperCase();

}


function u16(value){

  return [
    (value >> 8) & 255,
    value & 255
  ];

}


function log(text){

  const box =
  $("log");


  box.value +=
  `[${new Date().toLocaleTimeString()}] ${text}\n`;


  box.scrollTop =
  box.scrollHeight;

}


function escapeHtml(text){

  return String(
    text ?? ""
  )
  .replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char])
  );

}


/* =========================
   NIIMBOT
========================= */

function frame(
  command,
  data=[1],
  connectPrefix=false
){

  const payload =
  Array.from(data);


  let checksum =
  command ^
  payload.length;


  for(
    const value
    of payload
  ){

    checksum ^=
    value;

  }


  const packet = [

    0x55,
    0x55,

    command,

    payload.length,

    ...payload,

    checksum & 255,

    0xAA,
    0xAA

  ];


  if(
    connectPrefix
  ){

    packet.unshift(
      0x03
    );

  }


  return new Uint8Array(
    packet
  );

}


const CONTROL = {

  connect:
  () =>
  frame(
    0xC1,
    [1],
    true
  ),


  density:
  value =>
  frame(
    0x21,
    [value]
  ),


  label:
  () =>
  frame(
    0x23,
    [1]
  ),


  printStart:
  () =>
  frame(
    0x01
  ),


  pageStart:
  () =>
  frame(
    0x03
  ),


  pageSize:
  (height,width) =>
  frame(
    0x13,
    [
      ...u16(height),
      ...u16(width)
    ]
  ),


  pageEnd:
  () =>
  frame(
    0xE3
  ),


  printEnd:
  () =>
  frame(
    0xF3
  )

};


/* =========================
   RX
========================= */

function parsePackets(text){

  const bytes =
  String(text || "")
  .trim()
  .split(/\s+/)
  .filter(Boolean)
  .map(
    value =>
    parseInt(
      value,
      16
    )
  );


  const output =
  [];


  let position =
  0;


  while(
    position <
    bytes.length
  ){

    if(
      bytes[position] !== 0x55
      ||
      bytes[position+1] !== 0x55
    ){

      position++;

      continue;

    }


    const command =
    bytes[position+2];


    const length =
    bytes[position+3];


    const checksumIndex =
    position +
    4 +
    length;


    const tail =
    checksumIndex +
    1;


    if(
      tail + 1 >=
      bytes.length
    ){

      break;

    }


    if(
      bytes[tail] !==
      0xAA

      ||

      bytes[tail+1] !==
      0xAA
    ){

      position++;

      continue;

    }


    const payload =
    bytes.slice(
      position+4,
      position+4+length
    );


    let checksum =
    command ^
    length;


    for(
      const value
      of payload
    ){

      checksum ^=
      value;

    }


    output.push({

      command,

      payload,

      checksumOk:
      (checksum & 255)
      ===
      bytes[checksumIndex]

    });


    position =
    tail + 2;

  }


  return output;

}


/* =========================
   BLE TX
========================= */

async function writeRaw(bytes){

  if(
    !state.write
  ){

    throw new Error(
      "B3S 尚未連線"
    );

  }


  const chunkSize =
  20;


  for(
    let index=0;
    index<bytes.length;
    index+=chunkSize
  ){

    const part =
    bytes.slice(
      index,
      index+chunkSize
    );


    if(
      state.write
      .properties
      .writeWithoutResponse

      &&

      state.write
      .writeValueWithoutResponse
    ){

      await state.write
      .writeValueWithoutResponse(
        part
      );

    }


    else if(
      state.write
      .writeValueWithResponse
    ){

      await state.write
      .writeValueWithResponse(
        part
      );

    }


    else{

      await state.write
      .writeValue(
        part
      );

    }


    if(
      bytes.length >
      chunkSize
    ){

      await delay(6);

    }

  }

}


async function sendWait(
  packet,
  expected,
  timeout=3000
){

  const startIndex =
  state.rx.length;


  log(
    "TX：" +
    hex(packet)
  );


  await writeRaw(
    packet
  );


  const start =
  Date.now();


  while(
    Date.now() -
    start <
    timeout
  ){

    const newRx =
    state.rx.slice(
      startIndex
    );


    for(
      const rx
      of newRx
    ){

      for(
        const parsed
        of parsePackets(rx.hex)
      ){

        if(
          !parsed.checksumOk
        ){

          continue;

        }


        if(
          parsed.command ===
          0x00
        ){

          return {
            ok:false,
            unsupported:true,
            packet:parsed
          };

        }


        if(
          parsed.command ===
          expected
        ){

          return {
            ok:true,
            packet:parsed
          };

        }

      }

    }


    await delay(40);

  }


  return {
    ok:false,
    timeout:true
  };

}


/* =========================
   條碼
========================= */

function detectFormat(code){

  if(/^\d{13}$/.test(code))
  return "EAN13";


  if(/^\d{8}$/.test(code))
  return "EAN8";


  if(/^\d{12}$/.test(code))
  return "UPC";


  return "CODE128";

}


function makeBarcode(
  code,
  maxWidth,
  height
){

  const canvas =
  document.createElement(
    "canvas"
  );


  try{

    JsBarcode(
      canvas,
      code,
      {

        format:
        detectFormat(code),

        displayValue:true,

        height,

        margin:0,

        width:2,

        fontSize:20,

        textMargin:4

      }
    );

  }

  catch{

    JsBarcode(
      canvas,
      code,
      {

        format:"CODE128",

        displayValue:true,

        height,

        margin:0,

        width:2,

        fontSize:20,

        textMargin:4

      }
    );

  }


  if(
    canvas.width <=
    maxWidth
  ){

    return canvas;

  }


  const scaled =
  document.createElement(
    "canvas"
  );


  scaled.width =
  maxWidth;


  scaled.height =
  Math.round(
    canvas.height *
    maxWidth /
    canvas.width
  );


  const ctx =
  scaled.getContext(
    "2d"
  );


  ctx.imageSmoothingEnabled =
  false;


  ctx.drawImage(
    canvas,
    0,
    0,
    scaled.width,
    scaled.height
  );


  return scaled;

}


/* =========================
   商品 UI
========================= */

function renderItems(){

  $("itemCount")
  .textContent =
  `${state.items.length} 筆商品`;


  if(
    !state.items.length
  ){

    $("items")
    .innerHTML =
    '<div class="help" style="margin-top:10px">目前沒有商品</div>';


    updateButtons();

    return;

  }


  $("items")
  .innerHTML =
  state.items

  .map(
    (item,index) => `

    <div class="item">

      <input
      type="checkbox"
      class="itemCheck"
      data-index="${index}"
      ${item.selected ? "checked" : ""}>

      <div>

        <div class="itemName">
        ${escapeHtml(
          item.name ||
          "未命名商品"
        )}
        </div>

        <div class="itemCode">
        ${escapeHtml(item.code)}
        </div>

        <div class="itemBottom">

          <div class="qtyWrap">

            <span>份數</span>

            <input
            type="number"
            min="1"
            max="99"
            value="${item.qty}"
            class="qtyInput"
            data-index="${index}">

          </div>

          <button
          class="danger smallBtn deleteBtn"
          data-index="${index}">
          刪除
          </button>

        </div>

      </div>

    </div>

    `
  )

  .join("");


  updateButtons();

}


$("items")
.addEventListener(
  "change",
  event => {

    const index =
    Number(
      event.target.dataset.index
    );


    if(
      event.target.classList
      .contains(
        "itemCheck"
      )
    ){

      state.items[index]
      .selected =
      event.target.checked;

    }


    if(
      event.target.classList
      .contains(
        "qtyInput"
      )
    ){

      let qty =
      Number(
        event.target.value
      );


      if(
        !Number.isFinite(qty)
        ||
        qty < 1
      ){

        qty = 1;

      }


      qty =
      Math.min(
        99,
        Math.floor(qty)
      );


      state.items[index]
      .qty =
      qty;


      event.target.value =
      qty;

    }


    updateButtons();

    drawPreview();

  }
);


$("items")
.addEventListener(
  "click",
  event => {

    const button =
    event.target.closest(
      ".deleteBtn"
    );


    if(!button)
    return;


    state.items.splice(
      Number(
        button.dataset.index
      ),
      1
    );


    renderItems();

    drawPreview();

  }
);


/* =========================
   新增
========================= */

function addItem(){

  const name =
  $("name")
  .value
  .trim();


  const code =
  $("code")
  .value
  .trim();


  if(!code){

    alert(
      "請輸入商品條碼"
    );

    return;

  }


  state.items.push({

    name,

    code,

    qty:1,

    selected:true

  });


  $("name").value =
  "";


  $("code").value =
  "";


  renderItems();

/* =========================
   批次
========================= */

$("bulkAddBtn").onclick =
() => {

  const text =
  $("bulkInput")
  .value
  .trim();


  if(!text){

    $("bulkStatus")
    .textContent =
    "請先輸入資料";

    return;

  }


  let added = 0;

  let skipped = 0;


  for(
    const raw
    of text.split(/\r?\n/)
  ){

    const line =
    raw.trim();


    if(!line)
    continue;


    let name = "";

    let code = "";


    if(
      line.includes("\t")
    ){

      const parts =
      line.split("\t");


      name =
      (
        parts[0] ||
        ""
      ).trim();


      code =
      (
        parts[1] ||
        ""
      ).trim();

    }


    else if(
      line.includes(",")
    ){

      const parts =
      line.split(",");


      code =
      (
        parts.pop() ||
        ""
      ).trim();


      name =
      parts
      .join(",")
      .trim();

    }


    else{

      const match =
      line.match(
        /^(.*?)[\s]+(\d{6,})$/
      );


      if(match){

        name =
        match[1]
        .trim();


        code =
        match[2]
        .trim();

      }

    }


    if(!code){

      skipped++;

      continue;

    }


    state.items.push({

      name,

      code,

      qty:1,

      selected:true

    });


    added++;

  }


  $("bulkStatus")
  .textContent =
  `已加入 ${added} 筆`
  +
  (
    skipped
    ?
    `，略過 ${skipped} 筆`
    :
    ""
  );


  if(added){

    $("bulkInput").value =
    "";

  }


  renderItems();

  drawPreview();

};

/* =========================
   建立列印清單
========================= */

function expandedItems(
  mode="selected"
){

  const source =

  mode === "all"

  ?

  state.items

  :

  state.items.filter(
    item =>
    item.selected
  );


  const output =
  [];


  for(
    const item
    of source
  ){

    const qty =
    Math.max(
      1,
      Number(item.qty) ||
      1
    );


    for(
      let i=0;
      i<qty;
      i++
    ){

      output.push(item);

    }

  }


  return output;

}


/* =========================
   Preview
========================= */

function buildCanvas(
  printItems
){

  const width =
  paperDots(
    Number(
      $("paperWidth").value
    )
  );


  const margin =
  mmToPx(2);


  const contentWidth =
  width -
  margin * 2;


  const barcodeHeight =
  mmToPx(
    Number(
      $("barcodeHeight").value
    )
  );


  const gap =
  mmToPx(
    Number(
      $("itemGap").value
    )
  );


  const blocks =
  printItems.map(
    item => {

      const barcode =
      makeBarcode(
        item.code,
        contentWidth,
        barcodeHeight
      );


      return {
        item,
        barcode,
        height:
        32 +
        barcode.height +
        gap
      };

    }
  );


  const footer =
  $("footerText")
  .value
  .trim();


  let height =
  mmToPx(2);


  for(
    const block
    of blocks
  ){

    height +=
    block.height;

  }


  if(footer){

    height +=
    34;

  }


  height +=
  mmToPx(2);


  if(
    height >
    65000
  ){

    throw new Error(
      "列印內容太長，請分批列印"
    );

  }


  const canvas =
  document.createElement(
    "canvas"
  );


  canvas.width =
  width;


  canvas.height =
  Math.max(
    24,
    height
  );


  const ctx =
  canvas.getContext(
    "2d"
  );


  ctx.fillStyle =
  "#fff";


  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.fillStyle =
  "#000";


  ctx.textAlign =
  "center";


  ctx.textBaseline =
  "top";


  let y =
  mmToPx(2);


  for(
    const block
    of blocks
  ){

    ctx.font =
    '700 21px "PingFang TC","Microsoft JhengHei",sans-serif';


    ctx.fillText(
      block.item.name ||
      "",
      width / 2,
      y,
      contentWidth
    );


    y +=
    32;


    ctx.imageSmoothingEnabled =
    false;


    ctx.drawImage(
      block.barcode,
      (
        width -
        block.barcode.width
      ) / 2,
      y
    );


    y +=
    block.barcode.height
    +
    gap;

  }


  if(footer){

    ctx.font =
    '700 18px "PingFang TC","Microsoft JhengHei",sans-serif';


    ctx.fillText(
      footer,
      width/2,
      y,
      contentWidth
    );

  }


  return canvas;

}


function drawPreview(){

  const selected =
  expandedItems(
    "selected"
  );


  const list =
  selected.length
  ?
  selected
  :
  expandedItems(
    "all"
  );


  try{

    const source =
    buildCanvas(list);


    const target =
    $("previewCanvas");


    target.width =
    source.width;


    target.height =
    source.height;


    target
    .getContext("2d")
    .drawImage(
      source,
      0,
      0
    );

  }

  catch(error){

    alert(
      error.message
    );

  }

}


/* =========================
   Canvas → BW1
========================= */

function sameRow(a,b){

  if(
    a.length !==
    b.length
  ){

    return false;

  }


  for(
    let i=0;
    i<a.length;
    i++
  ){

    if(
      a[i] !==
      b[i]
    ){

      return false;

    }

  }


  return true;

}


function canvasToRuns(canvas){

  const ctx =
  canvas.getContext(
    "2d"
  );


  const pixels =
  ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  ).data;


  const width =
  canvas.width;


  const height =
  canvas.height;


  const bytesPerRow =
  width / 8;


  const rows =
  [];


  for(
    let y=0;
    y<height;
    y++
  ){

    const row =
    new Uint8Array(
      bytesPerRow
    );


    let black =
    0;


    for(
      let x=0;
      x<width;
      x++
    ){

      const index =
      (
        y *
        width +
        x
      ) * 4;


      const gray =
      (
        pixels[index] * 299
        +
        pixels[index+1] * 587
        +
        pixels[index+2] * 114
      )
      /
      1000;


      if(
        gray <
        170
      ){

        row[x >> 3] |=
        0x80 >>
        (x & 7);


        black++;

      }

    }


    rows.push({
      data:row,
      black
    });

  }


  const runs =
  [];


  let y =
  0;


  while(
    y <
    rows.length
  ){

    const first =
    rows[y];


    let repeat =
    1;


    while(
      y + repeat <
      rows.length
      &&
      repeat <
      255
      &&
      sameRow(
        first.data,
        rows[y+repeat].data
      )
    ){

      repeat++;

    }


    runs.push({

      row:y,

      repeat,

      data:first.data,

      black:first.black

    });


    y +=
    repeat;

  }


  return runs;

}


function rowPacket(run){

  const count = [

    0x00,

    run.black &
    0xFF,

    (
      run.black >>
      8
    ) &
    0xFF

  ];


  return frame(
    0x85,
    [

      ...u16(
        run.row
      ),

      ...count,

      run.repeat,

      ...run.data

    ]
  );

}


/* =========================
   BLE UI
========================= */

function updateButtons(){

  const connected =
  !!state.server?.connected
  &&
  !!state.write
  &&
  !!state.notify;


  const selected =
  state.items.some(
    item =>
    item.selected
  );


  $("disconnectBtn").disabled =
  !connected;


  $("printSelectedBtn").disabled =
  !(
    connected
    &&
    selected
    &&
    !state.printing
    &&
    !state.needsReconnect
  );


  $("printAllBtn").disabled =
  !(
    connected
    &&
    state.items.length
    &&
    !state.printing
    &&
    !state.needsReconnect
  );


  $("gattState")
  .textContent =
  String(
    !!state.server?.connected
  );


  $("channelState")
  .textContent =
  connected
  ?
  "已就緒"
  :
  "未就緒";

}


/* =========================
   Connect
========================= */

$("connectBtn").onclick =
async () => {

  try{

    $("bleStatus")
    .className =
    "status warn";


    $("bleStatus")
    .textContent =
    "正在連接 B3S…";


    const device =
    await navigator.bluetooth
    .requestDevice({

      acceptAllDevices:true,

      optionalServices:[
        SERVICE
      ]

    });


    state.device =
    device;


    $("deviceName")
    .textContent =
    device.name ||
    "—";


    state.server =
    await device.gatt
    .connect();


    const service =
    await state.server
    .getPrimaryService(
      SERVICE
    );


    state.write =
    await service
    .getCharacteristic(
      WRITE_UUID
    );


    state.notify =
    await service
    .getCharacteristic(
      NOTIFY_UUID
    );


    state.rx =
    [];


    state.needsReconnect =
    false;


    state.notify
    .addEventListener(
      "characteristicvaluechanged",
      event => {

        const value =
        event.target.value;


        const bytes =
        new Uint8Array(
          value.buffer,
          value.byteOffset,
          value.byteLength
        );


        const data =
        hex(bytes);


        state.rx.push({
          hex:data
        });


        if(
          state.rx.length >
          1000
        ){

          state.rx.shift();

        }


        log(
          "RX：" +
          data
        );

      }
    );


    await state.notify
    .startNotifications();


    device.addEventListener(
      "gattserverdisconnected",
      () => {

        state.server =
        null;


        state.write =
        null;


        state.notify =
        null;


        state.printing =
        false;


        state.needsReconnect =
        false;


        $("bleStatus")
        .className =
        "status warn";


        $("bleStatus")
        .textContent =
        "已中斷";


        updateButtons();

      }
    );


    $("bleStatus")
    .className =
    "status ok";


    $("bleStatus")
    .textContent =
    "✅ B3S 已連線";


    log(
      "V13 B3S ready"
    );


    updateButtons();

  }

  catch(error){

    $("bleStatus")
    .className =
    "status err";


    $("bleStatus")
    .textContent =
    "連線失敗：" +
    error.message;


    updateButtons();

  }

};


$("disconnectBtn").onclick =
() => {

  try{

    state.device
    ?.gatt
    ?.disconnect();

  }catch{}

};


/* =========================
   列印進度
========================= */

function progress(
  percent,
  text=""
){

  $("progressBar")
  .style
  .width =
  Math.max(
    0,
    Math.min(
      100,
      percent
    )
  )
  +
  "%";


  if(text){

    $("printMeta")
    .textContent =
    text;

  }

}


async function ackStep(
  label,
  packet,
  expected,
  timeout=3500
){

  $("printStatus")
  .className =
  "status warn";


  $("printStatus")
  .textContent =
  label;


  const result =
  await sendWait(
    packet,
    expected,
    timeout
  );


  if(
    result.ok
  ){

    return result;

  }


  if(
    result.unsupported
  ){

    throw new Error(
      `${label}：CMD 00 NOT_SUPPORTED`
    );

  }


  throw new Error(
    `${label}：等待回應逾時`
  );

}


/* =========================
   列印核心
========================= */

async function printItems(
  printList,
  sourceItems
){

  if(
    !printList.length
  ){

    alert(
      "沒有可列印商品"
    );

    return;

  }


  state.printing =
  true;


  updateButtons();


  progress(
    0,
    "建立列印資料…"
  );


  try{

    const canvas =
    buildCanvas(
      printList
    );


    const runs =
    canvasToRuns(
      canvas
    );


    $("printMeta")
    .textContent =
    `${printList.length} 份｜${canvas.width} × ${canvas.height} dots`;


    await ackStep(
      "CONNECT",
      CONTROL.connect(),
      0xC2
    );


    progress(5);


    await ackStep(
      "SET DENSITY",
      CONTROL.density(
        Number(
          $("density").value
        )
      ),
      0x31
    );


    progress(10);


    await ackStep(
      "SET LABEL TYPE",
      CONTROL.label(),
      0x33
    );


    progress(15);


    await ackStep(
      "PRINT START",
      CONTROL.printStart(),
      0x02
    );


    progress(20);


    await ackStep(
      "PAGE START",
      CONTROL.pageStart(),
      0x04
    );


    progress(25);


    await ackStep(
      "SET PAGE SIZE",
      CONTROL.pageSize(
        canvas.height,
        canvas.width
      ),
      0x14,
      5000
    );


    progress(
      30,
      `傳送點陣 0/${runs.length}`
    );


    for(
      let index=0;
      index<runs.length;
      index++
    ){

      await writeRaw(
        rowPacket(
          runs[index]
        )
      );


      if(
        index % 4 === 0
      ){

        progress(
          30
          +
          Math.round(
            (
              index + 1
            )
            /
            runs.length
            *
            55
          ),

          `傳送點陣 ${index+1}/${runs.length}`
        );


        await delay(8);

      }

    }


    progress(
      88,
      "正在結束頁面…"
    );


    await ackStep(
      "PAGE END",
      CONTROL.pageEnd(),
      0xE4,
      7000
    );


    progress(94);


    await delay(500);


    const end =
    await sendWait(
      CONTROL.printEnd(),
      0xF4,
      7000
    );


    if(
      !end.ok
    ){

      throw new Error(
        "PRINT END 沒有收到 F4"
      );

    }


    progress(
      100,
      "列印完成"
    );


    $("printStatus")
    .className =
    "status ok";


    $("printStatus")
    .textContent =
    "✅ B3S 列印完成";


    state.needsReconnect =
    false;


    if(
      $("autoClear").checked
    ){

      state.items =
      state.items.filter(
        item =>
        !sourceItems.includes(item)
      );


      renderItems();

      drawPreview();

    }

  }

  catch(error){

    $("printStatus")
    .className =
    "status err";


    $("printStatus")
    .textContent =
    "❌ " +
    error.message;


    $("printMeta")
    .textContent =
    "請中斷 B3S 再重新連線後重試。";


    log(
      "PRINT ERROR：" +
      error.message
    );


    state.needsReconnect =
    true;

  }

  finally{

    state.printing =
    false;


    updateButtons();

  }

}

/* =========================
   相機
========================= */

let scanner =
null;


let scanning =
false;


$("scanBtn").onclick =
async () => {

  $("scannerModal")
  .style.display =
  "block";


  try{

    scanner =
    new Html5Qrcode(
      "qrReader"
    );


    await scanner.start(

      {
        facingMode:
        "environment"
      },

      {
        fps:12,
        qrbox:{
          width:280,
          height:130
        }
      },

      decoded => {

        $("code").value =
        decoded;


        $("scannerStatus")
        .className =
        "status ok";


        $("scannerStatus")
        .textContent =
        "掃描成功：" +
        decoded;


        setTimeout(
          closeScanner,
          400
        );

      },

      () => {}

    );


    scanning =
    true;


    $("scannerStatus")
    .className =
    "status ok";


    $("scannerStatus")
    .textContent =
    "請對準條碼";

  }

  catch(error){

    $("scannerStatus")
    .className =
    "status err";


    $("scannerStatus")
    .textContent =
    "相機啟動失敗：" +
    error.message;

  }

};


async function closeScanner(){

  try{

    if(
      scanner &&
      scanning
    ){

      await scanner.stop();

    }

  }catch{}


  try{

    if(scanner){

      await scanner.clear();

    }

  }catch{}


  scanner =
  null;


  scanning =
  false;


  $("scannerModal")
  .style.display =
  "none";

}
